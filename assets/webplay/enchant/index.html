<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Enchant In Chart</title>
<link rel="icon" href="assets/branding/favicon.png">
<link rel="stylesheet" href="css/style.css?v=21">
</head>
<body>
<div id="app">
  <!-- 공통 배경 -->
  <div id="bg">
    <img class="bg-top" src="assets/decor/greenhouse.png" alt="">
    <img class="bg-moss" src="assets/decor/moss-strip.png" alt="">
  </div>

  <!-- 타이틀 (키비주얼 01) -->
  <section id="scr-title" class="screen">
    <img id="titleLogo" class="title-logo" src="assets/logos/title-ko.png" alt="">
    <img class="title-vine" src="assets/decor/mobile/header-leaves.png" alt="">
    <div class="title-sub" data-i18n="ui.titleSub"></div>
    <img class="title-art" src="assets/illustrations/cover-vignette.png" alt="">
    <button id="btnStart" class="m-leaf big-btn"><span data-i18n="ui.start"></span></button>
    <div class="lang-row" data-langrow></div>
  </section>

  <!-- 스테이지 선택 (키비주얼 02) -->
  <section id="scr-select" class="screen">
    <button id="btnBack" class="n-iconbtn sq-btn"><img src="assets/icons/chevron-left.png" alt=""></button>
    <div class="top-row">
      <div class="n-pill coin-pill"><img src="assets/icons/coin.png" alt=""><span data-coin></span></div>
      <button class="n-iconbtn sq-btn" data-open-settings><img src="assets/icons/settings.png" alt=""></button>
    </div>
    <img class="select-cache" src="assets/portraits/cache-surprised.png" alt="">
    <div class="journal m-journal">
      <h1><img class="sprig" src="assets/decor/mobile/button-leaf.png" alt=""><span data-i18n="ui.journal"></span><img class="sprig flip" src="assets/decor/mobile/button-leaf.png" alt=""></h1>
      <div class="journal-rule"><i></i><b>✦</b><i></i></div>
      <div id="chapterList"></div>
    </div>
    <img class="journal-bookmark" src="assets/decor/mobile/journal-bookmark.png" alt="">
    <img class="journal-latch" src="assets/decor/mobile/journal-latch.png" alt="">
    <div class="dummy-row">
      <button class="n-btn menu-btn" data-dummy><img src="assets/icons/mobile/attendance.png" alt=""><span data-i18n="ui.attend"></span></button>
      <button class="n-btn menu-btn" data-dummy><img src="assets/icons/mobile/ad-reward.png" alt=""><span data-i18n="ui.ad"></span></button>
      <button class="n-btn menu-btn" data-dummy><img src="assets/icons/mobile/shop.png" alt=""><span data-i18n="ui.shop"></span></button>
    </div>
    <img class="deco-books" src="assets/decor/books.png" alt="">
    <img class="deco-terrarium" src="assets/decor/terrarium.png" alt="">
  </section>

  <!-- 스토리 컷 -->
  <section id="scr-story" class="screen">
    <button id="btnSkip" class="n-btn small-btn" data-i18n="ui.skip"></button>
    <div id="cut" class="n-portrait">
      <div id="cutArt"></div>
      <div id="cutLabel"></div>
    </div>
    <div id="storyBox" class="n-speech">
      <div id="storyTxt"></div>
      <div class="tap-next" data-i18n="ui.tapNext"></div>
    </div>
  </section>

  <!-- 인게임 -->
  <section id="scr-game" class="screen">
    <div id="portrait" class="n-portrait"><img id="portraitImg" src="assets/portraits/cache-neutral.png" alt=""></div>
    <div id="hearts" class="n-pill"></div>
    <div id="coinPill" class="n-pill coin-pill"><img src="assets/icons/coin.png" alt=""><span data-coin></span></div>
    <button id="btnSettings" class="n-iconbtn" data-open-settings><img src="assets/icons/settings.png" alt=""></button>
    <img id="speechTail" src="assets/ui/speech-tail.png" alt="">
    <div id="speech" class="n-speech"><div id="speechTxt"></div><div id="speechNext">▼</div></div>
    <img class="hud-clover" src="assets/decor/mobile/hud-clover.png" alt="">
    <img class="hud-flower" src="assets/decor/mobile/hud-wildflower.png" alt="">
    <div id="objective" class="n-objective"><div id="objTxt"></div></div>
    <div id="objLabel" class="n-objlabel"><img src="assets/icons/chevron-left.png" alt=""><span data-i18n="ui.objective"></span><img src="assets/icons/chevron-right.png" alt=""></div>
    <div id="stars"></div>

    <div id="central" class="n-central"></div>
    <div id="boardFrame" class="n-board"></div>
    <div id="board"><div id="cells"></div><div id="blocks"></div></div>
    <div id="tray" class="n-tray"></div>
    <button id="btnHint" class="n-iconbtn"><img src="assets/icons/hint.png" alt=""><img class="glint" src="assets/fx/hint-glint.png" alt=""></button>
    <button id="btnUndo" class="n-iconbtn"><img src="assets/icons/undo.png" alt=""></button>

    <div id="inspector" class="n-inspector">
      <div id="insPreview" class="n-preview"><div id="insImg"></div></div>
      <div id="insHead"><span id="insTag" class="n-tag"></span><span id="insName"></span></div>
      <div id="insWordsLabel" data-i18n="ui.words"></div>
      <div id="insStates"></div>
      <div class="ins-hr"></div>
      <div id="insKws"></div>
      <div class="ins-vr"></div>
      <div id="selKw"></div>
      <div id="descLabel"><span data-i18n="ui.desc"></span><i></i></div>
      <div id="descBox" class="n-desc"><div id="descTxt"></div></div>
    </div>
    <img class="deco-books" src="assets/decor/books.png" alt="">
    <img class="deco-terrarium" src="assets/decor/terrarium.png" alt="">

    <svg id="dim" viewBox="0 0 1024 1536"><path id="dimPath" fill="#000" fill-rule="evenodd"></path></svg>
    <div id="blocker"></div>
    <img id="finger" src="assets/guides/tap-finger.png" alt="">
  </section>

  <!-- 클리어 결과 (키비주얼 05) -->
  <section id="scr-result" class="screen">
    <img class="result-pollen" src="assets/fx/celebration-pollen.png" alt="">
    <div class="result-panel m-result">
      <img id="clearLogo" class="clear-logo" src="assets/logos/clear-ko.png" alt="">
      <div class="result-stage" id="resStage"></div>
      <img class="result-art" src="assets/illustrations/clear-vignette.png" alt="">
      <div id="resStars"></div>
      <div id="resMistakes"></div>
      <div class="result-reward"><span data-i18n="ui.reward"></span><img src="assets/icons/coin.png" alt=""><b id="resCoin"></b></div>
      <button id="btnBuyStar" class="n-btn small-btn"></button>
      <button id="btnNext" class="m-leaf big-btn"><span data-i18n="ui.next"></span></button>
      <div class="result-row">
        <button id="btnRetry" class="m-cream small-btn" data-i18n="ui.retry"></button>
        <button id="btnToSelect" class="m-cream small-btn" data-i18n="ui.toSelect"></button>
      </div>
    </div>
    <div class="top-row"><div class="n-pill coin-pill"><img src="assets/icons/coin.png" alt=""><span data-coin></span></div></div>
  </section>

  <div id="modal"><div id="modalBox"></div></div>
  <div id="toast"></div>
</div>

<script src="js/i18n.js?v=21"></script>
<script src="js/stages.js?v=21"></script>
<script src="js/engine.js?v=21"></script>
<script src="js/game.js?v=21"></script>
</body>
</html>
