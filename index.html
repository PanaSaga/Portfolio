<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<meta name="color-scheme" content="light" />
<title>Portfolio</title>
<meta name="description" content="게임 기획 포트폴리오" />

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />

<style>
/* ============================================================
   Design tokens — Lightdash
   ============================================================ */
:root{
  /* 배경1 카드·작은 글씨 면 / 배경2 기본 톤 / 배경3 진한 구역 / 배경4 글씨 얹는 보라 */
  --surface:#f7f5f2;
  --canvas:#f3f0ec;
  --cloud:#efebe6;
  --frost:#e7e2db;
  --accent-soft:#e2c2ff;
  --violet-deep:#4a30dd;
  --ash:#e6dccb;
  --mist:#dbcfba;
  --fog:#444d60;
  --steel:#444d60;
  --slate:#444d60;
  --graphite:#36394a;
  --midnight:#272835;
  --onyx:#1a1b25;
  --violet:#5e4cff;
  --lavender:#c8ccf3;
  --lilac:#e2c2ff;

  /* 모자이크 톤 (레퍼런스 히어로 그라데이션) */
  --px1:#e6e2fa;
  --px2:#c9c2f5;
  --px3:#8a76ec;
  --px4:#4a30dd;
  --px5:#241a8f;

  --font-sans:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Roboto,'Helvetica Neue',sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace;

  --text-caption:12px;
  --text-body-sm:14px;
  --text-body:16px;
  --text-subheading:20px;
  --text-heading-sm:24px;
  --text-heading:32px;

  --s4:4px; --s8:8px; --s12:12px; --s16:16px; --s20:20px; --s24:24px;
  --s32:32px; --s40:40px; --s48:48px; --s64:64px; --s80:80px;

  --page-max:1200px;
  --nav-h:60px;

  --r-card:12px;
  --r-btn:8px;
  --r-pill:999px;

  --sh-hairline:rgba(39,40,53,.10) 0 0 0 1px;
  --sh-card:rgba(39,40,53,.10) 0 0 0 1px, rgba(39,40,53,.08) 0 24px 24px -12px, rgba(39,40,53,.08) 0 12px 12px -6px, rgba(39,40,53,.08) 0 6px 6px -3px, rgba(39,40,53,.08) 0 2px 2px -1px;
  --sh-soft:rgba(39,40,53,.05) 0 0 0 1px, rgba(39,40,53,.02) 0 30px 18px 0, rgba(39,40,53,.04) 0 13px 13px 0, rgba(39,40,53,.05) 0 3px 7px 0;

  --sa-l:env(safe-area-inset-left, 0px);
  --sa-r:env(safe-area-inset-right, 0px);
  --sa-b:env(safe-area-inset-bottom, 0px);
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--canvas);
  color:var(--graphite);
  font-family:var(--font-sans);
  font-size:var(--text-body);
  line-height:1.5;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:rgba(94,76,255,.12);
  word-break:keep-all;
  overflow-wrap:break-word;
}
img{max-width:100%;height:auto;display:block;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
a,button,.navlink,.tab,select,summary{cursor:pointer;}
input{font:inherit;color:inherit;}

/* ── 커스텀 커서: 3상태 ──
   ① 기본     : 보라 그라데이션 커스텀 화살표 (주황 발광 없음)
   ② 손가락   : 링크·버튼 위에서 커서가 주황색으로 빛남
   ③ 클릭     : 노란 반짝이 이펙트                                         */
@media (pointer:fine){
  body,a,button,.navlink,.tab,select,summary,label,input,.ppage,.donut__seg{cursor:none;}
  .cursor{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;opacity:0;
    width:24px;height:24px;margin:-2px 0 0 -2px;transform-origin:2px 1.6px;
    transition:transform .12s ease;}
  .cursor svg{width:100%;height:100%;display:block;overflow:visible;
    filter:drop-shadow(0 1px 3px rgba(36,26,143,.35));}
  .cursor svg path{paint-order:stroke;stroke:#fdf7ed;stroke-width:1.5;
    stroke-linejoin:round;stroke-linecap:round;
    transition:stroke .14s ease,stroke-width .14s ease;}
  /* ② 손가락 위 — 주황색으로 빛남 */
  .cursor.is-hover{transform:scale(1.1);}
  .cursor.is-hover svg{filter:drop-shadow(0 0 5px rgba(249,138,23,.9)) drop-shadow(0 0 2px rgba(249,138,23,.95));}
  .cursor.is-hover svg path{stroke:#f98a17;stroke-width:2.4;}
  .cursor.is-down{transform:scale(.85);}
  .spark{position:fixed;z-index:9998;pointer-events:none;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
    background:#ffcf1a;
    clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
    animation:sparkPop .5s ease-out forwards;}
  @keyframes sparkPop{
    0%{opacity:1;transform:translate(0,0) scale(1) rotate(0);}
    100%{opacity:0;transform:translate(var(--dx,0),var(--dy,0)) scale(.25) rotate(90deg);}
  }
}
ul,ol{margin:0;padding:0;list-style:none;}
h1,h2,h3,h4,p{margin:0;}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:4px;}

/* ============================================================
   Layout
   ============================================================ */
.wrap{
  width:100%;max-width:var(--page-max);margin:0 auto;
  padding-left:calc(20px + var(--sa-l));
  padding-right:calc(20px + var(--sa-r));
}
.band{padding-top:var(--s64);padding-bottom:var(--s64);}
.band--cloud{background:var(--cloud);}
.band--surface{background:var(--surface);}   /* 작은 글씨가 많은 구역 */
.band--tight{padding-top:var(--s40);padding-bottom:var(--s40);}

.sec-head{margin-bottom:var(--s24);display:flex;align-items:center;gap:var(--s16);}
.sec-head__ico{width:56px;height:56px;flex:0 0 auto;object-fit:contain;}
@media (max-width:559px){.sec-head__ico{width:44px;height:44px;}.sec-head{gap:var(--s12);}}
.sec-eyebrow{
  font-size:var(--text-caption);font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--violet);margin-bottom:4px;
}
.sec-title{
  font-size:clamp(20px,4vw,var(--text-heading-sm));
  font-weight:700;letter-spacing:-.02em;line-height:1.15;color:var(--graphite);
}
.sec-desc{margin-top:6px;color:var(--slate);font-size:var(--text-body-sm);}
.ln2{color:var(--violet-deep);}

.grid{display:grid;gap:var(--s16);}
.grid--1{grid-template-columns:minmax(0,1fr);}
.grid--2{grid-template-columns:minmax(0,1fr);}
.grid--3{grid-template-columns:minmax(0,1fr);}
.grid--4{grid-template-columns:repeat(2,minmax(0,1fr));}
@media (min-width:640px){
  .grid--2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .grid--3{grid-template-columns:repeat(2,minmax(0,1fr));}
  /* 기획서(grid--4)는 AI·메인이 2열일 때 3열 */
  .grid--4{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media (min-width:900px){
  .grid--3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .grid--4{grid-template-columns:repeat(4,minmax(0,1fr));}
}
/* 2:1 / 1:2 분할 */
.split{display:grid;gap:var(--s32);}
@media (min-width:900px){
  .split{grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:var(--s40);}   /* 좌 1 · 우 2 */
  .split--21{grid-template-columns:minmax(0,2fr) minmax(0,1fr);}              /* 좌 2 · 우 1 */
  .split--32{grid-template-columns:minmax(0,3fr) minmax(0,2fr);}              /* 좌 3 · 우 2 */
}

/* ============================================================
   Nav
   ============================================================ */
.nav{
  position:-webkit-sticky;position:sticky;top:0;z-index:50;
  background:rgba(243,240,236,.92);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--ash);
  padding-top:env(safe-area-inset-top, 0px);
}
.nav__inner{display:flex;align-items:center;justify-content:space-between;gap:var(--s12);height:var(--nav-h);}
.brand{display:flex;align-items:center;gap:var(--s8);flex:0 0 auto;}
.brand__mark{width:22px;height:22px;border-radius:5px;background:var(--accent-soft);display:grid;place-items:center;color:var(--violet-deep);font-size:12px;font-weight:700;letter-spacing:-.02em;}
.brand__name{font-size:var(--text-body-sm);font-weight:600;letter-spacing:-.02em;white-space:nowrap;}
.navlinks{display:flex;align-items:center;gap:var(--s4);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -4px;padding:0 4px;}
.navlinks::-webkit-scrollbar{display:none;}
.navlink{flex:0 0 auto;padding:8px 12px;border-radius:var(--r-btn);font-size:var(--text-body-sm);font-weight:500;color:var(--slate);white-space:nowrap;transition:color .15s ease,background-color .15s ease;}
.navlink:hover{color:var(--graphite);background:var(--cloud);}
.navlink.is-active{color:var(--graphite);background:var(--frost);}
@media (max-width:560px){.brand__name{display:none;}.navlink{padding:8px 10px;}}

/* ============================================================
   Buttons / chips
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:11px 18px;border-radius:var(--r-btn);font-size:var(--text-body-sm);font-weight:500;letter-spacing:-.01em;transition:background-color .15s ease,border-color .15s ease,color .15s ease;}
.btn--violet{background:var(--accent-soft);color:var(--violet-deep);}
.btn--violet:hover{background:#d7aeff;}
.btn--ghost{background:var(--surface);border:1px solid var(--ash);color:var(--graphite);}
.btn--ghost:hover{border-color:var(--steel);}
.btn--dark{background:var(--midnight);color:#fff;}
.btn--dark:hover{background:var(--onyx);}
.btn--sm{min-height:36px;padding:8px 14px;font-size:13px;}

.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--r-pill);background:var(--cloud);color:var(--graphite);font-size:var(--text-caption);font-weight:500;letter-spacing:-.01em;white-space:nowrap;}
.chip--violet{background:var(--accent-soft);color:var(--violet-deep);}
.chip--xs{padding:2px 7px;font-size:11px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}

/* ============================================================
   Cards
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--ash);border-radius:var(--r-card);padding:var(--s16);}
.card--pad{padding:var(--s20);}
.card--soft{border-color:transparent;box-shadow:var(--sh-soft);}
.card__title{font-size:var(--text-subheading);font-weight:600;letter-spacing:-.02em;line-height:1.3;}
.card__body{margin-top:var(--s8);color:var(--slate);font-size:var(--text-body-sm);line-height:1.65;}
.card__meta{margin-top:var(--s4);color:var(--steel);font-size:var(--text-caption);}
a.card{display:block;transition:box-shadow .18s ease,border-color .18s ease,transform .18s ease;}
a.card:hover{border-color:transparent;box-shadow:var(--sh-card);}
a.card:active{transform:scale(.995);}

/* ============================================================
   Placeholder
   ============================================================ */
.ph{color:inherit;font-weight:400;}
.ph--plain{color:inherit;}
.ph-block{display:block;padding:var(--s20);border-radius:var(--r-card);background:var(--frost);color:var(--slate);font-size:var(--text-body-sm);text-align:center;}
.ph-block code{font-family:var(--font-mono);font-size:12px;color:var(--violet-deep);background:var(--accent-soft);border-radius:4px;padding:1px 5px;}
.ph-img{display:grid;place-items:center;border-radius:var(--r-card);background:var(--frost);color:var(--steel);font-size:var(--text-caption);aspect-ratio:16/9;width:100%;}

/* ============================================================
   아이콘 (assets/icons/*.png)
   ============================================================ */
.pico{display:inline-block;vertical-align:-.22em;width:1.3em;height:1.3em;flex:0 0 auto;object-fit:contain;}

/* ============================================================
   Hero + 코너 픽셀 모자이크
   ============================================================ */
/* About 로그라인 · Resume 인적사항 — 같은 높이, 하단 흰색에서 위로 아이보리 */
:root{--top-h:400px;}
.topblock{
  position:relative;overflow:hidden;
  background:var(--cloud);
  display:flex;align-items:center;
  padding:var(--s40) 0;
}
@media (min-width:900px){.topblock{min-height:var(--top-h);padding:var(--s48) 0;}}
.topblock__bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0;}
.topblock__bg::after{content:"";position:absolute;inset:0;background:rgba(243,240,236,.55);}
.topblock > .wrap,.topblock .hero__inner{position:relative;z-index:2;width:100%;}

.hero{position:relative;padding:0;}
.hero__inner{position:relative;z-index:1;}
/* 히어로 한 문장 — 가운데 정렬, 둘째 줄은 JS 로 첫 줄 둘째 어절 아래까지 들여씀(Z자) */
/* 폰트는 화면 폭에 따라 계속 줄어들도록 vw 항을 크게(약 1240px 이하부터 작아짐) */
.hero__logline{font-size:clamp(26px,5.1vw,64px);line-height:1.12;letter-spacing:-.03em;font-weight:700;
  color:var(--graphite);width:fit-content;max-width:100%;margin-inline:auto;}
.hero__logline .zl{display:block;}
.hero__logline .zl:nth-child(even){color:var(--violet-deep);}
.hero__sub{margin-top:var(--s16);text-align:center;}
/* 히어로 안 연락처 — 문장 아래, 가운데 정렬, 픽토그램 포함 */
.hero__contact{display:flex;flex-wrap:wrap;justify-content:center;gap:8px var(--s24);
  margin-top:var(--s24);color:var(--graphite);font-weight:600;}
.hero__contact span{display:inline-flex;align-items:center;gap:8px;font-size:clamp(17px,2.2vw,20px);letter-spacing:-.01em;}
.hero__contact .pico{width:1.05em;height:1.05em;}
/* 보조 문단(선택) */
.hero__sub{margin-top:var(--s16);max-width:44ch;margin-inline:auto;color:var(--violet-deep);font-size:clamp(18px,4vw,30px);line-height:1.4;letter-spacing:-.025em;font-weight:500;text-align:center;}
.hero__sub p + p{margin-top:var(--s16);}
.hero__cta{display:flex;flex-wrap:wrap;gap:var(--s8);margin-top:var(--s24);}

.mosaic{--tile:28px;display:flex;flex-direction:column;line-height:0;pointer-events:none;}
.mrow{display:flex;}
.mt{width:var(--tile);height:var(--tile);}
.mt.t1{background:var(--px1);}
.mt.t2{background:var(--px2);}
.mt.t3{background:var(--px3);}
.mt.t4{background:var(--px4);}
.mt.t5{background:var(--px5);}
.mt.tx{background:repeating-linear-gradient(135deg,var(--px3) 0 3px,var(--px2) 3px 6px);}
/* 오른쪽 위에서 왼쪽 아래로 스르륵 나타난다 (페이지를 새로 열 때 한 번) */
.mosaic--in .mt{opacity:0;animation:mosaicIn .55s cubic-bezier(.22,.7,.3,1) both;}
@keyframes mosaicIn{
  from{opacity:0;transform:translate3d(14px,-14px,0) scale(.82);}
  to{opacity:1;transform:translate3d(0,0,0) scale(1);}
}
@media (prefers-reduced-motion:reduce){
  .mosaic--in .mt{opacity:1;animation:none;}
}
/* 화면 크기와 상관없이 항상 라우트 우상단에 고정 (글자와 겹쳐도 됨) */
.hero__anchor{position:absolute;top:0;left:0;right:0;height:0;z-index:0;}
.hero__anchor .wrap{position:relative;height:0;padding:0;}
.mosaic{position:absolute;top:0;right:calc(20px + var(--sa-r));z-index:0;--tile:30px;}
/* About 이외의 페이지는 조밀한 코너 부분만 */
.route > .hero__anchor .mrow:nth-child(n+8){display:none;}
@media (max-width:899px){.mosaic{--tile:clamp(13px,3.4vw,22px);}}
@media (max-width:559px){.mosaic{--tile:11px;opacity:.9;}}

/* Work style — 3열, 헤어라인만으로 구분 */
.ws{display:grid;border-top:1px solid var(--ash);}
@media (min-width:820px){.ws{grid-template-columns:repeat(3,minmax(0,1fr));}}
.ws__item{padding:var(--s24) 0 var(--s32);border-bottom:1px solid var(--frost);}
@media (min-width:820px){
  .ws__item{padding:var(--s24) var(--s24) var(--s32) 0;border-bottom:0;}
  .ws__item + .ws__item{padding-left:var(--s24);border-left:1px solid var(--frost);}
}
.ws__top{display:flex;align-items:center;gap:var(--s12);}
.ws__icon{width:44px;height:44px;flex:0 0 auto;object-fit:contain;}
.ws__title{font-size:var(--text-heading-sm);font-weight:600;letter-spacing:-.02em;line-height:1.25;color:var(--graphite);}
.ws__desc{margin-top:var(--s12);color:var(--slate);font-size:17px;line-height:1.7;}

/* 대표 프로젝트 — 게시물 카드가 오른쪽에서 왼쪽으로 흐른다 */
/* 페이드가 본문 열(1200px)의 좌우 끝에 맞춰 거의 다 빠지도록 */
.marquee{position:relative;overflow:hidden;padding:var(--s8) 0 var(--s24);
  --edge:20px;
  -webkit-mask-image:linear-gradient(90deg,
    transparent 0, transparent var(--edge), #000 calc(var(--edge) + 130px),
    #000 calc(100% - var(--edge) - 130px), transparent calc(100% - var(--edge)), transparent 100%);
  mask-image:linear-gradient(90deg,
    transparent 0, transparent var(--edge), #000 calc(var(--edge) + 130px),
    #000 calc(100% - var(--edge) - 130px), transparent calc(100% - var(--edge)), transparent 100%);}
@media (min-width:1240px){
  .marquee{--edge:calc((100vw - var(--page-max)) / 2 + 20px);}
}
/* 마스크를 지원하지 않는 브라우저용 그라데이션 */
.marquee::before,.marquee::after{content:"";position:absolute;top:0;bottom:0;
  width:calc(var(--edge) + 130px);z-index:2;pointer-events:none;}
.marquee::before{left:0;background:linear-gradient(90deg,var(--cloud) 0,var(--cloud) var(--edge),rgba(239,235,230,0) 100%);}
.marquee::after{right:0;background:linear-gradient(270deg,var(--cloud) 0,var(--cloud) var(--edge),rgba(252,247,236,0) 100%);}
@supports (mask-image:linear-gradient(#000,#000)) or (-webkit-mask-image:linear-gradient(#000,#000)){
  .marquee::before,.marquee::after{display:none;}
}
.marquee__track{display:flex;width:-webkit-max-content;width:max-content;animation:marq 60s linear infinite;}
.marquee__track:hover{animation-play-state:paused;}
.marquee__set{display:flex;align-items:stretch;flex:0 0 auto;}
.mcard{flex:0 0 auto;width:250px;margin-right:var(--s16);background:var(--surface);border:1px solid var(--ash);
  border-radius:var(--r-card);padding:var(--s12);display:flex;flex-direction:column;
  transition:box-shadow .18s ease,border-color .18s ease;}
.mcard:hover{border-color:transparent;box-shadow:var(--sh-card);}
.mcard__thumb{aspect-ratio:16/10;width:100%;border-radius:8px;object-fit:cover;background:var(--frost);}
.mcard__thumb-ph{aspect-ratio:16/10;width:100%;border-radius:8px;background:var(--frost);
  display:grid;place-items:center;color:var(--fog);font-size:11px;}
.mcard__kind{margin-top:10px;display:inline-flex;align-self:flex-start;font-size:10px;font-weight:700;
  letter-spacing:.04em;color:var(--violet-deep);background:var(--accent-soft);border-radius:4px;padding:2px 6px;}
.mcard__t{margin-top:6px;font-size:var(--text-body-sm);font-weight:600;letter-spacing:-.02em;
  line-height:1.35;color:var(--graphite);}
@keyframes marq{from{transform:translate3d(0,0,0);}to{transform:translate3d(-50%,0,0);}}
@media (prefers-reduced-motion:reduce){.marquee__track{animation:none;}}
@supports not (aspect-ratio: 1 / 1){
  .mcard__thumb,.mcard__thumb-ph{height:0;padding-bottom:62.5%;}
}

/* About 하단 큰 연락처 */
.bigcontact{display:flex;flex-wrap:wrap;gap:var(--s16) var(--s48);align-items:center;justify-content:center;
  padding:var(--s40) 0;}
.bigcontact a{display:inline-flex;align-items:center;gap:12px;
  font-size:clamp(22px,4.5vw,40px);font-weight:700;letter-spacing:-.02em;color:var(--graphite);}
.bigcontact a:hover{color:var(--violet-deep);}
.bigcontact .pico{width:1.05em;height:1.05em;}

/* 대표 프로젝트 벤토 — 큰1·중1·작2 */
.bento{display:grid;gap:var(--s16);}
.bcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--ash);
  border-radius:var(--r-card);overflow:hidden;min-height:190px;
  transition:box-shadow .18s ease,border-color .18s ease,transform .12s ease;}
.bcard:hover{border-color:transparent;box-shadow:var(--sh-card);}
.bcard:active{transform:scale(.995);}
.bcard__thumb{flex:1 1 auto;min-height:110px;object-fit:cover;width:100%;background:var(--frost);}
.bcard__thumb-ph{flex:1 1 auto;min-height:110px;background:var(--frost);display:grid;place-items:center;
  color:var(--slate);font-size:var(--text-caption);}
.bcard__b{padding:var(--s16);}
.bcard__head{display:flex;align-items:center;gap:6px;min-width:0;}
.bcard__kind{display:inline-flex;flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.04em;
  color:var(--violet-deep);background:var(--accent-soft);border-radius:4px;padding:2px 6px;}
.bcard__t{display:block;min-width:0;font-size:var(--text-body);font-weight:600;letter-spacing:-.02em;line-height:1.35;}
.bcard__d{display:block;margin-top:5px;color:var(--slate);font-size:13px;line-height:1.55;}
.bcard--c1 .bcard__t{font-size:var(--text-subheading);}
@media (min-width:820px){
  /* 대(1) 왼쪽 2/3 · 세로 전체 / 중(2) 오른쪽 위 1/3폭 / 소(3·4) 그 아래 1/2씩 */
  .bento{grid-template-columns:2fr 0.5fr 0.5fr;grid-template-rows:3fr 2fr;grid-auto-rows:1fr;}
  .bcard--c1{grid-column:1;grid-row:1 / 3;}
  .bcard--c1 .bcard__thumb,.bcard--c1 .bcard__thumb-ph{flex:0 0 76%;min-height:0;}
  .bcard--c1 .bcard__b{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;}
  .bcard--c2{grid-column:2 / 4;grid-row:1;}
  .bcard--c3{grid-column:2;grid-row:2;}
  .bcard--c4{grid-column:3;grid-row:2;}
}
@media (max-width:819px){
  .bento{grid-template-columns:repeat(2,minmax(0,1fr));}
  .bcard--c1,.bcard--c2{grid-column:1 / -1;}
}
/* 작은 카드(c3·c4): 이미지 크게, 하단은 태그+제목 한 줄만 */
.bcard--sm .bcard__b{padding:10px var(--s12);display:flex;align-items:center;gap:8px;}
.bcard--sm .bcard__kind{margin-bottom:0;flex:0 0 auto;}
.bcard--sm .bcard__t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bcard--sm .bcard__d{display:none;}

/* 경험 섹션 (상세 하단) — 자기소개서와 같은 리듬 */
.exp{margin-top:var(--s48);}
.exp__title{font-size:var(--text-heading-sm);font-weight:700;letter-spacing:-.02em;color:var(--graphite);
  padding-bottom:var(--s12);border-bottom:1px solid var(--ash);margin-bottom:var(--s8);}
.exp__item{padding:var(--s24) 0;}
.exp__item + .exp__item{border-top:1px solid var(--ash);}
.exp__sub{font-size:clamp(17px,3vw,21px);font-weight:700;letter-spacing:-.02em;color:var(--graphite);}
.exp__body{margin-top:var(--s12);color:var(--slate);font-size:var(--text-body-sm);line-height:1.85;max-width:70ch;}
.exp__body p + p{margin-top:var(--s12);}

/* 하단 바로가기 — 버튼처럼 */
.jump{display:grid;gap:var(--s12);}
@media (min-width:720px){.jump{grid-template-columns:repeat(3,minmax(0,1fr));}}
.jump__btn{display:flex;align-items:center;justify-content:space-between;gap:var(--s12);
  min-height:64px;padding:16px 20px;border-radius:var(--r-btn);
  background:var(--surface);border:1px solid var(--ash);box-shadow:rgba(39,40,53,.06) 0 2px 4px 0;
  transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease,transform .12s ease;}
.jump__btn:hover{border-color:var(--violet);box-shadow:rgba(94,76,255,.16) 0 4px 14px 0;}
.jump__btn:active{transform:translateY(1px);}
.jump__l{display:grid;gap:2px;min-width:0;}
.jump__t{font-size:var(--text-body);font-weight:600;letter-spacing:-.02em;}
.jump__d{font-size:var(--text-caption);color:var(--steel);}
.jump__arrow{flex:0 0 auto;font-size:17px;color:var(--violet);font-weight:600;}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--ash);border:1px solid var(--ash);border-radius:var(--r-card);overflow:hidden;}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr));}}
.stat{background:var(--surface);padding:var(--s16);}
.stat__value{font-size:var(--text-heading-sm);font-weight:600;letter-spacing:-.02em;line-height:1.2;}
.stat__label{margin-top:2px;color:var(--steel);font-size:var(--text-caption);}

/* ============================================================
   Tabs
   ============================================================ */
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--cloud);border-radius:var(--r-pill);max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:9px 20px;border-radius:var(--r-pill);font-size:var(--text-body-sm);font-weight:500;color:var(--slate);white-space:nowrap;}
.tab.is-active{background:var(--surface);color:var(--graphite);border:1px solid var(--ash);padding:8px 19px;box-shadow:rgba(39,40,53,.06) 0 2px 4px 0;}

/* ============================================================
   Profile
   ============================================================ */
.profile{display:grid;gap:var(--s20);}
/* 이름 블록과 인적사항 블록을 일정 간격으로 붙여 하나의 그룹으로 가운데 정렬 */
.profile{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;
  gap:var(--s24) var(--s48);text-align:left;}
.profile__name{font-size:clamp(32px,7.5vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1.1;
  color:var(--graphite);display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;}
.profile__name-en{font-size:clamp(17px,4vw,26px);font-weight:500;letter-spacing:-.01em;color:#f98a17;}
.profile__logline{margin-top:var(--s32);color:var(--violet-deep);font-weight:500;font-size:clamp(16px,3.8vw,20px);line-height:1.6;}
.profile__desc{margin-top:var(--s8);color:var(--slate);font-size:var(--text-body);line-height:1.8;max-width:60ch;}

.pinfo{display:grid;gap:12px;}
@media (min-width:820px){.pinfo{margin-top:6px;}}
.pinfo__row{display:flex;flex-wrap:wrap;align-items:center;gap:8px var(--s20);}
.pinfo__row--big{font-size:1.5em;}
.pinfo__row--big .pico{width:1.4em;height:1.4em;}
.pinfo__i{display:inline-flex;align-items:center;gap:8px;font-size:var(--text-body);
  color:var(--graphite);letter-spacing:-.01em;overflow-wrap:anywhere;}
.pinfo__i .pico{width:18px;height:18px;color:var(--violet);}
.pinfo__sep{color:var(--ash);font-size:var(--text-body);}
@media (max-width:559px){.pinfo__sep{display:none;}.pinfo__row{gap:8px var(--s16);}}

.deflist{margin-top:var(--s20);display:grid;gap:1px;background:var(--ash);border:1px solid var(--ash);border-radius:var(--r-card);overflow:hidden;max-width:720px;}
.deflist__row{background:var(--surface);display:grid;grid-template-columns:64px minmax(0,1fr);gap:var(--s8);padding:13px var(--s16);align-items:baseline;}
.deflist__k{color:var(--steel);font-size:var(--text-body-sm);font-weight:500;}
.deflist__v{font-size:var(--text-body);color:var(--graphite);overflow-wrap:anywhere;}
/* 이메일 + 연락처 한 행 */
.deflist__row--pair{grid-template-columns:64px minmax(0,1fr);}
@media (min-width:560px){
  .deflist__row--pair{grid-template-columns:64px -webkit-max-content 64px minmax(0,1fr);
    grid-template-columns:64px max-content 64px minmax(0,1fr);column-gap:var(--s24);}
}

/* ============================================================
   경력 · 대외활동 — 세로로 줄을 따라 내려오는 타임라인
   ============================================================ */
.sec-head--rule{border-bottom:1px solid var(--ash);padding-bottom:var(--s12);gap:var(--s12);}
.sec-head--rule .sec-head__ico{width:36px;height:36px;}
@media (max-width:559px){.sec-head--rule .sec-head__ico{width:30px;height:30px;}}
.sec-head--tight{margin-bottom:var(--s16);}
.band--ws{padding-top:var(--s48);}
.tgroup + .tgroup{margin-top:var(--s32);}
.tyear{font-size:var(--text-subheading);font-weight:600;letter-spacing:-.02em;color:var(--violet);
  line-height:1;margin-bottom:var(--s16);}
.tyear .ph{font-size:13px;}
.titem{position:relative;display:grid;grid-template-columns:112px minmax(0,1fr);gap:var(--s16);
  padding-bottom:var(--s24);}
.titem:last-child{padding-bottom:0;}
/* 항목을 잇는 세로선 */
.titem:not(:last-child)::before{content:"";position:absolute;left:55px;top:120px;bottom:4px;
  width:1px;background:var(--ash);}
.titem__img{width:112px;height:112px;border-radius:12px;object-fit:cover;background:var(--frost);position:relative;z-index:1;}
.titem__img-ph{width:112px;height:112px;border-radius:12px;background:var(--frost);
  display:grid;place-items:center;color:var(--fog);font-size:11px;text-align:center;position:relative;z-index:1;}
.titem__name{font-size:var(--text-body);font-weight:600;letter-spacing:-.02em;line-height:1.3;}
.titem__date{margin-top:4px;color:var(--violet);font-size:var(--text-caption);font-weight:500;font-variant-numeric:tabular-nums;}
.titem__tag{color:var(--slate);font-weight:500;}
.titem__desc{margin-top:var(--s8);color:var(--slate);font-size:var(--text-body-sm);line-height:1.65;}
.titem__links{margin-top:var(--s12);}
/* 경력만 글자를 2pt 씩 키운다 (대외활동은 그대로) */
.titem--lg .titem__name{font-size:12px;}
.titem--lg .titem__date{font-size:var(--text-body-sm);}
.titem--lg .titem__desc{font-size:var(--text-body);}
@media (max-width:479px){
  .titem{grid-template-columns:88px minmax(0,1fr);}
  .titem__img,.titem__img-ph{width:88px;height:88px;}
  .titem:not(:last-child)::before{left:43px;top:96px;}
}

/* ============================================================
   Timeline
   ============================================================ */
.timeline{display:grid;gap:var(--s16);}
.tl{background:var(--surface);border:1px solid var(--ash);border-radius:var(--r-card);padding:var(--s20);}
@media (min-width:900px){.tl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s24);padding:var(--s24);}}
.tl__aside{display:flex;flex-direction:column;gap:6px;}
.tl__period{color:var(--steel);font-size:var(--text-caption);font-weight:500;}
.tl__org{font-size:var(--text-subheading);font-weight:600;letter-spacing:-.02em;line-height:1.25;}
.tl__role{margin-top:2px;color:var(--violet);font-size:var(--text-body-sm);font-weight:500;}
.tl__summary{color:var(--slate);font-size:var(--text-body-sm);line-height:1.7;}
@media (max-width:899px){.tl__summary{margin-top:var(--s12);}}
.bullets{margin-top:var(--s12);display:grid;gap:8px;}
.bullets li{position:relative;padding-left:16px;color:var(--slate);font-size:var(--text-body-sm);line-height:1.65;}
.bullets li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:1px;background:var(--violet);}
.tl__foot{margin-top:var(--s16);padding-top:var(--s12);border-top:1px solid var(--frost);}
.tl__footlabel{color:var(--steel);font-size:var(--text-caption);margin-bottom:6px;}

/* Skills — 탭 하나가 통째로 하나의 판, 그 안에서 2열 */
.skills{background:var(--surface);border:1px solid var(--ash);border-radius:var(--r-card);
  padding:var(--s24);display:grid;gap:var(--s32) var(--s40);}
@media (min-width:720px){.skills{grid-template-columns:repeat(2,minmax(0,1fr));}}
.skill__icons{display:flex;flex-wrap:wrap;gap:8px;}
.skill__icon{width:44px;height:44px;border-radius:10px;object-fit:contain;background:var(--cloud);padding:4px;flex:0 0 auto;}
.skill__icon-ph{width:44px;height:44px;border-radius:10px;background:var(--frost);display:grid;place-items:center;color:var(--fog);font-size:10px;flex:0 0 auto;text-align:center;line-height:1.2;}
.skill__name{margin-top:var(--s12);font-size:16px;font-weight:600;letter-spacing:-.02em;line-height:1.25;}
.skill__dots{display:flex;gap:4px;margin-top:6px;}
.skill__dots i{width:8px;height:8px;border-radius:2px;background:var(--frost);display:block;}
.skill__dots i.on{background:var(--violet);}
.skill__note{margin-top:var(--s8);color:var(--slate);font-size:var(--text-body-sm);line-height:1.65;}

/* ============================================================
   자기소개 — 칸 없이 한 페이지, 가로줄로만 문단 구분 + 오른쪽 목차
   ============================================================ */
.intro-head{padding-bottom:var(--s32);border-bottom:1px solid var(--ash);}
.intro-head__t{font-size:clamp(30px,6.6vw,54px);font-weight:700;letter-spacing:-.03em;line-height:1.08;color:var(--graphite);}
.intro-head__d{margin-top:var(--s16);color:var(--violet-deep);font-weight:500;font-size:clamp(16px,3.8vw,19px);line-height:1.7;max-width:62ch;}
.intro-cols{display:grid;gap:var(--s32);}
@media (min-width:900px){
  .intro-cols{grid-template-columns:minmax(0,1fr) 216px;gap:var(--s48);align-items:start;}
}
.intro-toc{position:-webkit-sticky;position:sticky;top:calc(var(--nav-h) + 24px);align-self:start;
  max-height:calc(100vh - var(--nav-h) - 48px);overflow-y:auto;-webkit-overflow-scrolling:touch;}
@media (max-width:899px){.intro-toc{position:static;order:-1;}}
.intro-toc__l{color:var(--steel);font-size:var(--text-caption);font-weight:600;letter-spacing:.08em;margin-bottom:var(--s12);}
.intro-toc__i{display:block;padding:9px 0 9px var(--s16);border-left:2px solid var(--ash);
  color:var(--steel);font-size:var(--text-body-sm);line-height:1.4;transition:color .15s ease,border-color .15s ease;}
.intro-toc__i:hover{color:var(--graphite);}
.intro-toc__i.on{border-left-color:var(--violet);color:var(--graphite);font-weight:600;}
.qsec{padding:var(--s40) 0;}
.qsec:first-child{padding-top:var(--s32);}
.qsec + .qsec{border-top:1px solid var(--ash);}
.qsec__q{font-size:clamp(19px,3.4vw,26px);font-weight:700;letter-spacing:-.025em;line-height:1.3;color:var(--graphite);}
.qsec__a{margin-top:var(--s16);color:var(--slate);font-size:clamp(15px,3.6vw,17px);line-height:1.9;max-width:70ch;}
mark.hl{background:var(--px3);color:inherit;padding:1px 4px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.qsec__a p + p{margin-top:var(--s16);}

/* ============================================================
   Portfolio 게시물
   ============================================================ */
.post-thumb{aspect-ratio:16/10;width:100%;border-radius:8px;object-fit:cover;background:var(--frost);margin-bottom:var(--s16);}
.post-thumb-ph{aspect-ratio:16/10;width:100%;border-radius:8px;margin-bottom:var(--s16);background:var(--frost);display:grid;place-items:center;color:var(--steel);font-size:var(--text-caption);}
.post-kind{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:5px;background:var(--accent-soft);color:var(--violet-deep);font-size:11px;font-weight:700;letter-spacing:.03em;}
/* 태그 안 아이콘·글자 정렬 미세조정: 글자 1px 아래로, 아이콘 2px·글자 4px 왼쪽으로 당겨 폭 축소 */
.post-kind .pico{margin-left:-2px;}
.post-kind .kind__t{position:relative;top:1px;margin-left:-4px;}
.post--sample{border-color:var(--ash);}
/* 태그 + 제목을 한 줄에 — 아래 한 줄 설명 공간 확보 */
.post__head{display:flex;align-items:center;gap:8px;margin-top:var(--s12);min-width:0;}
.post__head .post-kind{flex:0 0 auto;}
.post__title{display:block;font-size:var(--text-body);font-weight:600;letter-spacing:-.02em;line-height:1.35;
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.post__desc{margin-top:6px;color:var(--slate);font-size:13px;line-height:1.55;}

/* 납작한 프로젝트 카드 — 왼쪽 대표 이미지, 오른쪽 제목/설명 */
.plist{display:grid;gap:var(--s12);}
.pcard{display:grid;grid-template-columns:118px minmax(0,1fr);gap:var(--s16);align-items:center;
  background:var(--surface);border:1px solid var(--ash);border-radius:var(--r-card);padding:var(--s12);
  transition:box-shadow .18s ease,border-color .18s ease;}
.pcard:hover{border-color:transparent;box-shadow:var(--sh-card);}
.pcard--sample{border-color:var(--ash);}
.pcard__thumb{aspect-ratio:4/3;width:100%;border-radius:8px;object-fit:cover;background:var(--frost);}
.pcard__thumb-ph{aspect-ratio:4/3;width:100%;border-radius:8px;background:var(--frost);display:grid;place-items:center;color:var(--steel);font-size:11px;}
.pcard__head{display:flex;align-items:center;gap:6px;min-width:0;}
.pcard__t{display:block;min-width:0;font-size:var(--text-body);font-weight:600;letter-spacing:-.02em;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard__d{margin-top:5px;color:var(--slate);font-size:var(--text-body-sm);line-height:1.55;}
.pcard__kind{display:inline-flex;flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.04em;
  color:var(--violet-deep);background:var(--accent-soft);border-radius:4px;padding:2px 6px;}
.plist.is-collapsed .pcard:nth-child(n+5){display:none;}
.plist-more{margin-top:var(--s12);width:100%;display:flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;border:1px solid var(--ash);border-radius:var(--r-btn);background:var(--surface);
  font-size:var(--text-body-sm);font-weight:500;color:var(--slate);transition:border-color .15s ease,color .15s ease;}
.plist-more:hover{border-color:var(--violet);color:var(--violet);}
.plist-more__c{transition:transform .2s ease;}
.plist-more[aria-expanded="true"] .plist-more__c{transform:rotate(180deg);}
@supports not (aspect-ratio: 1 / 1){
  .pcard__thumb,.pcard__thumb-ph{height:0;padding-bottom:75%;}
}

/* 포트폴리오 스티커 — 카드 위에 얹히는 장식 */
.stickwrap{position:relative;}
.stick{position:absolute;z-index:3;pointer-events:none;
  filter:drop-shadow(0 6px 12px rgba(39,40,53,.14));}
.stick--chess{width:41px;left:-18px;top:36%;transform:rotate(-8deg);}
.stick--dice{width:46px;left:24%;top:-26px;transform:rotate(6deg);}
.stick--sword{width:43px;left:63%;top:34%;transform:rotate(4deg);}
.stick--pad{width:49px;left:calc(50% + 73px);bottom:-16px;transform:rotate(-6deg);}
.stick--dpad{width:37px;right:-16px;top:calc(12% + 148px);transform:rotate(9deg);}
@media (max-width:899px){
  .stick{width:32px !important;}
  .stick--chess{left:-10px;}
  .stick--dpad{right:-8px;}
  .stick--dice{top:-16px;}
  .stick--pad{bottom:-10px;}
}
@media (max-width:559px){.stick--sword,.stick--pad{display:none;}}

/* 상세 페이지 — 제목 옆 정보 목록 */
.dmeta{margin-top:var(--s20);display:grid;gap:6px;}
.dmeta li{font-size:var(--text-body-sm);color:var(--slate);line-height:1.6;}
.dmeta b{color:var(--graphite);font-weight:600;}
.dmeta a{color:var(--violet-deep);font-weight:500;text-decoration:underline;text-underline-offset:2px;}

/* 웹빌드 · 사이트 재생 플레이어 */
.webplay{margin-top:var(--s40);}
.webplay__frame{margin-top:var(--s16);border-radius:var(--r-card);overflow:hidden;background:var(--frost);
  aspect-ratio:16/9;width:100%;}
.webplay__frame iframe{width:100%;height:100%;border:0;display:block;}
.webplay__ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--slate);}
.webplay__ph .pico{width:44px;height:44px;}
.webplay__ph b{color:var(--graphite);font-weight:600;}
.webplay__ph span{font-size:var(--text-body-sm);}

/* 프로젝트 기획서 뷰어 — 왼쪽 페이지 목록, 오른쪽 크게 */
.planner{margin-top:var(--s48);}
.planner__tabs{display:flex;flex-wrap:wrap;gap:8px;margin:var(--s16) 0;}
.ptab{padding:8px 16px;border-radius:var(--r-pill);border:1px solid var(--ash);background:var(--surface);
  font-size:var(--text-body-sm);font-weight:500;color:var(--slate);white-space:nowrap;transition:all .14s ease;}
.ptab:hover{border-color:var(--steel);}
.ptab.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--violet-deep);font-weight:600;}
.planner__grid{display:grid;gap:var(--s20);margin-top:var(--s16);}
@media (min-width:820px){.planner__grid{grid-template-columns:150px minmax(0,1fr);align-items:start;}}
.planner__list{display:grid;gap:var(--s12);align-content:start;
  max-height:600px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px;
  scrollbar-width:thin;scrollbar-color:var(--mist) transparent;}
.planner__list::-webkit-scrollbar{width:5px;}
.planner__list::-webkit-scrollbar-track{background:transparent;}
.planner__list::-webkit-scrollbar-thumb{background:var(--mist);border-radius:3px;}
.ppage{display:block;width:100%;text-align:left;background:transparent;border:0;padding:0;cursor:pointer;}
.ppage__img{aspect-ratio:297/210;width:100%;border-radius:8px;object-fit:cover;
  background:var(--frost);border:2px solid transparent;
  transition:box-shadow .16s ease,border-color .16s ease;display:grid;place-items:center;
  color:var(--slate);font-size:11px;overflow:hidden;}
img.ppage__img{display:block;}
.ppage:hover .ppage__img{box-shadow:var(--sh-card);}
.ppage.is-on .ppage__img{border-color:var(--violet);}
.ppage__n{margin-top:5px;font-size:var(--text-caption);color:var(--slate);text-align:center;}
.planner__view{position:relative;background:var(--frost);border-radius:var(--r-card);overflow:hidden;}
/* 세로 스크롤로 페이지를 넘긴다 — 한 화면에 한 쪽 + 다음 쪽 살짝 */
.planner__scroll{height:min(72vh,620px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  scroll-snap-type:y mandatory;scrollbar-width:none;padding:0;}
.planner__scroll::-webkit-scrollbar{display:none;}
.pv-page{scroll-snap-align:start;width:100%;aspect-ratio:297/210;background:#fff;
  display:flex;align-items:center;justify-content:center;color:var(--slate);}
.pv-page + .pv-page{margin-top:var(--s12);}
.pv-page img{width:100%;height:100%;object-fit:contain;display:block;}
/* 아래에 다음 쪽이 있음을 알리는 그라데이션 */
.planner__view::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;pointer-events:none;
  background:linear-gradient(to top,var(--frost),transparent);border-radius:0 0 var(--r-card) var(--r-card);}
.planner__empty{color:var(--slate);opacity:.72;font-weight:500;text-align:center;line-height:1.7;padding:var(--s24);}

/* 상세 */
.detail-back{display:inline-flex;align-items:center;gap:6px;color:var(--slate);font-size:var(--text-body-sm);font-weight:500;margin-bottom:var(--s20);}
.detail-back:hover{color:var(--violet);}
/* 본문 블록은 가운데, 글자는 왼쪽 */
.detail-col{max-width:840px;margin:0 auto;text-align:left;}
.detail__head{text-align:left;display:flex;align-items:stretch;gap:var(--s24);}
/* 대표 이미지: 위는 제목, 아래는 링크(마지막 정보 줄)에 맞춰 세로로 늘어난다 */
.detail__head > div{flex:1 1 auto;min-width:0;}
.detail__thumb{flex:0 0 auto;align-self:stretch;width:clamp(180px,24vw,260px);
  border-radius:var(--r-card);object-fit:cover;background:var(--frost);}
.detail__thumb-ph{flex:0 0 auto;align-self:stretch;width:clamp(180px,24vw,260px);
  border-radius:var(--r-card);background:var(--frost);display:grid;place-items:center;
  color:var(--slate);font-size:var(--text-body-sm);text-align:center;}
@media (max-width:559px){
  .detail__thumb,.detail__thumb-ph{width:96px;}
  .detail__head{gap:var(--s16);}
}
.detail__title{font-size:clamp(28px,7vw,48px);font-weight:700;letter-spacing:-.03em;line-height:1.05;color:var(--graphite);}
.detail__tagline{margin-top:var(--s12);color:var(--violet-deep);font-weight:500;font-size:clamp(15px,3.8vw,18px);line-height:1.6;max-width:60ch;}
.detail__body{margin-top:var(--s24);}

.meta2{display:grid;gap:1px;background:var(--ash);border:1px solid var(--ash);border-radius:var(--r-card);overflow:hidden;margin-top:var(--s24);}
@media (min-width:560px){.meta2{grid-template-columns:repeat(2,minmax(0,1fr));}}
.meta2__cell{background:var(--surface);padding:14px var(--s16);display:grid;grid-template-columns:76px minmax(0,1fr);align-items:baseline;gap:var(--s12);}
.meta2__k{color:var(--steel);font-size:var(--text-caption);font-weight:500;flex:0 0 auto;}
.meta2__v{font-size:var(--text-body-sm);color:var(--graphite);overflow-wrap:anywhere;}

.detail-sec{margin-top:var(--s48);}
.detail-sec__h{font-size:var(--text-heading-sm);font-weight:600;letter-spacing:-.02em;margin-bottom:var(--s12);display:inline-flex;align-items:center;gap:8px;}
.detail-sec__h .pico{color:var(--violet);}
.detail-sec__body{color:var(--slate);font-size:var(--text-body-sm);line-height:1.8;}
.detail-sec__body p + p{margin-top:var(--s12);}
.figure{margin-top:var(--s16);}
.figure img{width:100%;border-radius:var(--r-card);border:1px solid var(--ash);}
.figure figcaption{margin-top:6px;color:var(--steel);font-size:var(--text-caption);}
.notice{margin-bottom:var(--s24);padding:var(--s16);border-radius:var(--r-card);background:var(--frost);color:var(--slate);font-size:var(--text-body-sm);text-align:left;}

/* ============================================================
   History — 그래프 · 카운터 · 게임
   ============================================================ */
/* 좌·우 같은 높이 */
.hist__top{display:grid;gap:var(--s24);}
@media (min-width:900px){.hist__top{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s40);align-items:stretch;}}
.hist__top > *{min-width:0;}
/* 왼쪽: 육각형 + 총 개수 한 카드 */
.histcard{background:var(--surface);border:1px solid var(--ash);border-radius:var(--r-card);
  padding:var(--s20);display:flex;flex-direction:column;height:100%;}
.radar-wrap-inner{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
.radar{width:100%;height:auto;display:block;max-width:460px;margin:0 auto;overflow:visible;}
.gcounts{margin-top:var(--s20);padding-top:var(--s20);border-top:1px solid var(--frost);display:grid;gap:var(--s16);}
.gcount{display:flex;align-items:center;justify-content:space-between;gap:var(--s16);}
.gcount__l{display:inline-grid;}
.gcount__t{font-size:var(--text-subheading);font-weight:700;letter-spacing:-.02em;line-height:1.2;color:var(--graphite);}
.gcount__d{margin-top:4px;font-size:var(--text-caption);color:var(--slate);line-height:1.4;}
.gcount__v{font-size:clamp(30px,6vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1;
  color:var(--violet-deep);flex:0 0 auto;font-variant-numeric:tabular-nums;}
/* 오른쪽 카드가 왼쪽과 같은 높이로 늘어나도록 */
.hist__right{display:flex;flex-direction:column;gap:var(--s16);height:100%;}

/* 출시 연식 도넛 그래프 */
.donut{background:var(--surface);border:1px solid var(--ash);border-radius:var(--r-card);padding:var(--s20);
  flex:1;display:flex;flex-direction:column;justify-content:center;}
.donut__legend{display:flex;flex-wrap:wrap;gap:8px var(--s16);margin-bottom:var(--s16);}
.donut__lg{display:inline-flex;align-items:center;gap:7px;font-size:var(--text-body-sm);font-weight:600;color:var(--graphite);}
.donut__sw{width:11px;height:11px;border-radius:2px;flex:0 0 auto;}
.donut__body{display:flex;align-items:center;gap:var(--s20);flex-wrap:wrap;}
.donut__svg{width:170px;height:170px;flex:0 0 auto;}
.donut__call{position:relative;flex:1 1 190px;min-width:0;background:var(--frost);border-radius:var(--r-card);padding:var(--s16) var(--s20);}
@media (min-width:520px){
  .donut__call::before{content:"";position:absolute;left:-9px;top:38px;width:0;height:0;
    border-top:10px solid transparent;border-bottom:10px solid transparent;border-right:10px solid var(--frost);}
}
.donut__seg{cursor:pointer;transition:opacity .15s ease;}
.donut__svg:hover .donut__seg{opacity:.45;}
.donut__svg .donut__seg:hover{opacity:1;}
.donut__pct{font-size:clamp(28px,7vw,40px);font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--violet);}
.donut__lab{margin-top:6px;font-size:var(--text-body);font-weight:600;color:var(--graphite);}
.donut__note{margin-top:8px;font-size:var(--text-caption);color:var(--steel);line-height:1.5;}

/* 태그 드롭다운 필터 — 수치 하단, 좁게 */
.filter{margin-top:var(--s16);display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--s12);}
.fsel{display:grid;gap:6px;min-width:0;flex:1 1 120px;max-width:220px;}
.fsel__l{color:var(--steel);font-size:var(--text-caption);font-weight:600;letter-spacing:.04em;}
.fsel__box{position:relative;}
.fsel select{
  -webkit-appearance:none;appearance:none;
  width:100%;border:1px solid var(--ash);border-radius:var(--r-btn);background:var(--surface);
  padding:11px 34px 11px 12px;font-size:16px;letter-spacing:-.01em;color:var(--graphite);
  line-height:1.2;min-height:44px;
}
.fsel select:focus{outline:2px solid rgba(94,76,255,.35);outline-offset:0;border-color:var(--violet);}
.fsel__caret{position:absolute;right:12px;top:50%;margin-top:-3px;pointer-events:none;color:var(--fog);}
.filter__foot{display:flex;align-items:center;gap:var(--s12);flex:0 0 auto;padding-bottom:2px;}
.filter__count{color:var(--slate);font-size:var(--text-caption);font-weight:500;white-space:nowrap;}
.filter__count b{color:var(--violet);font-weight:600;}

/* 게임 그리드 — 6열 */
.games{display:grid;gap:var(--s12);grid-template-columns:repeat(2,minmax(0,1fr));}
@media (min-width:520px){.games{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media (min-width:760px){.games{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media (min-width:1000px){.games{grid-template-columns:repeat(6,minmax(0,1fr));}}
.game{background:var(--surface);border:1px solid var(--ash);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
.game__img{aspect-ratio:4/3;width:100%;object-fit:cover;background:var(--frost);}
.game__img-ph{aspect-ratio:4/3;width:100%;background:var(--frost);display:grid;place-items:center;color:var(--fog);font-size:11px;}
.game__b{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1;}
.game__t{font-size:13px;font-weight:600;letter-spacing:-.02em;line-height:1.3;color:var(--graphite);}
/* 게임 카드 메타: 플랫폼태그|출시일 / 장르태그 / 플레이타임 (줄 단위) */
.game__meta{margin-top:auto;display:flex;flex-direction:column;gap:5px;}
.game__row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;}
.game__date{font-size:10px;color:var(--steel);font-weight:500;font-variant-numeric:tabular-nums;}
.game__date::before{content:"|";margin-right:5px;color:var(--fog);font-weight:400;}
.game__tag{padding:2px 6px;border-radius:4px;background:var(--cloud);color:var(--steel);font-size:10px;font-weight:500;line-height:1.5;white-space:nowrap;}
.game__tag--p{background:var(--accent-soft);color:var(--violet-deep);}
.game__tag--e{background:var(--frost);color:var(--graphite);}
.games-empty{margin-top:var(--s20);}

/* ============================================================
   Footer / routes
   ============================================================ */
.footer{border-top:1px solid var(--ash);padding:var(--s40) 0 calc(var(--s40) + var(--sa-b));background:var(--cloud);}
.footer__row{display:flex;flex-wrap:wrap;gap:6px var(--s12);align-items:center;justify-content:flex-end;}
.footer__note{color:var(--steel);font-size:var(--text-caption);}
.footer__name{color:var(--graphite);font-weight:600;}
.route{display:none;position:relative;}
.route-body{position:relative;z-index:1;}
.route.is-active{display:block;}

@supports not (aspect-ratio: 1 / 1){
  .post-thumb,.post-thumb-ph{height:0;padding-bottom:62.5%;}
  .ph-img{height:0;padding-bottom:56.25%;}
  .game__img,.game__img-ph{height:0;padding-bottom:75%;}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
}
</style>
</head>

<script>
/* ================================================================
 *  CONTENT — 여기만 채우면 페이지 전체가 완성됩니다.
 *  ----------------------------------------------------------------
 *  · 빈 문자열('')이나 빈 배열([])로 두면 화면에 점선 안내가 표시됩니다.
 *  · SHOW_PLACEHOLDER = false 로 바꾸면 빈 항목이 아예 숨겨집니다.
 *  · 배열 항목은 형태를 유지한 채 복사해서 개수를 늘리면 됩니다.
 * ================================================================ */

var SHOW_PLACEHOLDER = true;

/* 상세 페이지 설명 — 제목 옆에 '항목: 값' 목록으로 붙습니다 */
function SAMPLE_META() {
  return [
    { label: '팀',       value: '' },
    { label: '역할',     value: '' },
    { label: '제작 기간', value: '' },
    { label: '플랫폼',   value: '' },
    { label: '링크',     value: '' }
  ];
}
function SAMPLE_SECTIONS() {
  return [
    { heading: '', body: '', bullets: [], images: [ { src: '', caption: '' } ] },
    { heading: '', body: '', bullets: [], images: [] }
  ];
}
/* 레이아웃 확인용 빈 게시물. 실제 게시물을 넣을 때 해당 줄을 지우세요. */
function SAMPLE_POST(id, title, kind, withPdf) {
  var k = kind || '';
  var post = {
    id: id, sample: true, title: title, tagline: '', kind: k,
    thumb: '', tags: [], meta: SAMPLE_META(),
    sections: [],
    embed: '',      // 웹빌드/사이트 재생 주소 (게임·사이트·프로젝트) — 비우면 자리표시
    pages: [],      // 기획서 PDF 페이지 이미지 배열 — 비우면 기획서 탭이 안 보입니다
    experience: {   // 프로젝트에서 경험한 일들 (제목 + 부제목·본문 여러 개)
      title: '',
      items: [ { sub: '', body: '' }, { sub: '', body: '' }, { sub: '', body: '' } ]
    },
    plans: []       // 여러 기획서 PDF: [{ title:'기획서 1', pages:[{img:''}] }, ...] — 있으면 상단 토글
  };
  function blankPages(n) { var a = []; for (var i = 0; i < n; i++) a.push({ img: '', href: '' }); return a; }
  if (withPdf) {
    /* 프로젝트 게시물 — 여러 기획서 PDF 를 상단 토글로 전환 */
    post.plans = [
      { title: '기획서 1', pages: blankPages(8) },
      { title: '기획서 2', pages: blankPages(5) },
      { title: '기획서 3', pages: blankPages(6) }
    ];
  } else if (k === 'pdf' || k === 'doc') {
    /* 기획서 게시물 — 단일 PDF 페이지 나열 */
    post.pages = blankPages(8);
  }
  return post;
}

var CONTENT = {

  /* ── 사이트 공통 ─────────────────────────────────────────── */
  meta: {
    siteTitle: 'Park Jisoo Portfolio',   // 브라우저 탭 제목 (탭에만)
    brandMark: '',        // 좌측 상단 사각형 안 글자 1자
    brandName: 'Park Jisoo',   // 좌측 상단 이름
    /* 푸터 — 오른쪽에 이름과 최종 수정 일자를 나란히 표시합니다.
       파일을 고칠 때마다 updated 날짜를 함께 바꿔 주세요. */
    footerName: '박지수',
    updated: '2026.09.11'
  },

  /* 각 대단원 제목 밑 설명. 비우면 '상세 설명 첨부' 로 표시됩니다. */
  descs: {
    workStyle: '', featured: '', career: '', projects: '', skills: '', activities: '',
    intro: '', main: '', docs: '', ai: '', history: '', games: ''
  },

  /* ── 1. About ────────────────────────────────────────────── */
  about: {
    /* 히어로 한 문장 — 줄바꿈(\n)한 둘째 줄은 첫 줄 둘째 어절 아래에서 시작(Z자 배열), 전체 가운데 정렬 */
    logline: '의도를 디자인하여\n보여질 결과까지 꼼꼼하게',
    intro: '',            // (선택) 히어로 보조 문단. 비우면 표시 안 함

    /* Work style — 3열. icon 은 assets/icons 안의 이름:
       gamepad · poker · video · domino · target · project · office ·
       resume · school · chart · pdf · birth · email · phone · pin          */
    workStyle: [
      { icon: 'gamepad', title: '', desc: '' },
      { icon: 'poker',   title: '', desc: '' },
      { icon: 'video',   title: '', desc: '' }
    ],

    closing: ''
  },

  /* ── 2. Resume ───────────────────────────────────────────── */
  resume: {

    /* 프로필 — 이메일·연락처는 한 행, 학력 한 행 */
    profile: {
      banner: '',           // 상단 구역 배경 배너 이미지 경로 (비우면 단색)

/* ================================================================
 *  이 아래는 화면을 그리는 코드입니다. 내용 수정은 위 CONTENT 에서만 하세요.
 * ================================================================ */
(function () {
  'use strict';

  /* ---------- 유틸 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function has(v) { return typeof v === 'string' ? v.trim() !== '' : !!v; }
  function hasList(a) { return Array.isArray(a) && a.length > 0; }
  function ph(label) { return SHOW_PLACEHOLDER ? '<span class="ph">' + esc(label) + '</span>' : ''; }
  function phPlain(label) { return SHOW_PLACEHOLDER ? '<span class="ph ph--plain">' + esc(label) + '</span>' : ''; }
  function txtPlain(v, label) { return has(v) ? esc(v) : phPlain(label); }
  function bodyPlain(v, label) { return has(v) ? nl2p(v) : '<p>' + phPlain(label) + '</p>'; }
  function txt(value, label) { return has(value) ? esc(value) : ph(label); }
  function phBlock(label, path) {
    if (!SHOW_PLACEHOLDER) return '';
    return '<div class="ph-block">' + esc(label) + (path ? '<br><code>' + esc(path) + '</code>' : '') + '</div>';
  }
  function hl(x) { return x.replace(/\*\*([^*]+)\*\*/g, '<mark class="hl">$1</mark>'); }
  function nl2p(t) {
    return String(t).split(/\n\s*\n/).map(function (p) {
      return '<p>' + hl(esc(p).replace(/\n/g, '<br>')) + '</p>';
    }).join('');
  }
  function body(v, label) { return has(v) ? nl2p(v) : '<p>' + ph(label) + '</p>'; }
  function chips(list, cls) {
    var arr = (list || []).filter(has);
    if (!arr.length) return '';
    return '<div class="chips">' + arr.map(function (t) {
      return '<span class="chip ' + (cls || '') + '">' + esc(t) + '</span>';
    }).join('') + '</div>';
  }
  function bullets(list) {
    var arr = (list || []).filter(has);
    if (!arr.length) return '';
    return '<ul class="bullets">' + arr.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul>';
  }
  function imgOr(src, alt, imgClass, phClass, phLabel) {
    if (has(src)) return '<img class="' + imgClass + '" src="' + esc(src) + '" alt="' + esc(alt) + '" loading="lazy">';
    if (!SHOW_PLACEHOLDER) return '';
    return '<div class="' + phClass + '">' + esc(phLabel) + '</div>';
  }
  function isExternal(h) { return /^(https?:)?\/\//i.test(h); }
  function linkAttrs(href) {
    if (!has(href)) return 'href="#" aria-disabled="true"';
    return 'href="' + esc(href) + '"' +
      (isExternal(href) || /\.pdf($|\?)/i.test(href) ? ' target="_blank" rel="noopener noreferrer"' : '');
  }
  /* 제목이 두 줄이면 둘째 줄부터 #3520cf */
  function twoTone(text, label) {
    if (!has(text)) return ph(label);
    return String(text).split('\n').map(function (line, i) {
      return i === 0 ? esc(line) : '<span class="ln2">' + esc(line) + '</span>';
    }).join('<br>');
  }

  function desc(key) {
    var d = (CONTENT.descs || {})[key];
    return has(d) ? esc(d) : '상세 설명 첨부';
  }

  /* ---------- 아이콘 (assets/icons/*.png) ---------- */
  var ICON_DIR = 'assets/icons/';
  var ICONS = {
    birth:'birth', school:'school', email:'email', phone:'phone', pin:'pin',
    office:'office', project:'project', target:'target', poker:'poker', resume:'resume',
    gamepad:'gamepad', pdf:'pdf', video:'video', chart:'chart', domino:'domino'
  };
  /* Work style 기본 아이콘 */
  var BIG_ICONS = ['gamepad', 'poker', 'video'];

  function pico(name, cls) {
    var f = ICONS[name] || ICONS.project;
    return '<img class="pico ' + (cls || '') + '" src="' + ICON_DIR + f + '.png" alt="" aria-hidden="true" loading="lazy">';
  }

  /* 섹션 머리말 — 큰 아이콘 + 작은 제목. 설명은 CONTENT.descs 를 채운 경우에만 표시 */
  function headBlock(icon, eyebrow, title, key, extraClass) {
    var d = (CONTENT.descs || {})[key];
    return '<div class="sec-head ' + (extraClass || '') + '">' +
      '<img class="sec-head__ico" src="' + ICON_DIR + (ICONS[icon] || ICONS.project) + '.png" alt="" aria-hidden="true">' +
      '<div>' +
        (eyebrow ? '<div class="sec-eyebrow">' + esc(eyebrow) + '</div>' : '') +
        '<h2 class="sec-title">' + esc(title) + '</h2>' +
        (has(d) ? '<p class="sec-desc">' + esc(d) + '</p>' : '') +
      '</div></div>';
  }
  function sectionHead(icon, eyebrow, title, key) {
    return headBlock(icon, eyebrow, title, key, '');
  }

  /* ---------- 코너 픽셀 모자이크 ----------
     우상단에 밀착된 조밀한 덩어리가 대각선으로 흩어지는 형태.
     숫자는 톤(1 = 가장 옅음 … 5 = 가장 진함), x 는 텍스처 타일. */
  var MOSAIC = [
    '.....1243554',
    '....2.45x.45',
    '.....2.14352',
    '.......13x24',
    '........2143',
    '.........124',
    '..........13',
    '.........2.1',
    '..........2.',
    '........1..2',
    '..........1.',
    '.........4..',
    '..........2.',
    '........1.2.'
  ];
  /* animate=true 면 오른쪽 위에서 왼쪽 아래로 순서대로 나타난다.
     페이지를 새로 열 때 한 번만 재생된다 — 연출이 끝나면 클래스를 떼어내므로
     탭을 오갔다 돌아와도 다시 재생되지 않는다. */
  var mosaicPlayed = false;
  function mosaic(animate) {
    var cols = MOSAIC[0].length;
    return '<div class="mosaic' + (animate ? ' mosaic--in' : '') + '" aria-hidden="true">' +
      MOSAIC.map(function (row, r) {
        var cells = '';
        for (var i = 0; i < row.length; i++) {
          var c = row.charAt(i);
          var delay = animate ? ' style="animation-delay:' + (((cols - 1 - i) + r) * 0.042).toFixed(3) + 's"' : '';
          cells += '<i class="mt' + (c === '.' ? '' : ' t' + c) + '"' + delay + '></i>';
        }
        return '<div class="mrow">' + cells + '</div>';
      }).join('') + '</div>';
  }
  /* 코너 모자이크를 페이지 우상단에 얹는 래퍼 */
  function mosaicAnchor(animate) {
    return '<div class="hero__anchor"><div class="wrap">' + mosaic(animate) + '</div></div>';
  }
  /* 라우트 최상단 우측에 코너 모자이크를 얹는다 */
  function withMosaic(html) {
    return mosaicAnchor(false) + '<div class="route-body">' + html + '</div>';
  }

  /* ================================================================
   *  1. About
   * ================================================================ */
  function renderAbout() {
    var a = CONTENT.about || {};
    var h = [];

    /* 히어로 — 버튼 없음 */
    h.push('<div class="topblock hero">' + mosaicAnchor(!mosaicPlayed) + '<div class="wrap hero__inner">');
    h.push('<h1 class="hero__logline">' +
      (has(a.logline)
        ? a.logline.split('\n').map(function (ln) { return '<span class="zl">' + esc(ln) + '</span>'; }).join('')
        : '<span class="zl">' + ph('로그라인 1 — 첫 페이지 헤드라인') + '</span>') + '</h1>');
    if (has(a.intro)) h.push('<div class="hero__sub">' + body(a.intro, '') + '</div>');
    var pf0 = (CONTENT.resume || {}).profile || {};
    h.push('<div class="hero__contact">' +
      '<span>' + pico('email') + txt(pf0.email, '이메일') + '</span>' +
      '<span>' + pico('phone') + txt(pf0.phone, '전화번호') + '</span></div>');
    h.push('</div></div>');

    /* Work style — 도입 문단과 같은 글 안에 있는 것처럼 바짝 붙인다 */
    h.push('<div class="band band--ws"><div class="wrap">');
    h.push(headBlock('gamepad', '', 'Work style', 'workStyle', 'sec-head--tight'));
    if (hasList(a.workStyle)) {
      h.push('<div class="ws">' + a.workStyle.map(function (w, i) {
        return '<div class="ws__item">' +
          '<div class="ws__top">' + pico(w.icon || BIG_ICONS[i % BIG_ICONS.length], 'ws__icon') +
          '<h3 class="ws__title">' + txt(w.title, '제목') + '</h3></div>' +
          '<div class="ws__desc">' + body(w.desc, '설명') + '</div>' +
          '</div>';
      }).join('') + '</div>');
    } else {
      h.push(phBlock('Work style 항목', 'CONTENT.about.workStyle'));
    }
    h.push('</div></div>');

    /* 대표 프로젝트 — 큰1·중1·작2 벤토 */
    h.push('<div class="band band--cloud"><div class="wrap">' +
      headBlock('project', 'Featured', '대표 프로젝트', 'featured', 'sec-head--tight') +
      bento((CONTENT.portfolio || {}).main) + '</div></div>');

    /* 하단 바로가기 — 버튼 */
    h.push('<div class="band"><div class="wrap"><div class="jump">' + [
      ['Resume', '경력 · 프로젝트 · 기술 · 자기소개', '#resume'],
      ['Portfolio', '메인 프로젝트 · 기획서 · AI 작업물', '#portfolio'],
      ['History', '선호 장르 그래프 · 플레이한 게임', '#history']
    ].map(function (x) {
      return '<a class="jump__btn" href="' + x[2] + '">' +
        '<span class="jump__l"><span class="jump__t">' + x[0] + '</span>' +
        '<span class="jump__d">' + x[1] + '</span></span>' +
        '<span class="jump__arrow" aria-hidden="true">→</span></a>';
    }).join('') + '</div>');
    if (has(a.closing)) {
      h.push('<div class="card card--pad card--soft" style="margin-top:var(--s24)">' +
        '<div class="card__body" style="font-size:var(--text-body)">' + nl2p(a.closing) + '</div></div>');
    }
    h.push('</div></div>');
    return h.join('');
  }

  /* 대표 프로젝트 — 큰1·중1·작2 벤토 (첫 4개) */
  function bento(list) {

      return '<a class="bcard bcard--c' + (i + 1) + (i >= 2 ? ' bcard--sm' : '') + '" href="#post/' + esc(it.id || '') + '">' +

  /* 경력 · 대외활동 공통 항목 — 세로로 줄을 따라 내려온다 */
  function titem(it, nameKey, nameLabel, cls) {
    var range = (has(it.start) || has(it.end))
      ? esc(it.start || '') + ' ~ ' + esc(it.end || '')
      : ph('0000.00.00 ~ 0000.00.00');
    var posts = (it.posts || []).filter(has);
    return '<li class="titem ' + (cls || '') + '">' +
      '<div>' + imgOr(it.image, it[nameKey] || '', 'titem__img', 'titem__img-ph', '이미지') + '</div>' +
      '<div><h3 class="titem__name">' + txt(it[nameKey], nameLabel) + '</h3>' +
      '<div class="titem__date">' + range +
        (has(it.tag) ? ' <span class="titem__tag">(' + esc(it.tag) + ')</span>' : '') + '</div>' +
      '<div class="titem__desc">' + body(it.desc, '설명') + '</div>' +
      (posts.length
        ? '<div class="titem__links chips">' + posts.map(function (id) {
            return '<a class="chip chip--violet" href="#post/' + esc(id) + '">' + esc(postTitle(id)) + '</a>';
          }).join('') + '</div>'
        : '') +
      '</div></li>';

  function postTitle(id) {
    var p = CONTENT.portfolio || {};
    var l = [].concat(p.main || [], p.docs || [], p.ai || []);
    for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i].title || id;
    return id;

  /* 스크롤에 따라 목차 표시를 바꾼다 */
  function bindIntro() {
    var links = document.querySelectorAll('[data-toc]');
    if (!links.length) return;
    var secs = [];
    for (var i = 0; i < links.length; i++) {
      var id = links[i].getAttribute('data-toc');
      var el = document.getElementById(id);
      if (el) secs.push({ el: el, link: links[i] });
      (function (el2, id2) {
        links[i].addEventListener('click', function (e) {
          if (!el2) return;
          e.preventDefault();
          var top = el2.getBoundingClientRect().top + window.pageYOffset - 90;
          window.scrollTo({ top: top, behavior: 'smooth' });
        });
      })(el, id);
    }
    if (!secs.length) return;

    var ticking = false;
    function paint() {
      ticking = false;
      var line = 140, active = 0;
      for (var j = 0; j < secs.length; j++) {
        if (secs[j].el.getBoundingClientRect().top <= line) active = j;
      }
      for (var k = 0; k < secs.length; k++) {
        secs[k].link.classList.toggle('on', k === active);
      }
    }
    function onScroll() {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(paint);
    }
    window.addEventListener('scroll', onScroll, false);
    window.addEventListener('resize', onScroll, false);
    paint();
  }

  function findPost(id) {

    var lists = [['main', p.main], ['docs', p.docs], ['ai', p.ai]];

  var PLANS = [];
  function paintPlanner(pi) {
    var grid = document.getElementById('plannerGrid');
    if (!grid) return;
    var pl = PLANS[pi] || {};
    var pages = pl.pages || [];
    grid.innerHTML =
      '<div class="planner__list">' + pages.map(function (d, i) {
        return '<button type="button" class="ppage' + (i === 0 ? ' is-on' : '') + '" data-page="' + i + '">' +
          (has(d.img) ? '<img class="ppage__img" src="' + esc(d.img) + '" alt="' + (i + 1) + '쪽" loading="lazy">'
                      : '<span class="ppage__img">' + (i + 1) + '쪽</span>') +
          '<span class="ppage__n">' + (i + 1) + '</span></button>';
      }).join('') + '</div>' +
      '<div class="planner__view"><div class="planner__scroll" id="planScroll">' +
        pages.map(function (d, i) {
          return '<div class="pv-page" data-pv="' + i + '">' +
            (has(d.img) ? '<img src="' + esc(d.img) + '" alt="' + (i + 1) + '쪽" loading="lazy">'
                        : '<span>' + (i + 1) + '쪽 — 왼쪽 페이지의 img 경로를 넣으면 여기에 크게 표시됩니다.</span>') +
            '</div>';
        }).join('') + '</div></div>';
    wirePages(grid);
    var tabs = document.querySelectorAll('[data-plan]');
    for (var k = 0; k < tabs.length; k++) {
      tabs[k].classList.toggle('on', Number(tabs[k].getAttribute('data-plan')) === pi);
    }
  }
  /* 왼쪽 썸네일 ↔ 오른쪽 스크롤 동기화 */
  function wirePages(grid) {
    var scroll = grid.querySelector('#planScroll');
    var thumbs = grid.querySelectorAll('[data-page]');
    var views = scroll ? scroll.querySelectorAll('[data-pv]') : [];
    if (!scroll) return;
    function mark(i) {
      for (var k = 0; k < thumbs.length; k++) {
        thumbs[k].classList.toggle('is-on', Number(thumbs[k].getAttribute('data-page')) === i);
      }
    }
    for (var i = 0; i < thumbs.length; i++) {
      (function (idx) {
        thumbs[idx].addEventListener('click', function () {
          if (views[idx]) scroll.scrollTo({ top: views[idx].offsetTop - scroll.offsetTop, behavior: 'smooth' });
          mark(idx);
        });
      })(Number(thumbs[i].getAttribute('data-page')));
    }
    var ticking = false;
    scroll.addEventListener('scroll', function () {
      if (ticking) return; ticking = true;
      window.requestAnimationFrame(function () {
        ticking = false;
        var midY = scroll.scrollTop + scroll.clientHeight * 0.4, cur = 0;
        for (var j = 0; j < views.length; j++) {
          if (views[j].offsetTop - scroll.offsetTop <= midY) cur = j;
        }
        mark(cur);
      });
    }, { passive: true });
    mark(0);
  }
  function bindPlanner() {
    if (!PLANS.length) return;
    var tabs = document.querySelectorAll('[data-plan]');
    for (var i = 0; i < tabs.length; i++) {
      (function (idx) { tabs[idx].addEventListener('click', function () { paintPlanner(idx); }); })(
        Number(tabs[i].getAttribute('data-plan')));
    }
    paintPlanner(0);   /* 눌러본 게 없으면 첫 기획서 */
  }

    /* 본문 섹션은 내용이 있을 때만 */
    (m.sections || []).forEach(function (sec) {

      var o = ['<section class="detail-sec">'];

      if (has(sec.body)) o.push('<div class="detail-sec__body">' + nl2p(sec.body) + '</div>');
      var bl = bullets(sec.bullets);
      if (bl) o.push('<div>' + bl + '</div>');
      (sec.images || []).forEach(function (im) {
        if (!has(im.src) && !has(im.caption)) return;
        o.push('<figure class="figure">' + imgOr(im.src, im.caption || '', '', 'ph-img', '이미지') +
          (has(im.caption) ? '<figcaption>' + esc(im.caption) + '</figcaption>' : '') + '</figure>');
      });
      h.push(o.join('') + '</section>');
    });

    /* 프로젝트 기획서 — 여러 PDF(plans)면 상단 토글, 하나면 그대로.
       왼쪽 페이지 나열 / 오른쪽 크게. 실제 PDF 가 없으면 이 구역은 안 나온다. */
    var planList = hasList(m.plans) ? m.plans
      : (hasList(m.pages) ? [{ title: '', pages: m.pages }] : []);
    if (planList.length) {
      h.push('<section class="planner">');
      h.push('<h2 class="detail-sec__h">' + pico('pdf') + '프로젝트 기획서</h2>');
      if (planList.length > 1) {
        h.push('<div class="planner__tabs">' + planList.map(function (pl, i) {
          return '<button type="button" class="ptab' + (i === 0 ? ' on' : '') + '" data-plan="' + i + '">' +
            txt(pl.title, '기획서 ' + (i + 1)) + '</button>';

      }
      h.push('<div class="planner__grid" id="plannerGrid"></div>');

      PLANS = planList;
    } else {
      PLANS = [];

    /* 프로젝트에서 경험한 일들 — 제목 + (부제목·본문) 여러 개 */
    var ex = m.experience;
    if (ex && (has(ex.title) || hasList(ex.items))) {
      h.push('<section class="exp">');
      h.push('<h2 class="exp__title">' + txt(ex.title, '프로젝트 경험') + '</h2>');
      (ex.items || []).forEach(function (it, i) {
        h.push('<div class="exp__item">' +
          '<h3 class="exp__sub">' + txt(it.sub, '부제목 ' + (i + 1)) + '</h3>' +
          '<div class="exp__body">' + bodyPlain(it.body, '본문 ' + (i + 1)) + '</div>' +
          '</div>');

    h.push('</div>');

    h.push('<div style="margin-top:var(--s40)"><a class="btn btn--ghost" href="#portfolio">← 목록으로</a></div>');
    return h.join('') + '</div></div></div>';
