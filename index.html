<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<meta name="color-scheme" content="light" />
<title>Portfolio</title>
<meta name="description" content="게임 기획 포트폴리오" />

<!-- Pretendard (variable, dynamic subset) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />

<style>
/* ============================================================
   Design tokens — Lightdash (violet pixel-grid on drafting paper)
   ============================================================ */
:root{
  /* Colors */
  --canvas:#ffffff;
  --cloud:#f6f8fa;
  --frost:#eceff3;
  --ash:#cdd2d9;
  --mist:#c1c7d0;
  --fog:#a4abb8;
  --steel:#818898;
  --slate:#666d80;
  --graphite:#36394a;
  --midnight:#272835;
  --onyx:#1a1b25;
  --violet:#5e4cff;
  --lavender:#c8ccf3;
  --lilac:#dfdbff;

  /* Type */
  --font-sans:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Roboto,'Helvetica Neue',sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace;

  --text-caption:12px;
  --text-body-sm:14px;
  --text-body:16px;
  --text-subheading:20px;
  --text-heading-sm:24px;
  --text-heading:32px;

  /* Spacing */
  --s4:4px; --s8:8px; --s12:12px; --s16:16px; --s20:20px; --s24:24px;
  --s32:32px; --s40:40px; --s48:48px; --s64:64px; --s80:80px;

  /* Layout */
  --page-max:1200px;
  --nav-h:60px;

  /* Radius */
  --r-card:12px;
  --r-btn:8px;
  --r-pill:999px;

  /* Shadow — slate tinted */
  --sh-hairline:rgba(39,40,53,.10) 0 0 0 1px;
  --sh-card:rgba(39,40,53,.10) 0 0 0 1px, rgba(39,40,53,.08) 0 24px 24px -12px, rgba(39,40,53,.08) 0 12px 12px -6px, rgba(39,40,53,.08) 0 6px 6px -3px, rgba(39,40,53,.08) 0 2px 2px -1px;
  --sh-soft:rgba(39,40,53,.05) 0 0 0 1px, rgba(39,40,53,.02) 0 30px 18px 0, rgba(39,40,53,.04) 0 13px 13px 0, rgba(39,40,53,.05) 0 3px 7px 0;

  /* iOS safe-area */
  --sa-l:env(safe-area-inset-left, 0px);
  --sa-r:env(safe-area-inset-right, 0px);
  --sa-b:env(safe-area-inset-bottom, 0px);
}

/* ============================================================
   Reset / base
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  scroll-behavior:smooth;
}
body{
  margin:0;
  background:var(--canvas);
  color:var(--graphite);
  font-family:var(--font-sans);
  font-size:var(--text-body);
  line-height:1.5;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:rgba(94,76,255,.12);
  word-break:keep-all;
  overflow-wrap:break-word;
}
img{max-width:100%;height:auto;display:block;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
ul,ol{margin:0;padding:0;list-style:none;}
h1,h2,h3,h4,p{margin:0;}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:4px;}

/* ============================================================
   Layout helpers
   ============================================================ */
.wrap{
  width:100%;
  max-width:var(--page-max);
  margin:0 auto;
  padding-left:calc(20px + var(--sa-l));
  padding-right:calc(20px + var(--sa-r));
}
.band{padding:var(--s64) 0;}
.band--cloud{background:var(--cloud);}
.band--tight{padding:var(--s40) 0;}

.sec-head{margin-bottom:var(--s24);}
.sec-eyebrow{
  font-size:var(--text-caption);
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--violet);
  margin-bottom:var(--s8);
}
.sec-title{
  font-size:clamp(24px,5vw,var(--text-heading));
  font-weight:600;
  letter-spacing:-.025em;
  line-height:1.15;
  color:var(--graphite);
}
.sec-desc{
  margin-top:var(--s8);
  color:var(--slate);
  font-size:var(--text-body-sm);
}
.grid{display:grid;gap:var(--s16);}
@media (min-width:720px){
  .grid--2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .grid--3{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media (min-width:1000px){
  .grid--4{grid-template-columns:repeat(4,minmax(0,1fr));}
}
.grid--wide{gap:var(--s40);}

/* ============================================================
   Nav
   ============================================================ */
.nav{
  position:-webkit-sticky;
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.88);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--ash);
  padding-top:env(safe-area-inset-top, 0px);
}
.nav__inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--s12);
  height:var(--nav-h);
}
.brand{display:flex;align-items:center;gap:var(--s8);flex:0 0 auto;}
.brand__mark{
  width:22px;height:22px;border-radius:5px;
  background:var(--violet);
  display:grid;place-items:center;
  color:#fff;font-size:12px;font-weight:700;letter-spacing:-.02em;
}
.brand__name{
  font-size:var(--text-body-sm);
  font-weight:600;
  letter-spacing:-.02em;
  white-space:nowrap;
}
.navlinks{
  display:flex;
  align-items:center;
  gap:var(--s4);
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  margin:0 -4px;
  padding:0 4px;
}
.navlinks::-webkit-scrollbar{display:none;}
.navlink{
  flex:0 0 auto;
  padding:8px 12px;
  border-radius:var(--r-btn);
  font-size:var(--text-body-sm);
  font-weight:500;
  color:var(--slate);
  white-space:nowrap;
  transition:color .15s ease, background-color .15s ease;
}
.navlink:hover{color:var(--graphite);background:var(--cloud);}
.navlink.is-active{color:var(--graphite);background:var(--frost);}
@media (max-width:560px){
  .brand__name{display:none;}
  .navlink{padding:8px 10px;}
}

/* ============================================================
   Buttons / chips
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;
  padding:11px 18px;
  border-radius:var(--r-btn);
  font-size:var(--text-body-sm);
  font-weight:500;
  letter-spacing:-.01em;
  transition:background-color .15s ease,border-color .15s ease,color .15s ease;
}
.btn--violet{background:var(--violet);color:#fff;}
.btn--violet:hover{background:#4f3ff0;}
.btn--ghost{background:#fff;border:1px solid var(--ash);color:var(--graphite);}
.btn--ghost:hover{border-color:var(--steel);}
.btn--dark{background:var(--midnight);color:#fff;}
.btn--dark:hover{background:var(--onyx);}
.btn--sm{min-height:36px;padding:8px 14px;font-size:13px;}

.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;
  border-radius:var(--r-pill);
  background:var(--cloud);
  color:var(--graphite);
  font-size:var(--text-caption);
  font-weight:500;
  letter-spacing:-.01em;
  white-space:nowrap;
}
.chip--violet{background:var(--lilac);color:var(--violet);}
.chip--link{background:var(--frost);}
.chip--link:hover{background:var(--lilac);color:var(--violet);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}

/* ============================================================
   Cards
   ============================================================ */
.card{
  background:#fff;
  border:1px solid var(--ash);
  border-radius:var(--r-card);
  padding:var(--s16);
}
.card--pad{padding:var(--s20);}
.card--elev{border-color:transparent;box-shadow:var(--sh-card);}
.card--soft{border-color:transparent;box-shadow:var(--sh-soft);}
.card__title{
  font-size:var(--text-subheading);
  font-weight:600;
  letter-spacing:-.02em;
  line-height:1.3;
}
.card__body{margin-top:var(--s8);color:var(--slate);font-size:var(--text-body-sm);line-height:1.65;}
.card__meta{margin-top:var(--s4);color:var(--steel);font-size:var(--text-caption);}

a.card{display:block;transition:box-shadow .18s ease,border-color .18s ease,transform .18s ease;}
a.card:hover{border-color:transparent;box-shadow:var(--sh-card);}
a.card:active{transform:scale(.995);}

/* ============================================================
   Placeholder (renders where CONTENT is still empty)
   ============================================================ */
.ph{
  display:inline-block;
  padding:2px 8px;
  border:1px dashed var(--mist);
  border-radius:6px;
  background:repeating-linear-gradient(135deg,rgba(94,76,255,.04) 0 6px,transparent 6px 12px);
  color:var(--fog);
  font-size:.9em;
  font-weight:400;
  letter-spacing:-.01em;
}
.ph-block{
  display:block;
  padding:var(--s20);
  border:1px dashed var(--mist);
  border-radius:var(--r-card);
  background:repeating-linear-gradient(135deg,rgba(94,76,255,.04) 0 6px,transparent 6px 12px);
  color:var(--steel);
  font-size:var(--text-body-sm);
  text-align:center;
}
.ph-block code{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--violet);
  background:var(--lilac);
  border-radius:4px;
  padding:1px 5px;
}
.ph-img{
  display:grid;place-items:center;
  border:1px dashed var(--mist);
  border-radius:var(--r-card);
  background:var(--cloud);
  color:var(--fog);
  font-size:var(--text-caption);
  aspect-ratio:16/9;
  width:100%;
}

/* ============================================================
   Hero (About)
   ============================================================ */
.hero{padding:var(--s48) 0 var(--s40);}
.hero__grid{display:grid;gap:var(--s32);align-items:center;}
@media (min-width:900px){
  .hero{padding:var(--s80) 0 var(--s64);}
  .hero__grid{grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--s48);}
}
.hero__logline{
  font-size:clamp(30px,8.4vw,64px);
  line-height:1.04;
  letter-spacing:-.03em;
  font-weight:600;
  color:var(--graphite);
}
.hero__sub{
  margin-top:var(--s20);
  max-width:46ch;
  color:var(--slate);
  font-size:clamp(15px,3.6vw,18px);
  line-height:1.65;
}
.hero__sub p + p{margin-top:var(--s12);}
.hero__cta{display:flex;flex-wrap:wrap;gap:var(--s8);margin-top:var(--s24);}

/* Pixel mosaic — the only ornament */
.mosaic{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-width:260px;margin-left:auto;}
@media (max-width:899px){.mosaic{max-width:168px;margin:0;}}
.mosaic i{display:block;aspect-ratio:1/1;border-radius:2px;background:transparent;}
.mosaic i.c1{background:var(--violet);}
.mosaic i.c2{background:var(--lavender);}
.mosaic i.c3{background:var(--lilac);}

/* Stats strip */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--ash);border:1px solid var(--ash);border-radius:var(--r-card);overflow:hidden;}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr));}}
.stat{background:#fff;padding:var(--s16);}
.stat__value{font-size:var(--text-heading-sm);font-weight:600;letter-spacing:-.02em;line-height:1.2;}
.stat__label{margin-top:2px;color:var(--steel);font-size:var(--text-caption);}

/* ============================================================
   Tabs (Resume / 자기소개)
   ============================================================ */
.tabs{
  display:inline-flex;
  gap:4px;
  padding:4px;
  background:var(--cloud);
  border-radius:var(--r-pill);
  max-width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto;
  padding:9px 20px;
  border-radius:var(--r-pill);
  font-size:var(--text-body-sm);
  font-weight:500;
  color:var(--slate);
  white-space:nowrap;
}
.tab.is-active{
  background:#fff;
  color:var(--graphite);
  border:1px solid var(--ash);
  padding:8px 19px;
  box-shadow:rgba(39,40,53,.06) 0 2px 4px 0;
}

/* ============================================================
   Profile
   ============================================================ */
.profile{display:grid;gap:var(--s20);}
@media (min-width:720px){.profile{grid-template-columns:180px minmax(0,1fr);gap:var(--s32);align-items:start;}}
.profile__photo{
  width:140px;height:140px;border-radius:var(--r-card);
  object-fit:cover;background:var(--frost);
}
.profile__photo-ph{
  width:140px;height:140px;border-radius:var(--r-card);
  border:1px dashed var(--mist);background:var(--cloud);
  display:grid;place-items:center;color:var(--fog);font-size:var(--text-caption);text-align:center;padding:8px;
}
.profile__name{font-size:clamp(26px,6vw,40px);font-weight:600;letter-spacing:-.03em;line-height:1.1;}
.profile__logline{margin-top:var(--s12);color:var(--slate);font-size:clamp(15px,3.6vw,18px);line-height:1.6;}
.deflist{margin-top:var(--s20);display:grid;gap:1px;background:var(--ash);border:1px solid var(--ash);border-radius:var(--r-card);overflow:hidden;}
.deflist__row{background:#fff;display:grid;grid-template-columns:96px minmax(0,1fr);gap:var(--s12);padding:12px var(--s16);align-items:baseline;}
.deflist__k{color:var(--steel);font-size:var(--text-caption);font-weight:500;}
.deflist__v{font-size:var(--text-body-sm);color:var(--graphite);overflow-wrap:anywhere;}

/* ============================================================
   Timeline (경력 — 중요도 1)
   ============================================================ */
.timeline{position:relative;display:grid;gap:var(--s16);}
.tl{
  position:relative;
  background:#fff;
  border:1px solid var(--ash);
  border-radius:var(--r-card);
  padding:var(--s20);
}
@media (min-width:900px){
  .tl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s24);padding:var(--s24);}
}
.tl__aside{display:flex;flex-direction:column;gap:6px;}
.tl__period{color:var(--steel);font-size:var(--text-caption);font-weight:500;}
.tl__org{font-size:var(--text-subheading);font-weight:600;letter-spacing:-.02em;line-height:1.25;}
.tl__role{margin-top:2px;color:var(--violet);font-size:var(--text-body-sm);font-weight:500;}
.tl__summary{color:var(--slate);font-size:var(--text-body-sm);line-height:1.7;}
@media (max-width:899px){.tl__summary{margin-top:var(--s12);}}
.bullets{margin-top:var(--s12);display:grid;gap:8px;}
.bullets li{position:relative;padding-left:16px;color:var(--slate);font-size:var(--text-body-sm);line-height:1.65;}
.bullets li::before{
  content:"";position:absolute;left:0;top:.62em;
  width:5px;height:5px;border-radius:1px;background:var(--violet);
}
.tl__foot{margin-top:var(--s16);padding-top:var(--s12);border-top:1px solid var(--frost);}
.tl__footlabel{color:var(--steel);font-size:var(--text-caption);margin-bottom:6px;}

/* ============================================================
   Skills (중요도 3)
   ============================================================ */
.skill{display:grid;gap:6px;padding:var(--s16) 0;border-bottom:1px solid var(--frost);}
.skill:last-child{border-bottom:0;}
.skill__top{display:flex;align-items:center;justify-content:space-between;gap:var(--s12);}
.skill__name{font-size:var(--text-body);font-weight:500;letter-spacing:-.02em;}
.skill__dots{display:flex;gap:4px;flex:0 0 auto;}
.skill__dots i{width:8px;height:8px;border-radius:2px;background:var(--frost);display:block;}
.skill__dots i.on{background:var(--violet);}
.skill__note{color:var(--slate);font-size:var(--text-body-sm);line-height:1.6;}

/* ============================================================
   Q&A (자기소개)
   ============================================================ */
.qa{border:1px solid var(--ash);border-radius:var(--r-card);background:#fff;overflow:hidden;}
.qa + .qa{margin-top:var(--s12);}
.qa__q{
  display:flex;align-items:flex-start;gap:var(--s12);
  width:100%;text-align:left;
  padding:var(--s20);
  font-size:clamp(16px,4vw,var(--text-subheading));
  font-weight:600;letter-spacing:-.02em;line-height:1.4;
}
.qa__no{
  flex:0 0 auto;width:24px;height:24px;border-radius:6px;
  background:var(--lilac);color:var(--violet);
  display:grid;place-items:center;font-size:12px;font-weight:600;margin-top:2px;
}
.qa__caret{margin-left:auto;flex:0 0 auto;color:var(--fog);transition:transform .2s ease;margin-top:4px;}
.qa.is-open .qa__caret{transform:rotate(180deg);}
.qa__a{padding:0 var(--s20) var(--s20) calc(var(--s20) + 36px);color:var(--slate);font-size:var(--text-body-sm);line-height:1.8;}
.qa__a p + p{margin-top:var(--s12);}
.qa:not(.is-open) .qa__a{display:none;}

/* ============================================================
   Portfolio
   ============================================================ */
.pf-thumb{
  aspect-ratio:16/10;width:100%;border-radius:8px;object-fit:cover;background:var(--frost);margin-bottom:var(--s16);
}
.pf-thumb-ph{
  aspect-ratio:16/10;width:100%;border-radius:8px;margin-bottom:var(--s16);
  border:1px dashed var(--mist);background:var(--cloud);
  display:grid;place-items:center;color:var(--fog);font-size:var(--text-caption);
}
.att{display:flex;align-items:flex-start;gap:var(--s12);}
.att__icon{
  flex:0 0 auto;width:36px;height:36px;border-radius:8px;
  background:var(--lilac);color:var(--violet);
  display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em;
}
.att__ext{margin-left:auto;flex:0 0 auto;color:var(--fog);}

/* Project detail */
.detail-back{display:inline-flex;align-items:center;gap:6px;color:var(--slate);font-size:var(--text-body-sm);font-weight:500;margin-bottom:var(--s20);}
.detail-back:hover{color:var(--violet);}
.detail__title{font-size:clamp(28px,7vw,48px);font-weight:600;letter-spacing:-.03em;line-height:1.05;}
.detail__tagline{margin-top:var(--s12);color:var(--slate);font-size:clamp(15px,3.8vw,18px);line-height:1.6;max-width:60ch;}
.detail-sec{margin-top:var(--s40);}
.detail-sec__h{font-size:var(--text-heading-sm);font-weight:600;letter-spacing:-.02em;margin-bottom:var(--s12);}
.detail-sec__body{color:var(--slate);font-size:var(--text-body-sm);line-height:1.8;}
.detail-sec__body p + p{margin-top:var(--s12);}
.figure{margin-top:var(--s16);}
.figure img{width:100%;border-radius:var(--r-card);border:1px solid var(--ash);}
.figure figcaption{margin-top:6px;color:var(--steel);font-size:var(--text-caption);}

/* ============================================================
   Taste — radar + games
   ============================================================ */
.taste__grid{display:grid;gap:var(--s24);}
@media (min-width:900px){.taste__grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s40);align-items:start;}}
.radar-wrap{background:#fff;border:1px solid var(--ash);border-radius:var(--r-card);padding:var(--s20);}
.radar{width:100%;height:auto;display:block;max-width:460px;margin:0 auto;overflow:visible;}
.radar-legend{margin-top:var(--s16);display:grid;gap:1px;background:var(--frost);border-radius:8px;overflow:hidden;}
.radar-legend__row{background:#fff;display:flex;align-items:center;gap:var(--s12);padding:9px var(--s12);font-size:var(--text-body-sm);}
.radar-legend__no{
  width:18px;height:18px;border-radius:4px;background:var(--lilac);color:var(--violet);
  display:grid;place-items:center;font-size:11px;font-weight:600;flex:0 0 auto;
}
.radar-legend__v{margin-left:auto;color:var(--steel);font-size:var(--text-caption);font-variant-numeric:tabular-nums;}

.count-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s12);}
.count{background:#fff;border:1px solid var(--ash);border-radius:var(--r-card);padding:var(--s16);}
.count__v{font-size:clamp(28px,7vw,40px);font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--graphite);}
.count__l{margin-top:6px;color:var(--steel);font-size:var(--text-caption);}
.count--hero{grid-column:1 / -1;background:var(--onyx);border-color:transparent;}
.count--hero .count__v{color:#fff;}
.count--hero .count__l{color:var(--fog);}
.count--hero .ph{color:var(--steel);border-color:#3a3b4a;}

.gamelist{display:grid;gap:1px;background:var(--ash);border:1px solid var(--ash);border-radius:var(--r-card);overflow:hidden;}
.game{background:#fff;display:flex;align-items:center;gap:var(--s12);padding:12px var(--s16);}
.game__title{font-size:var(--text-body-sm);font-weight:500;}
.game__note{color:var(--steel);font-size:var(--text-caption);margin-top:1px;}
.game__genre{margin-left:auto;flex:0 0 auto;}

/* ============================================================
   Footer
   ============================================================ */
.footer{
  border-top:1px solid var(--ash);
  padding:var(--s40) 0 calc(var(--s40) + var(--sa-b));
  background:var(--cloud);
}
.footer__row{display:flex;flex-wrap:wrap;gap:var(--s12);align-items:center;justify-content:space-between;}
.footer__note{color:var(--steel);font-size:var(--text-caption);}

/* ============================================================
   Routes
   ============================================================ */
.route{display:none;}
.route.is-active{display:block;}

/* aspect-ratio 미지원(구형 iOS Safari) 대비 */
@supports not (aspect-ratio: 1 / 1){
  .mosaic i{height:0;padding-bottom:100%;}
  .pf-thumb,.pf-thumb-ph{height:0;padding-bottom:62.5%;}
  .ph-img{height:0;padding-bottom:56.25%;}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
}

<script>
/* ================================================================

     포트폴리오 전체 요약(나를 설명하는 내용)이 들어가는 영역 */
  about: {
    logline: '',          // 헤드라인. 한 문장. 줄바꿈은 \n 으로 넣으면 그대로 반영됩니다.
    intro: '',            // 헤드라인 아래 도입 문단. 빈 줄(\n\n)로 문단 구분.
    ctas: [
      // { label: '이력서 보기', href: '#resume', style: 'violet' },   // style: violet | dark | ghost

      name: '',
      logline2: '',       // 로그라인 2 — 이력서용 한 줄 소개
      fields: [
        { label: '이메일',   value: '' },

        { label: '학력',     value: '' },

    career: [
      // {

      //   org: '',                         // 회사명
      //   role: '',                        // 직무
      //   period: '',                      // 예: '2023.03 – 2025.04 (2년 1개월)'
      //   type: '',                        // 예: '정규직' / '외주'
      //   summary: '',                     // 한 문단 요약

    projects: [
      // {

      //   name: '',
      //   period: '',

      //   summary: '',

    ],

/* ================================================================
 *  이 아래는 화면을 그리는 코드입니다. 내용 수정은 위 CONTENT 에서만 하세요.
 * ================================================================ */
(function () {
  'use strict';

  /* ---------- 유틸 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function has(v) { return typeof v === 'string' ? v.trim() !== '' : !!v; }
  function hasList(a) { return Array.isArray(a) && a.length > 0; }

  /* 빈 값 → 점선 안내 (SHOW_PLACEHOLDER 가 false 면 빈 문자열) */
  function ph(label) {
    if (!SHOW_PLACEHOLDER) return '';
    return '<span class="ph">' + esc(label) + '</span>';
  }
  function txt(value, label) { return has(value) ? esc(value) : ph(label); }
  function phBlock(label, path) {
    if (!SHOW_PLACEHOLDER) return '';
    return '<div class="ph-block">' + esc(label) +
      (path ? '<br><code>' + esc(path) + '</code>' : '') + '</div>';
  }
  function nl2p(text) {
    return String(text).split(/\n\s*\n/).map(function (p) {
      return '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }
  function body(value, label) {
    return has(value) ? nl2p(value) : '<p>' + ph(label) + '</p>';
  }
  function chips(list, cls) {
    var arr = (list || []).filter(has);
    if (!arr.length) return '';
    return '<div class="chips">' + arr.map(function (t) {
      return '<span class="chip ' + (cls || '') + '">' + esc(t) + '</span>';
    }).join('') + '</div>';
  }
  function bullets(list) {
    var arr = (list || []).filter(has);
    if (!arr.length) return '';
    return '<ul class="bullets">' + arr.map(function (b) {
      return '<li>' + esc(b) + '</li>';
    }).join('') + '</ul>';
  }
  function imgOr(src, alt, imgClass, phClass, phLabel) {
    if (has(src)) return '<img class="' + imgClass + '" src="' + esc(src) + '" alt="' + esc(alt) + '" loading="lazy">';
    if (!SHOW_PLACEHOLDER) return '';
    return '<div class="' + phClass + '">' + esc(phLabel) + '</div>';
  }
  function isExternal(href) { return /^(https?:)?\/\//i.test(href); }
  function linkAttrs(href) {
    if (!has(href)) return 'href="#" aria-disabled="true"';
    return 'href="' + esc(href) + '"' + (isExternal(href) || /\.pdf($|\?)/i.test(href)
      ? ' target="_blank" rel="noopener noreferrer"' : '');
  }
  function sectionHead(eyebrow, title, desc) {
    return '<div class="sec-head">' +
      (eyebrow ? '<div class="sec-eyebrow">' + esc(eyebrow) + '</div>' : '') +
      '<h2 class="sec-title">' + esc(title) + '</h2>' +
      (desc ? '<p class="sec-desc">' + esc(desc) + '</p>' : '') +
      '</div>';
  }

  /* ---------- 픽셀 모자이크 (유일한 장식 요소) ---------- */
  var MOSAIC = [
    '..3..1..',
    '.3.11.2.',
    '..112.3.',
    '.1112...',
    '3.1123..',
    '..2113.1',
    '.3.211..',
    '..1.3.2.'
  ];
  function mosaic() {
    var cells = [];
    for (var r = 0; r < MOSAIC.length; r++) {
      for (var c = 0; c < MOSAIC[r].length; c++) {
        var ch = MOSAIC[r].charAt(c);
        cells.push('<i class="' + (ch === '.' ? '' : 'c' + ch) + '"></i>');
      }
    }
    return '<div class="mosaic" aria-hidden="true">' + cells.join('') + '</div>';
  }

  /* ================================================================
   *  1. About
   * ================================================================ */
  function renderAbout() {
    var a = CONTENT.about || {};
    var h = [];

    h.push('<div class="hero"><div class="wrap"><div class="hero__grid">');
    h.push('<div>');
    h.push('<h1 class="hero__logline">' +
      (has(a.logline) ? esc(a.logline).replace(/\n/g, '<br>') : ph('로그라인 1 — 첫 페이지 헤드라인')) +
      '</h1>');
    h.push('<div class="hero__sub">' + body(a.intro, '헤드라인 아래 도입 문단') + '</div>');

    if (hasList(a.ctas)) {
      h.push('<div class="hero__cta">' + a.ctas.map(function (c) {
        var style = c.style === 'dark' ? 'btn--dark' : c.style === 'ghost' ? 'btn--ghost' : 'btn--violet';
        return '<a class="btn ' + style + '" ' + linkAttrs(c.href) + '>' + txt(c.label, '버튼 이름') + '</a>';
      }).join('') + '</div>');
    } else if (SHOW_PLACEHOLDER) {
      h.push('<div class="hero__cta"><span class="ph">버튼 — CONTENT.about.ctas</span></div>');
    }
    h.push('</div>');
    h.push('<div>' + mosaic() + '</div>');
    h.push('</div></div></div>');

    /* 지표 */
    h.push('<div class="wrap band band--tight" style="padding-top:0">');
    if (hasList(a.stats)) {
      h.push('<div class="stats">' + a.stats.map(function (s) {
        return '<div class="stat"><div class="stat__value">' + txt(s.value, '수치') + '</div>' +
          '<div class="stat__label">' + txt(s.label, '항목명') + '</div></div>';
      }).join('') + '</div>');
    } else {
      h.push(phBlock('핵심 지표 — 예: 실무 연차, 참여 프로젝트 수, 누적 다운로드', 'CONTENT.about.stats'));
    }
    h.push('</div>');

    /* 요약 카드 */
    h.push('<div class="band band--cloud"><div class="wrap">');
    h.push(sectionHead('Summary', '나를 설명하는 요약', '포트폴리오 전체를 한눈에 볼 수 있는 요약 영역입니다.'));
    if (hasList(a.summary)) {
      h.push('<div class="grid grid--2">' + a.summary.map(function (s) {
        return '<div class="card card--pad">' +
          '<h3 class="card__title">' + txt(s.title, '요약 제목') + '</h3>' +
          '<div class="card__body">' + body(s.body, '요약 본문') + '</div></div>';
      }).join('') + '</div>');
    } else {
      h.push(phBlock('요약 카드 3~4개 — 강점 · 경험 · 지향점 등', 'CONTENT.about.summary'));
    }
    h.push('</div></div>');

    /* 바로가기 */
    h.push('<div class="band"><div class="wrap">');
    h.push('<div class="grid grid--3">' + [
      ['Resume', '경력 · 프로젝트 · 기술 · 자기소개', '#resume'],
      ['Portfolio', '메인 프로젝트 · 기획서 · AI 작업물', '#portfolio'],
      ['Taste', '선호 장르 그래프 · 플레이한 게임', '#taste']
    ].map(function (x) {
      return '<a class="card card--pad" href="' + x[2] + '">' +
        '<h3 class="card__title">' + x[0] + '</h3>' +
        '<p class="card__body">' + x[1] + '</p></a>';
    }).join('') + '</div>');
    if (has(a.closing)) {
      h.push('<div class="card card--pad card--soft" style="margin-top:var(--s24)">' +
        '<div class="card__body" style="font-size:var(--text-body)">' + nl2p(a.closing) + '</div></div>');
    }
    h.push('</div></div>');

    return h.join('');
  }

  /* ================================================================
   *  2. Resume (탭: 이력서 / 자기소개)
   * ================================================================ */
  function resumeTabs(sub) {
    return '<div class="wrap" style="padding-top:var(--s32)">' +
      '<div class="tabs" role="tablist">' +
      '<a class="tab' + (sub !== 'intro' ? ' is-active' : '') + '" href="#resume">이력서</a>' +
      '<a class="tab' + (sub === 'intro' ? ' is-active' : '') + '" href="#resume/intro">자기소개</a>' +
      '</div></div>';
  }

  function careerName(id) {
    var list = (CONTENT.resume && CONTENT.resume.career) || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].org || id;
    return id;
  }
  function projectName(id) {
    var list = (CONTENT.resume && CONTENT.resume.projects) || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].name || id;
    return id;
  }

  function renderResume(sub) {
    if (sub === 'intro') return resumeTabs(sub) + renderIntro();

    var r = CONTENT.resume || {};
    var p = r.profile || {};
    var h = [resumeTabs(sub)];

    /* 2-1. 프로필 */
    h.push('<div class="band band--tight"><div class="wrap"><div class="profile">');
    h.push('<div>' + imgOr(p.photo, '프로필 사진', 'profile__photo', 'profile__photo-ph', '프로필 사진') + '</div>');
    h.push('<div>');
    h.push('<h1 class="profile__name">' + txt(p.name, '이름') + '</h1>');
    h.push('<p class="profile__logline">' + txt(p.logline2, '로그라인 2 — 이력서용 한 줄 소개') + '</p>');
    if (hasList(p.fields)) {
      h.push('<div class="deflist">' + p.fields.map(function (f) {
        return '<div class="deflist__row"><div class="deflist__k">' + txt(f.label, '항목') + '</div>' +
          '<div class="deflist__v">' + txt(f.value, '내용') + '</div></div>';
      }).join('') + '</div>');
    }
    h.push('</div></div></div></div>');

  /* ================================================================
   *  4. Taste — 육각형 그래프 · 게임 개수 · 플레이 목록
   * ================================================================ */
  function radarSVG(axes) {
    var n = axes.length;
    var W = 360, H = 320, cx = 180, cy = 152, R = 96, MAX = 5;
    if (n < 3) return phBlock('축이 3개 이상이어야 그래프가 그려집니다', 'CONTENT.taste.axes');

    function pt(i, r) {
      var ang = (-90 + i * 360 / n) * Math.PI / 180;
      return [cx + Math.cos(ang) * r, cy + Math.sin(ang) * r];
    }
    function poly(r) {
      var p = [];
      for (var i = 0; i < n; i++) { var q = pt(i, r); p.push(q[0].toFixed(1) + ',' + q[1].toFixed(1)); }
      return p.join(' ');
    }

    var s = ['<svg class="radar" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="선호 장르 그래프">'];

    for (var lv = MAX; lv >= 1; lv--) {
      s.push('<polygon points="' + poly(R * lv / MAX) + '" fill="' + (lv === MAX ? '#f6f8fa' : 'none') +
        '" stroke="#cdd2d9" stroke-width="1"/>');
    }
    for (var i = 0; i < n; i++) {
      var e = pt(i, R);
      s.push('<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) +
        '" stroke="#cdd2d9" stroke-width="1"/>');
    }

    var vals = [];
    for (var j = 0; j < n; j++) {
      var v = Math.max(0, Math.min(MAX, Number(axes[j].value) || 0));
      var q2 = pt(j, R * v / MAX);
      vals.push(q2[0].toFixed(1) + ',' + q2[1].toFixed(1));
    }
    s.push('<polygon points="' + vals.join(' ') + '" fill="rgba(94,76,255,.18)" stroke="#5e4cff" stroke-width="2" stroke-linejoin="round"/>');
    for (var k = 0; k < n; k++) {
      var vv = Math.max(0, Math.min(MAX, Number(axes[k].value) || 0));
      var qp = pt(k, R * vv / MAX);
      s.push('<rect x="' + (qp[0] - 3).toFixed(1) + '" y="' + (qp[1] - 3).toFixed(1) +
        '" width="6" height="6" rx="1" fill="#5e4cff"/>');
    }

    for (var m2 = 0; m2 < n; m2++) {
      var lp = pt(m2, R + 24);
      var anchor = Math.abs(lp[0] - cx) < 6 ? 'middle' : (lp[0] > cx ? 'start' : 'end');
      var filled = has(axes[m2].label);
      s.push('<text x="' + lp[0].toFixed(1) + '" y="' + (lp[1] + 4).toFixed(1) + '" text-anchor="' + anchor +
        '" font-size="13" font-weight="500" fill="' + (filled ? '#36394a' : '#a4abb8') + '">' +
        esc(filled ? axes[m2].label : '축 ' + (m2 + 1)) + '</text>');
    }

    s.push('</svg>');
    return s.join('');
  }

  function renderTaste() {
    var t = CONTENT.taste || {};

    var counts = t.counts || {};
    var h = ['<div class="band"><div class="wrap">'];

    if (hasList(axes)) {

  /* ================================================================
   *  라우터
   * ================================================================ */
  var ROUTES = ['about', 'resume', 'portfolio', 'project', 'taste'];
  var rendered = {};

  function parseHash() {
    var raw = (location.hash || '').replace(/^#\/?/, '');
    var parts = raw.split('/');
    var route = parts[0] || 'about';
    if (ROUTES.indexOf(route) === -1) route = 'about';
    return { route: route, param: parts[1] || '' };
  }

  function render(state) {
    var key = state.route + '/' + state.param;
    var host = document.getElementById('route-' + state.route);
    if (!host) return;
    if (rendered[state.route] !== key) {
      if (state.route === 'about') host.innerHTML = renderAbout();
      else if (state.route === 'resume') host.innerHTML = renderResume(state.param);
      else if (state.route === 'portfolio') host.innerHTML = renderPortfolio();
      else if (state.route === 'project') host.innerHTML = renderProject(state.param);
      else if (state.route === 'taste') host.innerHTML = renderTaste();
      rendered[state.route] = key;
    }

    var sections = document.querySelectorAll('.route');
    for (var i = 0; i < sections.length; i++) {
      var on = sections[i].getAttribute('data-route') === state.route;
      sections[i].classList.toggle('is-active', on);
      if (on) sections[i].removeAttribute('hidden'); else sections[i].setAttribute('hidden', '');
    }

    var navActive = state.route === 'project' ? 'portfolio' : state.route;
    var links = document.querySelectorAll('.navlink');
    for (var j = 0; j < links.length; j++) {
      links[j].classList.toggle('is-active', links[j].getAttribute('data-route') === navActive);
    }

    document.title = (has(CONTENT.meta && CONTENT.meta.siteTitle) ? CONTENT.meta.siteTitle : 'Portfolio');
  }

  var lastKey = '';
  function onRoute(scroll) {
    var state = parseHash();
    var key = state.route + '/' + state.param;
    render(state);
    if (scroll && key !== lastKey) window.scrollTo(0, 0);
    lastKey = key;
  }

  /* 자기소개 아코디언 — 이벤트 위임 (iOS Safari 대응) */
  document.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('[data-qa]') : null;
    if (!btn) return;
    var box = btn.parentNode;
    var open = box.classList.toggle('is-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  /* 부팅 */
  function boot() {
    var meta = CONTENT.meta || {};
    if (has(meta.brandMark)) document.getElementById('brandMark').textContent = meta.brandMark;
    if (has(meta.brandName)) document.getElementById('brandName').textContent = meta.brandName;
    document.getElementById('footerLeft').innerHTML = txt(meta.footerLeft, '푸터 왼쪽');
    document.getElementById('footerRight').innerHTML = txt(meta.footerRight, '푸터 오른쪽');

    if (!location.hash) location.replace('#about');
    onRoute(false);
    window.addEventListener('hashchange', function () { onRoute(true); }, false);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
