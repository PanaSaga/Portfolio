<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<meta name="color-scheme" content="light" />
<title>Portfolio</title>
<meta name="description" content="게임 기획 포트폴리오" />

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />

<style>
/* ============================================================
   Design tokens — Lightdash
   ============================================================ */
:root{
  --canvas:#fffdfa;
  --cloud:#fcf7ec;
  --frost:#f2eee2;
  --ash:#cdd2d9;
  --mist:#c1c7d0;
  --fog:#a4abb8;
  --steel:#818898;
  --slate:#666d80;
  --graphite:#36394a;
  --midnight:#272835;
  --onyx:#1a1b25;
  --violet:#5e4cff;
  --lavender:#c8ccf3;
  --lilac:#dfdbff;

  /* 모자이크 톤 (레퍼런스 히어로 그라데이션) */
  --px1:#efedff;
  --px2:#dfdbff;
  --px3:#b3a9ff;
  --px4:#5e4cff;
  --px5:#3520cf;

  --font-sans:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Roboto,'Helvetica Neue',sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,monospace;

  --text-caption:12px;
  --text-body-sm:14px;
  --text-body:16px;
  --text-subheading:20px;
  --text-heading-sm:24px;
  --text-heading:32px;

  --s4:4px; --s8:8px; --s12:12px; --s16:16px; --s20:20px; --s24:24px;
  --s32:32px; --s40:40px; --s48:48px; --s64:64px; --s80:80px;

  --page-max:1200px;
  --nav-h:60px;

  --r-card:12px;
  --r-btn:8px;
  --r-pill:999px;

  --sh-hairline:rgba(39,40,53,.10) 0 0 0 1px;
  --sh-card:rgba(39,40,53,.10) 0 0 0 1px, rgba(39,40,53,.08) 0 24px 24px -12px, rgba(39,40,53,.08) 0 12px 12px -6px, rgba(39,40,53,.08) 0 6px 6px -3px, rgba(39,40,53,.08) 0 2px 2px -1px;
  --sh-soft:rgba(39,40,53,.05) 0 0 0 1px, rgba(39,40,53,.02) 0 30px 18px 0, rgba(39,40,53,.04) 0 13px 13px 0, rgba(39,40,53,.05) 0 3px 7px 0;

  --sa-l:env(safe-area-inset-left, 0px);
  --sa-r:env(safe-area-inset-right, 0px);
  --sa-b:env(safe-area-inset-bottom, 0px);
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--canvas);
  color:var(--graphite);
  font-family:var(--font-sans);
  font-size:var(--text-body);
  line-height:1.5;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:rgba(94,76,255,.12);
  word-break:keep-all;
  overflow-wrap:break-word;
}
img{max-width:100%;height:auto;display:block;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
input{font:inherit;color:inherit;}
ul,ol{margin:0;padding:0;list-style:none;}
h1,h2,h3,h4,p{margin:0;}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:4px;}

/* ============================================================
   Layout
   ============================================================ */
.wrap{
  width:100%;max-width:var(--page-max);margin:0 auto;
  padding-left:calc(20px + var(--sa-l));
  padding-right:calc(20px + var(--sa-r));
}
.band{padding-top:var(--s64);padding-bottom:var(--s64);}
.band--cloud{background:var(--cloud);}
.band--tight{padding-top:var(--s40);padding-bottom:var(--s40);}

.sec-head{margin-bottom:var(--s24);display:flex;align-items:center;gap:var(--s16);}
.sec-head__ico{width:56px;height:56px;flex:0 0 auto;object-fit:contain;}
@media (max-width:559px){.sec-head__ico{width:44px;height:44px;}.sec-head{gap:var(--s12);}}
.sec-eyebrow{
  font-size:var(--text-caption);font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--violet);margin-bottom:4px;
}
.sec-title{
  font-size:clamp(20px,4vw,var(--text-heading-sm));
  font-weight:600;letter-spacing:-.02em;line-height:1.15;color:var(--graphite);
}
.sec-desc{margin-top:6px;color:var(--slate);font-size:var(--text-body-sm);}

.grid{display:grid;gap:var(--s16);}
.grid--1{grid-template-columns:minmax(0,1fr);}
.grid--2{grid-template-columns:minmax(0,1fr);}
.grid--3{grid-template-columns:minmax(0,1fr);}
.grid--4{grid-template-columns:repeat(2,minmax(0,1fr));}
@media (min-width:640px){
  .grid--2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .grid--3{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media (min-width:900px){
  .grid--3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .grid--4{grid-template-columns:repeat(4,minmax(0,1fr));}
}
/* 2:1 / 1:2 분할 */
.split{display:grid;gap:var(--s32);}
@media (min-width:900px){
  .split{grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:var(--s40);}   /* 좌 1 · 우 2 */
  .split--21{grid-template-columns:minmax(0,2fr) minmax(0,1fr);}              /* 좌 2 · 우 1 */
  .split--32{grid-template-columns:minmax(0,3fr) minmax(0,2fr);}              /* 좌 3 · 우 2 */
}

/* ============================================================
   Nav
   ============================================================ */
.nav{
  position:-webkit-sticky;position:sticky;top:0;z-index:50;
  background:rgba(255,253,250,.88);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--ash);
  padding-top:env(safe-area-inset-top, 0px);
}
.nav__inner{display:flex;align-items:center;justify-content:space-between;gap:var(--s12);height:var(--nav-h);}
.brand{display:flex;align-items:center;gap:var(--s8);flex:0 0 auto;}
.brand__mark{width:22px;height:22px;border-radius:5px;background:var(--violet);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;letter-spacing:-.02em;}
.brand__name{font-size:var(--text-body-sm);font-weight:600;letter-spacing:-.02em;white-space:nowrap;}
.navlinks{display:flex;align-items:center;gap:var(--s4);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -4px;padding:0 4px;}
.navlinks::-webkit-scrollbar{display:none;}
.navlink{flex:0 0 auto;padding:8px 12px;border-radius:var(--r-btn);font-size:var(--text-body-sm);font-weight:500;color:var(--slate);white-space:nowrap;transition:color .15s ease,background-color .15s ease;}
.navlink:hover{color:var(--graphite);background:var(--cloud);}
.navlink.is-active{color:var(--graphite);background:var(--frost);}
@media (max-width:560px){.brand__name{display:none;}.navlink{padding:8px 10px;}}

/* ============================================================
   Buttons / chips
   ============================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:11px 18px;border-radius:var(--r-btn);font-size:var(--text-body-sm);font-weight:500;letter-spacing:-.01em;transition:background-color .15s ease,border-color .15s ease,color .15s ease;}
.btn--violet{background:var(--violet);color:#fff;}
.btn--violet:hover{background:#4f3ff0;}
.btn--ghost{background:var(--canvas);border:1px solid var(--ash);color:var(--graphite);}
.btn--ghost:hover{border-color:var(--steel);}
.btn--dark{background:var(--midnight);color:#fff;}
.btn--dark:hover{background:var(--onyx);}
.btn--sm{min-height:36px;padding:8px 14px;font-size:13px;}

.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--r-pill);background:var(--cloud);color:var(--graphite);font-size:var(--text-caption);font-weight:500;letter-spacing:-.01em;white-space:nowrap;}
.chip--violet{background:var(--lilac);color:var(--violet);}
.chip--xs{padding:2px 7px;font-size:11px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}

/* ============================================================
   Cards
   ============================================================ */
.card{background:var(--canvas);border:1px solid var(--ash);border-radius:var(--r-card);padding:var(--s16);}
.card--pad{padding:var(--s20);}
.card--soft{border-color:transparent;box-shadow:var(--sh-soft);}
.card__title{font-size:var(--text-subheading);font-weight:600;letter-spacing:-.02em;line-height:1.3;}
.card__body{margin-top:var(--s8);color:var(--slate);font-size:var(--text-body-sm);line-height:1.65;}
.card__meta{margin-top:var(--s4);color:var(--steel);font-size:var(--text-caption);}
a.card{display:block;transition:box-shadow .18s ease,border-color .18s ease,transform .18s ease;}
a.card:hover{border-color:transparent;box-shadow:var(--sh-card);}
a.card:active{transform:scale(.995);}

/* ============================================================
   Placeholder
   ============================================================ */
.ph{display:inline-block;padding:2px 8px;border:1px dashed var(--mist);border-radius:6px;background:repeating-linear-gradient(135deg,rgba(94,76,255,.04) 0 6px,transparent 6px 12px);color:var(--fog);font-size:.9em;font-weight:400;}
.ph--plain{padding:0;border:0;background:none;}
.ph-block{display:block;padding:var(--s20);border:1px dashed var(--mist);border-radius:var(--r-card);background:repeating-linear-gradient(135deg,rgba(94,76,255,.04) 0 6px,transparent 6px 12px);color:var(--steel);font-size:var(--text-body-sm);text-align:center;}
.ph-block code{font-family:var(--font-mono);font-size:12px;color:var(--violet);background:var(--lilac);border-radius:4px;padding:1px 5px;}
.ph-img{display:grid;place-items:center;border:1px dashed var(--mist);border-radius:var(--r-card);background:var(--cloud);color:var(--fog);font-size:var(--text-caption);aspect-ratio:16/9;width:100%;}

/* ============================================================
   아이콘 (assets/icons/*.png)
   ============================================================ */
.pico{display:inline-block;vertical-align:-.22em;width:1.3em;height:1.3em;flex:0 0 auto;object-fit:contain;}

/* ============================================================
   Hero + 코너 픽셀 모자이크
   ============================================================ */
.hero{position:relative;padding:var(--s48) 0 var(--s24);overflow:hidden;}
@media (min-width:900px){.hero{padding:var(--s80) 0 var(--s32);}}
.hero__inner{position:relative;z-index:1;}
.hero__logline{font-size:clamp(30px,8vw,64px);line-height:1.04;letter-spacing:-.03em;font-weight:600;color:var(--graphite);max-width:100%;}
/* 데스크톱에서는 우상단 모자이크를 피할 만큼만 남기고 오른쪽으로 길게 */
@media (min-width:900px){.hero__logline{max-width:calc(100% - 290px);}}
/* 도입 문단 = 로그라인의 2/3 크기 */
.hero__sub{margin-top:var(--s20);max-width:34ch;color:var(--slate);font-size:clamp(20px,5.33vw,42px);line-height:1.3;letter-spacing:-.025em;font-weight:500;}
.hero__sub p + p{margin-top:var(--s16);}
.hero__cta{display:flex;flex-wrap:wrap;gap:var(--s8);margin-top:var(--s24);}

.mosaic{--tile:28px;display:flex;flex-direction:column;line-height:0;pointer-events:none;}
.mrow{display:flex;}
.mt{width:var(--tile);height:var(--tile);}
.mt.t1{background:var(--px1);}
.mt.t2{background:var(--px2);}
.mt.t3{background:var(--px3);}
.mt.t4{background:var(--px4);}
.mt.t5{background:var(--px5);}
.mt.tx{background:repeating-linear-gradient(135deg,var(--px3) 0 3px,var(--px2) 3px 6px);}
/* 오른쪽 위에서 왼쪽 아래로 스르륵 나타난다 (페이지를 새로 열 때 한 번) */
.mosaic--in .mt{opacity:0;animation:mosaicIn .55s cubic-bezier(.22,.7,.3,1) both;}
@keyframes mosaicIn{
  from{opacity:0;transform:translate3d(14px,-14px,0) scale(.82);}
  to{opacity:1;transform:translate3d(0,0,0) scale(1);}
}
@media (prefers-reduced-motion:reduce){
  .mosaic--in .mt{opacity:1;animation:none;}
}
@media (min-width:900px){
  .hero__anchor{position:absolute;top:0;left:0;right:0;height:0;z-index:0;}
  .hero__anchor .wrap{position:relative;height:0;}
  .mosaic{position:absolute;top:0;right:calc(20px + var(--sa-r));z-index:0;--tile:30px;}
  /* About 이외의 페이지는 조밀한 코너 부분만 — 아래로 흘러내리는 꼬리는 생략 */
  .route > .hero__anchor .mrow:nth-child(n+8){display:none;}
}
@media (max-width:899px){
  .hero__anchor .wrap{padding:0;}
  .route > .hero__anchor{display:none;}   /* 모바일 이력서에서는 공간을 아낀다 */
  .mosaic{--tile:clamp(15px,4.6vw,26px);margin:0 0 var(--s24) auto;width:-webkit-fit-content;width:fit-content;}
  .mrow:nth-child(n+8){display:none;}
}

/* Work style — 3열, 헤어라인만으로 구분 */
.ws{display:grid;border-top:1px solid var(--ash);}
@media (min-width:820px){.ws{grid-template-columns:repeat(3,minmax(0,1fr));}}
.ws__item{padding:var(--s24) 0 var(--s32);border-bottom:1px solid var(--frost);}
@media (min-width:820px){
  .ws__item{padding:var(--s24) var(--s24) var(--s32) 0;border-bottom:0;}
  .ws__item + .ws__item{padding-left:var(--s24);border-left:1px solid var(--frost);}
}
.ws__top{display:flex;align-items:center;gap:var(--s12);}
.ws__icon{width:44px;height:44px;flex:0 0 auto;object-fit:contain;}
.ws__title{font-size:var(--text-heading-sm);font-weight:600;letter-spacing:-.02em;line-height:1.25;color:var(--graphite);}
.ws__desc{margin-top:var(--s12);color:var(--slate);font-size:17px;line-height:1.7;}

/* 대표 프로젝트 — 게시물 카드가 오른쪽에서 왼쪽으로 흐른다 */
/* 페이드가 본문 열(1200px)의 좌우 끝에 맞춰 거의 다 빠지도록 */
.marquee{position:relative;overflow:hidden;padding:var(--s8) 0 var(--s24);
  --edge:20px;
  -webkit-mask-image:linear-gradient(90deg,
    transparent 0, transparent var(--edge), #000 calc(var(--edge) + 130px),
    #000 calc(100% - var(--edge) - 130px), transparent calc(100% - var(--edge)), transparent 100%);
  mask-image:linear-gradient(90deg,
    transparent 0, transparent var(--edge), #000 calc(var(--edge) + 130px),
    #000 calc(100% - var(--edge) - 130px), transparent calc(100% - var(--edge)), transparent 100%);}
@media (min-width:1240px){
  .marquee{--edge:calc((100vw - var(--page-max)) / 2 + 20px);}
}
/* 마스크를 지원하지 않는 브라우저용 그라데이션 */
.marquee::before,.marquee::after{content:"";position:absolute;top:0;bottom:0;
  width:calc(var(--edge) + 130px);z-index:2;pointer-events:none;}
.marquee::before{left:0;background:linear-gradient(90deg,var(--cloud) 0,var(--cloud) var(--edge),rgba(252,247,236,0) 100%);}
.marquee::after{right:0;background:linear-gradient(270deg,var(--cloud) 0,var(--cloud) var(--edge),rgba(252,247,236,0) 100%);}
@supports (mask-image:linear-gradient(#000,#000)) or (-webkit-mask-image:linear-gradient(#000,#000)){
  .marquee::before,.marquee::after{display:none;}
}
.marquee__track{display:flex;width:-webkit-max-content;width:max-content;animation:marq 60s linear infinite;}
.marquee__track:hover{animation-play-state:paused;}
.marquee__set{display:flex;align-items:stretch;flex:0 0 auto;}
.mcard{flex:0 0 auto;width:250px;margin-right:var(--s16);background:var(--canvas);border:1px solid var(--ash);
  border-radius:var(--r-card);padding:var(--s12);display:flex;flex-direction:column;
  transition:box-shadow .18s ease,border-color .18s ease;}
.mcard:hover{border-color:transparent;box-shadow:var(--sh-card);}
.mcard__thumb{aspect-ratio:16/10;width:100%;border-radius:8px;object-fit:cover;background:var(--frost);}
.mcard__thumb-ph{aspect-ratio:16/10;width:100%;border-radius:8px;background:var(--frost);
  display:grid;place-items:center;color:var(--fog);font-size:11px;}
.mcard__kind{margin-top:10px;display:inline-flex;align-self:flex-start;font-size:10px;font-weight:700;
  letter-spacing:.04em;color:var(--violet);background:var(--lilac);border-radius:4px;padding:2px 6px;}
.mcard__t{margin-top:6px;font-size:var(--text-body-sm);font-weight:600;letter-spacing:-.02em;
  line-height:1.35;color:var(--graphite);}
@keyframes marq{from{transform:translate3d(0,0,0);}to{transform:translate3d(-50%,0,0);}}
@media (prefers-reduced-motion:reduce){.marquee__track{animation:none;}}
@supports not (aspect-ratio: 1 / 1){
  .mcard__thumb,.mcard__thumb-ph{height:0;padding-bottom:62.5%;}
}

/* 하단 바로가기 — 버튼처럼 */
.jump{display:grid;gap:var(--s12);}
@media (min-width:720px){.jump{grid-template-columns:repeat(3,minmax(0,1fr));}}
.jump__btn{display:flex;align-items:center;justify-content:space-between;gap:var(--s12);
  min-height:64px;padding:16px 20px;border-radius:var(--r-btn);
  background:var(--canvas);border:1px solid var(--ash);box-shadow:rgba(39,40,53,.06) 0 2px 4px 0;
  transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease,transform .12s ease;}
.jump__btn:hover{border-color:var(--violet);box-shadow:rgba(94,76,255,.16) 0 4px 14px 0;}
.jump__btn:active{transform:translateY(1px);}
.jump__l{display:grid;gap:2px;min-width:0;}
.jump__t{font-size:var(--text-body);font-weight:600;letter-spacing:-.02em;}
.jump__d{font-size:var(--text-caption);color:var(--steel);}
.jump__arrow{flex:0 0 auto;font-size:17px;color:var(--violet);font-weight:600;}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--ash);border:1px solid var(--ash);border-radius:var(--r-card);overflow:hidden;}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr));}}
.stat{background:var(--canvas);padding:var(--s16);}
.stat__value{font-size:var(--text-heading-sm);font-weight:600;letter-spacing:-.02em;line-height:1.2;}
.stat__label{margin-top:2px;color:var(--steel);font-size:var(--text-caption);}

/* ============================================================
   Tabs
   ============================================================ */
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--cloud);border-radius:var(--r-pill);max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:9px 20px;border-radius:var(--r-pill);font-size:var(--text-body-sm);font-weight:500;color:var(--slate);white-space:nowrap;}
.tab.is-active{background:var(--canvas);color:var(--graphite);border:1px solid var(--ash);padding:8px 19px;box-shadow:rgba(39,40,53,.06) 0 2px 4px 0;}

/* ============================================================
   Profile
   ============================================================ */
.profile{display:grid;gap:var(--s20);}
/* 사진 + 인적사항 묶음을 가운데에, 내용은 왼쪽 정렬 */
@media (min-width:720px){
  .profile{grid-template-columns:-webkit-max-content -webkit-max-content;
    grid-template-columns:max-content max-content;gap:var(--s24);align-items:start;justify-content:center;}
}
/* 증명사진 비율(3:4) */
.profile__photo{width:162px;height:216px;border-radius:var(--r-card);object-fit:cover;background:var(--frost);}
.profile__photo-ph{width:162px;height:216px;border-radius:var(--r-card);border:1px dashed var(--mist);background:var(--cloud);display:grid;place-items:center;color:var(--fog);font-size:var(--text-caption);text-align:center;padding:8px;}
.profile__name{font-size:clamp(32px,7.5vw,52px);font-weight:600;letter-spacing:-.03em;line-height:1.1;
  display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;}
.profile__name-en{font-size:clamp(17px,4vw,26px);font-weight:500;letter-spacing:-.01em;color:var(--steel);}
.profile__logline{margin-top:var(--s12);color:var(--slate);font-size:clamp(15px,3.6vw,18px);line-height:1.6;}

.pinfo{margin-top:var(--s20);display:grid;gap:10px;max-width:720px;}
.pinfo__row{display:flex;flex-wrap:wrap;align-items:center;gap:8px var(--s20);}
.pinfo__i{display:inline-flex;align-items:center;gap:8px;font-size:var(--text-body);
  color:var(--graphite);letter-spacing:-.01em;overflow-wrap:anywhere;}
.pinfo__i .pico{width:18px;height:18px;color:var(--violet);}
.pinfo__sep{color:var(--ash);font-size:var(--text-body);}
@media (max-width:559px){.pinfo__sep{display:none;}.pinfo__row{gap:8px var(--s16);}}

.deflist{margin-top:var(--s20);display:grid;gap:1px;background:var(--ash);border:1px solid var(--ash);border-radius:var(--r-card);overflow:hidden;max-width:720px;}
.deflist__row{background:var(--canvas);display:grid;grid-template-columns:64px minmax(0,1fr);gap:var(--s8);padding:13px var(--s16);align-items:baseline;}
.deflist__k{color:var(--steel);font-size:var(--text-body-sm);font-weight:500;}
.deflist__v{font-size:var(--text-body);color:var(--graphite);overflow-wrap:anywhere;}
/* 이메일 + 연락처 한 행 */
.deflist__row--pair{grid-template-columns:64px minmax(0,1fr);}
@media (min-width:560px){
  .deflist__row--pair{grid-template-columns:64px -webkit-max-content 64px minmax(0,1fr);
    grid-template-columns:64px max-content 64px minmax(0,1fr);column-gap:var(--s24);}
}

/* ============================================================
   경력 · 대외활동 — 세로로 줄을 따라 내려오는 타임라인
   ============================================================ */
.sec-head--rule{border-bottom:1px solid var(--ash);padding-bottom:var(--s12);}
.sec-head--tight{margin-bottom:var(--s16);}
.tgroup + .tgroup{margin-top:var(--s32);}
.tyear{font-size:var(--text-subheading);font-weight:600;letter-spacing:-.02em;color:var(--violet);
  line-height:1;margin-bottom:var(--s16);}
.tyear .ph{font-size:13px;}
.titem{position:relative;display:grid;grid-template-columns:112px minmax(0,1fr);gap:var(--s16);
  padding-bottom:var(--s24);}
.titem:last-child{padding-bottom:0;}
/* 항목을 잇는 세로선 */
.titem:not(:last-child)::before{content:"";position:absolute;left:55px;top:120px;bottom:4px;
  width:1px;background:var(--ash);}
.titem__img{width:112px;height:112px;border-radius:12px;object-fit:cover;background:var(--frost);position:relative;z-index:1;}
.titem__img-ph{width:112px;height:112px;border-radius:12px;border:1px dashed var(--mist);background:var(--cloud);
  display:grid;place-items:center;color:var(--fog);font-size:11px;text-align:center;position:relative;z-index:1;}
.titem__name{font-size:var(--text-body);font-weight:600;letter-spacing:-.02em;line-height:1.3;}
.titem__date{margin-top:4px;color:var(--violet);font-size:var(--text-caption);font-weight:500;font-variant-numeric:tabular-nums;}
.titem__desc{margin-top:var(--s8);color:var(--slate);font-size:var(--text-body-sm);line-height:1.65;}
.titem__links{margin-top:var(--s12);}
/* 경력만 글자를 2pt 씩 키운다 (대외활동은 그대로) */
.titem--lg .titem__name{font-size:var(--text-subheading);}
.titem--lg .titem__date{font-size:var(--text-body-sm);}
.titem--lg .titem__desc{font-size:var(--text-body);}
@media (max-width:479px){
  .titem{grid-template-columns:88px minmax(0,1fr);}
  .titem__img,.titem__img-ph{width:88px;height:88px;}
  .titem:not(:last-child)::before{left:43px;top:96px;}
}

/* ============================================================
   Timeline
   ============================================================ */
.timeline{display:grid;gap:var(--s16);}
.tl{background:var(--canvas);border:1px solid var(--ash);border-radius:var(--r-card);padding:var(--s20);}
@media (min-width:900px){.tl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s24);padding:var(--s24);}}
.tl__aside{display:flex;flex-direction:column;gap:6px;}
.tl__period{color:var(--steel);font-size:var(--text-caption);font-weight:500;}
.tl__org{font-size:var(--text-subheading);font-weight:600;letter-spacing:-.02em;line-height:1.25;}
.tl__role{margin-top:2px;color:var(--violet);font-size:var(--text-body-sm);font-weight:500;}
.tl__summary{color:var(--slate);font-size:var(--text-body-sm);line-height:1.7;}
@media (max-width:899px){.tl__summary{margin-top:var(--s12);}}
.bullets{margin-top:var(--s12);display:grid;gap:8px;}
.bullets li{position:relative;padding-left:16px;color:var(--slate);font-size:var(--text-body-sm);line-height:1.65;}
.bullets li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:1px;background:var(--violet);}
.tl__foot{margin-top:var(--s16);padding-top:var(--s12);border-top:1px solid var(--frost);}
.tl__footlabel{color:var(--steel);font-size:var(--text-caption);margin-bottom:6px;}

/* Skills — 탭 하나가 통째로 하나의 판, 그 안에서 2열 */
.skills{background:var(--canvas);border:1px solid var(--ash);border-radius:var(--r-card);
  padding:var(--s24);display:grid;gap:var(--s32) var(--s40);}
@media (min-width:720px){.skills{grid-template-columns:repeat(2,minmax(0,1fr));}}
.skill__icons{display:flex;flex-wrap:wrap;gap:8px;}
.skill__icon{width:44px;height:44px;border-radius:10px;object-fit:contain;background:var(--cloud);padding:4px;flex:0 0 auto;}
.skill__icon-ph{width:44px;height:44px;border-radius:10px;border:1px dashed var(--mist);background:var(--cloud);display:grid;place-items:center;color:var(--fog);font-size:10px;flex:0 0 auto;text-align:center;line-height:1.2;}
.skill__name{margin-top:var(--s12);font-size:var(--text-heading-sm);font-weight:600;letter-spacing:-.02em;line-height:1.25;}
.skill__dots{display:flex;gap:4px;margin-top:6px;}
.skill__dots i{width:8px;height:8px;border-radius:2px;background:var(--frost);display:block;}
.skill__dots i.on{background:var(--violet);}
.skill__note{margin-top:var(--s8);color:var(--slate);font-size:var(--text-body-sm);line-height:1.65;}

/* ============================================================
   자기소개 — 한 페이지 나열 (이력서와 같은 카드 리듬)
   ============================================================ */
.intro-list{display:grid;gap:var(--s16);}
.intro-item{background:var(--canvas);border:1px solid var(--ash);border-radius:var(--r-card);padding:var(--s24);}
@media (min-width:900px){.intro-item{padding:var(--s32);}}
.intro-item__no{color:var(--violet);font-size:var(--text-caption);font-weight:600;letter-spacing:.08em;margin-bottom:var(--s8);}
.intro-item__q{font-size:clamp(19px,4.4vw,26px);font-weight:600;letter-spacing:-.025em;line-height:1.35;color:var(--graphite);}
.intro-item__a{margin-top:var(--s16);color:var(--slate);font-size:clamp(15px,3.6vw,16px);line-height:1.85;}
.intro-item__a p + p{margin-top:var(--s16);}

/* ============================================================
   Portfolio 게시물
   ============================================================ */
.post-thumb{aspect-ratio:16/10;width:100%;border-radius:8px;object-fit:cover;background:var(--frost);margin-bottom:var(--s16);}
.post-thumb-ph{aspect-ratio:16/10;width:100%;border-radius:8px;margin-bottom:var(--s16);border:1px dashed var(--mist);background:var(--cloud);display:grid;place-items:center;color:var(--fog);font-size:var(--text-caption);}
.post-kind{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:5px;background:var(--lilac);color:var(--violet);font-size:11px;font-weight:700;letter-spacing:.03em;}
.post--sample{border-style:dashed;border-color:var(--mist);}
.post__title{font-size:var(--text-body);font-weight:600;letter-spacing:-.02em;line-height:1.35;margin-top:var(--s8);}
.post__desc{margin-top:6px;color:var(--slate);font-size:13px;line-height:1.55;}

/* 납작한 프로젝트 카드 — 왼쪽 대표 이미지, 오른쪽 제목/설명 */
.plist{display:grid;gap:var(--s12);}
.pcard{display:grid;grid-template-columns:118px minmax(0,1fr);gap:var(--s16);align-items:center;
  background:var(--canvas);border:1px solid var(--ash);border-radius:var(--r-card);padding:var(--s12);
  transition:box-shadow .18s ease,border-color .18s ease;}
.pcard:hover{border-color:transparent;box-shadow:var(--sh-card);}
.pcard--sample{border-style:dashed;border-color:var(--mist);}
.pcard__thumb{aspect-ratio:4/3;width:100%;border-radius:8px;object-fit:cover;background:var(--frost);}
.pcard__thumb-ph{aspect-ratio:4/3;width:100%;border-radius:8px;border:1px dashed var(--mist);
  background:var(--cloud);display:grid;place-items:center;color:var(--fog);font-size:11px;}
.pcard__t{font-size:var(--text-body);font-weight:600;letter-spacing:-.02em;line-height:1.35;}
.pcard__d{margin-top:5px;color:var(--slate);font-size:var(--text-body-sm);line-height:1.55;}
.pcard__kind{margin-bottom:5px;display:inline-flex;font-size:10px;font-weight:700;letter-spacing:.04em;
  color:var(--violet);background:var(--lilac);border-radius:4px;padding:2px 6px;}
.plist.is-collapsed .pcard:nth-child(n+5){display:none;}
.plist-more{margin-top:var(--s12);width:100%;display:flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;border:1px solid var(--ash);border-radius:var(--r-btn);background:var(--canvas);
  font-size:var(--text-body-sm);font-weight:500;color:var(--slate);transition:border-color .15s ease,color .15s ease;}
.plist-more:hover{border-color:var(--violet);color:var(--violet);}
.plist-more__c{transition:transform .2s ease;}
.plist-more[aria-expanded="true"] .plist-more__c{transform:rotate(180deg);}
@supports not (aspect-ratio: 1 / 1){
  .pcard__thumb,.pcard__thumb-ph{height:0;padding-bottom:75%;}
}

/* 상세 */
.detail-back{display:inline-flex;align-items:center;gap:6px;color:var(--slate);font-size:var(--text-body-sm);font-weight:500;margin-bottom:var(--s20);}
.detail-back:hover{color:var(--violet);}
/* 본문 블록은 가운데, 글자는 왼쪽 */
.detail-col{max-width:840px;margin:0 auto;text-align:left;}
.detail__head{text-align:left;}
.detail__title{font-size:clamp(28px,7vw,48px);font-weight:600;letter-spacing:-.03em;line-height:1.05;}
.detail__tagline{margin-top:var(--s12);color:var(--slate);font-size:clamp(15px,3.8vw,18px);line-height:1.6;max-width:60ch;}
.detail__body{margin-top:var(--s24);}

.meta2{display:grid;gap:1px;background:var(--ash);border:1px solid var(--ash);border-radius:var(--r-card);overflow:hidden;margin-top:var(--s24);}
@media (min-width:560px){.meta2{grid-template-columns:repeat(2,minmax(0,1fr));}}
.meta2__cell{background:var(--canvas);padding:14px var(--s16);display:grid;grid-template-columns:76px minmax(0,1fr);align-items:baseline;gap:var(--s12);}
.meta2__k{color:var(--steel);font-size:var(--text-caption);font-weight:500;flex:0 0 auto;}
.meta2__v{font-size:var(--text-body-sm);color:var(--graphite);overflow-wrap:anywhere;}

.detail-sec{margin-top:var(--s48);}
.detail-sec__h{font-size:var(--text-heading-sm);font-weight:600;letter-spacing:-.02em;margin-bottom:var(--s12);display:inline-flex;align-items:center;gap:8px;}
.detail-sec__h .pico{color:var(--violet);}
.detail-sec__body{color:var(--slate);font-size:var(--text-body-sm);line-height:1.8;}
.detail-sec__body p + p{margin-top:var(--s12);}
.detail-hero{margin-top:var(--s24);}
.figure{margin-top:var(--s16);}
.figure img{width:100%;border-radius:var(--r-card);border:1px solid var(--ash);}
.figure figcaption{margin-top:6px;color:var(--steel);font-size:var(--text-caption);}
.notice{margin-bottom:var(--s24);padding:var(--s16);border:1px dashed var(--mist);border-radius:var(--r-card);background:var(--cloud);color:var(--slate);font-size:var(--text-body-sm);text-align:left;}

/* ============================================================
   History — 그래프 · 카운터 · 게임
   ============================================================ */
.hist__top{display:grid;gap:var(--s24);}
@media (min-width:900px){.hist__top{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s40);align-items:start;}}
.radar-wrap{background:var(--canvas);border:1px solid var(--ash);border-radius:var(--r-card);padding:var(--s20);}
.radar{width:100%;height:auto;display:block;max-width:480px;margin:0 auto;overflow:visible;}

.count--hero{background:var(--onyx);border:1px solid transparent;border-radius:var(--r-card);padding:var(--s20);margin-top:var(--s16);}
.count--hero .count__v{font-size:clamp(26px,6vw,38px);font-weight:600;letter-spacing:-.03em;line-height:1;color:#fff;}
.count--hero .count__l{margin-top:8px;color:var(--fog);font-size:var(--text-body-sm);}
.count--hero .ph{color:var(--steel);border-color:#3a3b4a;}
.plat{margin-top:var(--s16);display:grid;gap:1px;background:var(--ash);border:1px solid var(--ash);border-radius:var(--r-card);overflow:hidden;}
@media (min-width:480px){.plat{grid-template-columns:repeat(3,minmax(0,1fr));}}
.plat__cell{background:var(--canvas);padding:var(--s16);}
.plat__l{color:var(--steel);font-size:var(--text-caption);font-weight:500;}
.plat__v{margin-top:4px;font-size:var(--text-heading-sm);font-weight:600;letter-spacing:-.02em;line-height:1.1;}
.plat__bar{margin-top:8px;height:4px;border-radius:2px;background:var(--frost);overflow:hidden;}
.plat__bar i{display:block;height:100%;background:var(--violet);}

/* 출시 연식 도넛 그래프 */
.donut{background:var(--canvas);border:1px solid var(--ash);border-radius:var(--r-card);padding:var(--s20);}
.donut__legend{display:flex;flex-wrap:wrap;gap:8px var(--s16);margin-bottom:var(--s16);}
.donut__lg{display:inline-flex;align-items:center;gap:7px;font-size:var(--text-body-sm);font-weight:600;color:var(--graphite);}
.donut__sw{width:11px;height:11px;border-radius:2px;flex:0 0 auto;}
.donut__body{display:flex;align-items:center;gap:var(--s20);flex-wrap:wrap;}
.donut__svg{width:170px;height:170px;flex:0 0 auto;}
.donut__call{position:relative;flex:1 1 190px;min-width:0;background:var(--frost);border-radius:var(--r-card);padding:var(--s16) var(--s20);}
@media (min-width:520px){
  .donut__call::before{content:"";position:absolute;left:-9px;top:38px;width:0;height:0;
    border-top:10px solid transparent;border-bottom:10px solid transparent;border-right:10px solid var(--frost);}
}
.donut__pct{font-size:clamp(28px,7vw,40px);font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--violet);}
.donut__lab{margin-top:6px;font-size:var(--text-body);font-weight:600;color:var(--graphite);}
.donut__note{margin-top:8px;font-size:var(--text-caption);color:var(--steel);line-height:1.5;}

/* 태그 드롭다운 필터 — 수치 하단, 좁게 */
.filter{margin-top:var(--s16);display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--s12);}
.fsel{display:grid;gap:6px;min-width:0;flex:1 1 120px;max-width:220px;}
.fsel__l{color:var(--steel);font-size:var(--text-caption);font-weight:600;letter-spacing:.04em;}
.fsel__box{position:relative;}
.fsel select{
  -webkit-appearance:none;appearance:none;
  width:100%;border:1px solid var(--ash);border-radius:var(--r-btn);background:var(--canvas);
  padding:11px 34px 11px 12px;font-size:16px;letter-spacing:-.01em;color:var(--graphite);
  line-height:1.2;min-height:44px;
}
.fsel select:focus{outline:2px solid rgba(94,76,255,.35);outline-offset:0;border-color:var(--violet);}
.fsel__caret{position:absolute;right:12px;top:50%;margin-top:-3px;pointer-events:none;color:var(--fog);}
.filter__foot{display:flex;align-items:center;gap:var(--s12);flex:0 0 auto;padding-bottom:2px;}
.filter__count{color:var(--slate);font-size:var(--text-caption);font-weight:500;white-space:nowrap;}
.filter__count b{color:var(--violet);font-weight:600;}

/* 게임 그리드 — 6열 */
.games{display:grid;gap:var(--s12);grid-template-columns:repeat(2,minmax(0,1fr));}
@media (min-width:520px){.games{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media (min-width:760px){.games{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media (min-width:1000px){.games{grid-template-columns:repeat(6,minmax(0,1fr));}}
.game{background:var(--canvas);border:1px solid var(--ash);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
.game__img{aspect-ratio:4/3;width:100%;object-fit:cover;background:var(--frost);}
.game__img-ph{aspect-ratio:4/3;width:100%;background:var(--frost);display:grid;place-items:center;color:var(--fog);font-size:11px;}
.game__b{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1;}
.game__t{font-size:13px;font-weight:600;letter-spacing:-.02em;line-height:1.3;color:var(--graphite);}
.game__tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;}
.game__tag{padding:2px 6px;border-radius:4px;background:var(--cloud);color:var(--steel);font-size:10px;font-weight:500;line-height:1.5;white-space:nowrap;}
.game__tag--p{background:var(--lilac);color:var(--violet);}
.game__tag--e{background:var(--frost);color:var(--graphite);}
.games-empty{margin-top:var(--s20);}

/* ============================================================
   Footer / routes
   ============================================================ */
.footer{border-top:1px solid var(--ash);padding:var(--s40) 0 calc(var(--s40) + var(--sa-b));background:var(--cloud);}
.footer__row{display:flex;flex-wrap:wrap;gap:6px var(--s12);align-items:center;justify-content:flex-end;}
.footer__note{color:var(--steel);font-size:var(--text-caption);}
.footer__name{color:var(--graphite);font-weight:600;}
.route{display:none;position:relative;}
.route-body{position:relative;z-index:1;}
.route.is-active{display:block;}

@supports not (aspect-ratio: 1 / 1){
  .post-thumb,.post-thumb-ph{height:0;padding-bottom:62.5%;}
  .ph-img{height:0;padding-bottom:56.25%;}
  .game__img,.game__img-ph{height:0;padding-bottom:75%;}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav__inner">
    <a class="brand" href="#about">
      <span class="brand__mark" id="brandMark">P</span>
      <span class="brand__name" id="brandName">Portfolio</span>
    </a>
    <nav class="navlinks" id="navlinks" aria-label="주요 메뉴">
      <a class="navlink" href="#about"     data-route="about">About</a>
      <a class="navlink" href="#resume"    data-route="resume">Resume</a>
      <a class="navlink" href="#portfolio" data-route="portfolio">Portfolio</a>
      <a class="navlink" href="#history"   data-route="history">History</a>
    </nav>
  </div>
</header>

<noscript>
  <div class="wrap" style="padding:32px 20px">
    <div class="card card--pad">이 페이지는 JavaScript로 내용을 표시합니다. 브라우저에서 JavaScript를 켜 주세요.</div>
  </div>
</noscript>

<main id="app">
  <section class="route" id="route-about"     data-route="about"></section>
  <section class="route" id="route-resume"    data-route="resume"></section>
  <section class="route" id="route-portfolio" data-route="portfolio"></section>
  <section class="route" id="route-post"      data-route="post"></section>
  <section class="route" id="route-history"   data-route="history"></section>
</main>

<footer class="footer">
  <div class="wrap footer__row">
    <div class="footer__note footer__name" id="footerName"></div>
    <div class="footer__note" id="footerUpdated"></div>
  </div>
</footer>

<script>
/* ================================================================
 *  CONTENT — 여기만 채우면 페이지 전체가 완성됩니다.
 *  ----------------------------------------------------------------
 *  · 빈 문자열('')이나 빈 배열([])로 두면 화면에 점선 안내가 표시됩니다.
 *  · SHOW_PLACEHOLDER = false 로 바꾸면 빈 항목이 아예 숨겨집니다.
 *  · 배열 항목은 형태를 유지한 채 복사해서 개수를 늘리면 됩니다.
 * ================================================================ */

var SHOW_PLACEHOLDER = true;

/* 상세 페이지 설명은 2행 2열 — 기간 / 플랫폼, 팀 / 역할 */
function SAMPLE_META() {
  return [
    { label: '기간',   value: '' }, { label: '플랫폼', value: '' },
    { label: '팀',     value: '' }, { label: '역할',   value: '' }
  ];
}
function SAMPLE_SECTIONS() {
  return [
    { heading: '', body: '', bullets: [], images: [ { src: '', caption: '' } ] },
    { heading: '', body: '', bullets: [], images: [] }
  ];
}

function SAMPLE_POST(id, title, kind) {
  return {
    id: id, sample: true, title: title, tagline: '', kind: kind || '',
    thumb: '', tags: [], meta: SAMPLE_META(),
    links: [ { label: '', href: '', style: 'violet' } ],
    sections: SAMPLE_SECTIONS()
  };
}

/* ================================================================
 *  이 아래는 화면을 그리는 코드입니다. 내용 수정은 위 CONTENT 에서만 하세요.
 * ================================================================ */
(function () {
  'use strict';

  /* ---------- 유틸 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function has(v) { return typeof v === 'string' ? v.trim() !== '' : !!v; }
  function hasList(a) { return Array.isArray(a) && a.length > 0; }
  function ph(label) { return SHOW_PLACEHOLDER ? '<span class="ph">' + esc(label) + '</span>' : ''; }
  function phPlain(label) { return SHOW_PLACEHOLDER ? '<span class="ph ph--plain">' + esc(label) + '</span>' : ''; }
  function txtPlain(v, label) { return has(v) ? esc(v) : phPlain(label); }
  function bodyPlain(v, label) { return has(v) ? nl2p(v) : '<p>' + phPlain(label) + '</p>'; }
  function txt(value, label) { return has(value) ? esc(value) : ph(label); }
  function phBlock(label, path) {
    if (!SHOW_PLACEHOLDER) return '';
    return '<div class="ph-block">' + esc(label) + (path ? '<br><code>' + esc(path) + '</code>' : '') + '</div>';
  }
  function nl2p(t) {
    return String(t).split(/\n\s*\n/).map(function (p) {
      return '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }
  function body(v, label) { return has(v) ? nl2p(v) : '<p>' + ph(label) + '</p>'; }
  function chips(list, cls) {
    var arr = (list || []).filter(has);
    if (!arr.length) return '';
    return '<div class="chips">' + arr.map(function (t) {
      return '<span class="chip ' + (cls || '') + '">' + esc(t) + '</span>';
    }).join('') + '</div>';
  }
  function bullets(list) {
    var arr = (list || []).filter(has);
    if (!arr.length) return '';
    return '<ul class="bullets">' + arr.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul>';
  }
  function imgOr(src, alt, imgClass, phClass, phLabel) {
    if (has(src)) return '<img class="' + imgClass + '" src="' + esc(src) + '" alt="' + esc(alt) + '" loading="lazy">';
    if (!SHOW_PLACEHOLDER) return '';
    return '<div class="' + phClass + '">' + esc(phLabel) + '</div>';
  }
  function isExternal(h) { return /^(https?:)?\/\//i.test(h); }
  function linkAttrs(href) {
    if (!has(href)) return 'href="#" aria-disabled="true"';
    return 'href="' + esc(href) + '"' +
      (isExternal(href) || /\.pdf($|\?)/i.test(href) ? ' target="_blank" rel="noopener noreferrer"' : '');
  }
  function desc(key) {
    var d = (CONTENT.descs || {})[key];
    return has(d) ? esc(d) : '상세 설명 첨부';
  }

  /* ---------- 아이콘 (assets/icons/*.png) ---------- */
  var ICON_DIR = 'assets/icons/';
  var ICONS = {
    birth:'birth', school:'school', email:'email', phone:'phone', pin:'pin',
    office:'office', project:'project', target:'target', poker:'poker', resume:'resume',
    gamepad:'gamepad', pdf:'pdf', video:'video', chart:'chart', domino:'domino'
  };
  /* Work style 기본 아이콘 */
  var BIG_ICONS = ['gamepad', 'poker', 'video'];

  function pico(name, cls) {
    var f = ICONS[name] || ICONS.project;
    return '<img class="pico ' + (cls || '') + '" src="' + ICON_DIR + f + '.png" alt="" aria-hidden="true" loading="lazy">';
  }

  /* 섹션 머리말 — 큰 아이콘 + 작은 제목. 설명은 CONTENT.descs 를 채운 경우에만 표시 */
  function headBlock(icon, eyebrow, title, key, extraClass) {
    var d = (CONTENT.descs || {})[key];
    return '<div class="sec-head ' + (extraClass || '') + '">' +
      '<img class="sec-head__ico" src="' + ICON_DIR + (ICONS[icon] || ICONS.project) + '.png" alt="" aria-hidden="true">' +
      '<div>' +
        (eyebrow ? '<div class="sec-eyebrow">' + esc(eyebrow) + '</div>' : '') +
        '<h2 class="sec-title">' + esc(title) + '</h2>' +
        (has(d) ? '<p class="sec-desc">' + esc(d) + '</p>' : '') +
      '</div></div>';
  }
  function sectionHead(icon, eyebrow, title, key) {
    return headBlock(icon, eyebrow, title, key, '');
  }

  /* ---------- 코너 픽셀 모자이크 ----------
     우상단에 밀착된 조밀한 덩어리가 대각선으로 흩어지는 형태.
     숫자는 톤(1 = 가장 옅음 … 5 = 가장 진함), x 는 텍스처 타일. */
  var MOSAIC = [
    '.....1243554',
    '....2.45x.45',
    '.....2.14352',
    '.......13x24',
    '........2143',
    '.........124',
    '..........13',
    '.........2.1',
    '..........2.',
    '........1..2',
    '..........1.',
    '.........4..',
    '..........2.',
    '........1.2.'
  ];
  /* animate=true 면 오른쪽 위에서 왼쪽 아래로 순서대로 나타난다.
     페이지를 새로 열 때 한 번만 재생된다 — 연출이 끝나면 클래스를 떼어내므로
     탭을 오갔다 돌아와도 다시 재생되지 않는다. */
  var mosaicPlayed = false;
  function mosaic(animate) {
    var cols = MOSAIC[0].length;
    return '<div class="mosaic' + (animate ? ' mosaic--in' : '') + '" aria-hidden="true">' +
      MOSAIC.map(function (row, r) {
        var cells = '';
        for (var i = 0; i < row.length; i++) {
          var c = row.charAt(i);
          var delay = animate ? ' style="animation-delay:' + (((cols - 1 - i) + r) * 0.042).toFixed(3) + 's"' : '';
          cells += '<i class="mt' + (c === '.' ? '' : ' t' + c) + '"' + delay + '></i>';
        }
        return '<div class="mrow">' + cells + '</div>';
      }).join('') + '</div>';
  }
  /* 코너 모자이크를 페이지 우상단에 얹는 래퍼 */
  function mosaicAnchor(animate) {
    return '<div class="hero__anchor"><div class="wrap">' + mosaic(animate) + '</div></div>';
  }
  /* 라우트 최상단 우측에 코너 모자이크를 얹는다 */
  function withMosaic(html) {
    return mosaicAnchor(false) + '<div class="route-body">' + html + '</div>';
  }

  /* ================================================================
   *  1. About
   * ================================================================ */
  function renderAbout() {
    var a = CONTENT.about || {};
    var h = [];

    /* 히어로 — 버튼 없음 */
    h.push('<div class="hero">' + mosaicAnchor(!mosaicPlayed) + '<div class="wrap hero__inner">');
    h.push('<h1 class="hero__logline">' +
      (has(a.logline) ? esc(a.logline).replace(/\n/g, '<br>') : ph('로그라인 1 — 첫 페이지 헤드라인')) + '</h1>');
    h.push('<div class="hero__sub">' + body(a.intro, '헤드라인 아래 도입 문단') + '</div>');
    h.push('</div></div>');

    /* Work style — 도입 문단과 같은 글 안에 있는 것처럼 바짝 붙인다 */
    h.push('<div class="wrap" style="padding-bottom:var(--s64)">');
    h.push(headBlock('gamepad', '', 'Work style', 'workStyle', 'sec-head--tight'));
    if (hasList(a.workStyle)) {
      h.push('<div class="ws">' + a.workStyle.map(function (w, i) {
        return '<div class="ws__item">' +
          '<div class="ws__top">' + pico(w.icon || BIG_ICONS[i % BIG_ICONS.length], 'ws__icon') +
          '<h3 class="ws__title">' + txt(w.title, '제목') + '</h3></div>' +
          '<div class="ws__desc">' + body(w.desc, '설명') + '</div>' +
          '</div>';
      }).join('') + '</div>');
    } else {
      h.push(phBlock('Work style 항목', 'CONTENT.about.workStyle'));
    }
    h.push('</div>');

    /* 대표 프로젝트 — 오른쪽에서 왼쪽으로 흐르는 가느다란 띠 */
    h.push('<div class="band band--cloud" style="padding-bottom:var(--s40)">' +
      '<div class="wrap">' + headBlock('project', 'Featured', '대표 프로젝트', 'featured', 'sec-head--tight') + '</div>' +
      marquee() + '</div>');

    /* 하단 바로가기 — 버튼 */
    h.push('<div class="band"><div class="wrap"><div class="jump">' + [
      ['Resume', '경력 · 프로젝트 · 기술 · 자기소개', '#resume'],
      ['Portfolio', '메인 프로젝트 · 기획서 · AI 작업물', '#portfolio'],
      ['History', '선호 장르 그래프 · 플레이한 게임', '#history']
    ].map(function (x) {
      return '<a class="jump__btn" href="' + x[2] + '">' +
        '<span class="jump__l"><span class="jump__t">' + x[0] + '</span>' +
        '<span class="jump__d">' + x[1] + '</span></span>' +
        '<span class="jump__arrow" aria-hidden="true">→</span></a>';
    }).join('') + '</div>');
    if (has(a.closing)) {
      h.push('<div class="card card--pad card--soft" style="margin-top:var(--s24)">' +
        '<div class="card__body" style="font-size:var(--text-body)">' + nl2p(a.closing) + '</div></div>');
    }
    h.push('</div></div>');
    return h.join('');
  }

  /* 메인 프로젝트 · 기획서 · AI 작업물이 오른쪽에서 왼쪽으로 흐른다 */
  function marquee() {
    var p = CONTENT.portfolio || {};
    var list = [].concat(p.main || [], p.docs || [], p.ai || []);
    if (!list.length) return '<div class="wrap">' + phBlock('대표 프로젝트에 표시할 게시물', 'CONTENT.portfolio') + '</div>';

    var set = list.map(function (it) {
      var kind = has(it.kind) ? (KIND_LABEL[it.kind] || String(it.kind).toUpperCase()) : '';
      return '<a class="mcard" href="#post/' + esc(it.id || '') + '">' +
        imgOr(it.thumb, it.title || '', 'mcard__thumb', 'mcard__thumb-ph', '대표 이미지') +
        (kind ? '<span class="mcard__kind">' + esc(kind) + '</span>' : '') +
        '<span class="mcard__t">' + txt(it.title, '게시물 제목') + '</span></a>';
    }).join('');

    return '<div class="marquee"><div class="marquee__track">' +
      '<div class="marquee__set">' + set + '</div>' +
      '<div class="marquee__set" aria-hidden="true">' + set + '</div>' +
      '</div></div>';
  }

  /* ================================================================
   *  2. Resume
   * ================================================================ */
  function resumeTabs(sub) {
    return '<div class="wrap" style="padding-top:var(--s32)"><div class="tabs" role="tablist">' +
      '<a class="tab' + (sub !== 'intro' ? ' is-active' : '') + '" href="#resume">이력서</a>' +
      '<a class="tab' + (sub === 'intro' ? ' is-active' : '') + '" href="#resume/intro">자기소개</a>' +
      '</div></div>';
  }

  function profileBlock() {
    var p = (CONTENT.resume || {}).profile || {};
    function line(icon, value, label) {
      return '<span class="pinfo__i">' + pico(icon) + '<span>' + txt(value, label) + '</span></span>';
    }
    return '<div class="band band--tight"><div class="wrap"><div class="profile">' +
      '<div>' + imgOr(p.photo, '프로필 사진', 'profile__photo', 'profile__photo-ph', '프로필 사진') + '</div>' +
      '<div>' +
        '<h1 class="profile__name"><span>' + txt(p.name, '이름') + '</span>' +
          '<span class="profile__name-en">' + txt(p.nameEn, 'English name') + '</span></h1>' +
        '<p class="profile__logline">' + txt(p.logline2, '로그라인 2') + '</p>' +
        '<div class="pinfo">' +
          '<div class="pinfo__row">' + line('birth', p.birth, '0000.00.00') +
            '<span class="pinfo__sep">|</span>' + line('school', p.education, '학력') + '</div>' +
          '<div class="pinfo__row">' + line('email', p.email, '이메일') +
            line('phone', p.phone, '연락처') + '</div>' +
          '<div class="pinfo__row">' + line('pin', p.address, '주소') + '</div>' +
        '</div>' +
      '</div>' +

  /* ================================================================

  function radarSVG(axes) {
    var n = axes.length;
    if (n < 3) return phBlock('축이 3개 이상이어야 그래프가 그려집니다', 'CONTENT.history.axes');
    var W = 460, H = 360, cx = 230, cy = 172, R = 102, MAX = 5;

    function pt(i, r) {
      var a = (-90 + i * 360 / n) * Math.PI / 180;
      return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    }
    function poly(r) {
      var p = [];
      for (var i = 0; i < n; i++) { var q = pt(i, r); p.push(q[0].toFixed(1) + ',' + q[1].toFixed(1)); }
      return p.join(' ');
    }

    var s = ['<svg class="radar" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="선호 장르 그래프">'];
    for (var lv = MAX; lv >= 1; lv--) {
      s.push('<polygon points="' + poly(R * lv / MAX) + '" fill="' + (lv === MAX ? '#fcf7ec' : 'none') +
        '" stroke="#cdd2d9" stroke-width="1"/>');
    }
    for (var i = 0; i < n; i++) {
      var e = pt(i, R);
      s.push('<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '" stroke="#cdd2d9" stroke-width="1"/>');
    }
    var vals = [];
    for (var j = 0; j < n; j++) {
      var q2 = pt(j, R * Math.max(0, Math.min(MAX, Number(axes[j].value) || 0)) / MAX);
      vals.push(q2[0].toFixed(1) + ',' + q2[1].toFixed(1));
    }
    s.push('<polygon points="' + vals.join(' ') + '" fill="rgba(94,76,255,.18)" stroke="#5e4cff" stroke-width="2" stroke-linejoin="round"/>');
    for (var k = 0; k < n; k++) {
      var qp = pt(k, R * Math.max(0, Math.min(MAX, Number(axes[k].value) || 0)) / MAX);
      s.push('<rect x="' + (qp[0] - 3).toFixed(1) + '" y="' + (qp[1] - 3).toFixed(1) + '" width="6" height="6" rx="1" fill="#5e4cff"/>');
    }
    /* 축 이름은 다각형 위에만 */
    for (var m = 0; m < n; m++) {
      var lp = pt(m, R + 20);
      var anchor = Math.abs(lp[0] - cx) < 8 ? 'middle' : (lp[0] > cx ? 'start' : 'end');
      var filled = has(axes[m].label);
      s.push('<text x="' + lp[0].toFixed(1) + '" y="' + (lp[1] + 4).toFixed(1) + '" text-anchor="' + anchor +
        '" font-size="' + (n > 6 ? 12 : 13) + '" font-weight="500" fill="' + (filled ? '#36394a' : '#a4abb8') + '">' +
        esc(filled ? axes[m].label : '축 ' + (m + 1)) + '</text>');
    }
    return s.join('') + '</svg>';
  }

  /* 출시 연식 도넛 그래프 */
  var DONUT_TONES = ['#5e4cff', '#b3a9ff', '#dfdbff'];
  function donut(list) {
    if (!hasList(list)) return phBlock('출시 연식 비율', 'CONTENT.history.freshness');

    var total = 0, i;
    for (i = 0; i < list.length; i++) total += Math.max(0, Number(list[i].value) || 0);
    if (!total) total = 1;

    var R = 60, C = 2 * Math.PI * R, offset = 0, segs = [];
    for (i = 0; i < list.length; i++) {
      var v = Math.max(0, Number(list[i].value) || 0);
      var len = C * v / total;
      segs.push('<circle cx="85" cy="85" r="' + R + '" fill="none" stroke="' +
        DONUT_TONES[i % DONUT_TONES.length] + '" stroke-width="26" ' +
        'stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" ' +
        'stroke-dashoffset="' + (-offset).toFixed(2) + '"/>');
      offset += len;
    }

    var top = list[0];
    return '<div class="donut">' +
      '<div class="donut__legend">' + list.map(function (it, k) {
        return '<span class="donut__lg"><span class="donut__sw" style="background:' +
          DONUT_TONES[k % DONUT_TONES.length] + '"></span>' + txt(it.label, '항목') + '</span>';
      }).join('') + '</div>' +
      '<div class="donut__body">' +
        '<svg class="donut__svg" viewBox="0 0 170 170" role="img" aria-label="출시 연식 비율">' +
          '<g transform="rotate(-90 85 85)">' + segs.join('') + '</g>' +
        '</svg>' +
        '<div class="donut__call">' +
          '<div class="donut__pct">' + (Number(top.value) || 0) + '%</div>' +
          '<div class="donut__lab">' + txt(top.label, '항목') + '</div>' +
          '<div class="donut__note">' + txt(top.note, '설명') + '</div>' +
        '</div>' +
      '</div></div>';
  }

  /* 검색 대상 태그 — 플랫폼 · 장르만 */
  var FILTER_KEYS = [
    { key: 'platform', label: '플랫폼', all: '플랫폼 전체' },
    { key: 'genre',    label: '장르',   all: '장르 전체' }
  ];
  function tagGroups() {
    var games = (CONTENT.history && CONTENT.history.games) || [];
    var g = { platform: [], genre: [] };
    games.forEach(function (x) {
      FILTER_KEYS.forEach(function (f) {
        var v = x[f.key];
        if (has(v) && g[f.key].indexOf(v) === -1) g[f.key].push(v);
      });
    });
    g.platform.sort(); g.genre.sort();
    return g;
  }

  var filterState = { platform: '', genre: '' };

  function matches(g) {
    for (var i = 0; i < FILTER_KEYS.length; i++) {
      var k = FILTER_KEYS[i].key;
      if (filterState[k] && g[k] !== filterState[k]) return false;
    }
    return true;
  }

  function gameCard(g) {
    return '<article class="game">' +
      imgOr(g.image, g.title || '', 'game__img', 'game__img-ph', '이미지') +

        (has(g.ending) ? '<span class="game__tag game__tag--e">' + esc(g.ending) + '</span>' : '') +
      '</div></div></article>';
  }

    var host = document.getElementById('gamesHost');

    if (!host) return;
    var games = (CONTENT.history && CONTENT.history.games) || [];
    if (!games.length) {

      if (countEl) countEl.innerHTML = '<b>0</b>개';
      return;
    }
    var shown = games.filter(matches);
    host.innerHTML = shown.length
      ? '<div class="games">' + shown.map(gameCard).join('') + '</div>'
      : '<div class="games-empty"><div class="ph-block">조건에 맞는 게임이 없습니다.</div></div>';
    if (countEl) countEl.innerHTML = '<b>' + shown.length + '</b>개 / 전체 ' + games.length + '개';
  }

  function renderHistory() {
    var t = CONTENT.history || {};
    var groups = tagGroups();
    var h = ['<div class="band"><div class="wrap">'];
    h.push(sectionHead('chart', 'History', '선호 장르 · 플레이 기록', 'history'));

    h.push('<div class="hist__top">');
    h.push('<div class="radar-wrap">' + radarSVG(t.axes || []) + '</div>');

    h.push('<div>');
    h.push(donut(t.freshness));
    h.push('<div class="count--hero">' +
      '<div class="count__v">' + txt(t.total && t.total.value, '총 개수') + '</div>' +
      '<div class="count__l">' + txt(t.total && t.total.label, '게임 총 개수') + '</div></div>');
    h.push('<div class="plat">' + (t.platforms || []).map(function (pf) {
      var pct = Math.max(0, Math.min(100, Number(pf.percent) || 0));
      return '<div class="plat__cell"><div class="plat__l">' + txt(pf.label, '플랫폼') + '</div>' +
        '<div class="plat__v">' + txt(pf.value, '수치') + '</div>' +
        '<div class="plat__bar"><i style="width:' + pct + '%"></i></div></div>';
    }).join('') + '</div>');

    /* 태그 드롭다운 — 수치 바로 아래 */
    h.push('<div class="filter">');
    FILTER_KEYS.forEach(function (f) {
      var list = groups[f.key] || [];
      h.push('<label class="fsel"><span class="fsel__l">' + esc(f.label) + '</span>' +
        '<span class="fsel__box"><select data-filter="' + f.key + '"' + (list.length ? '' : ' disabled') + '>' +
          '<option value="">' + esc(f.all) + '</option>' +
          list.map(function (v) {
            return '<option value="' + esc(v) + '"' +
              (filterState[f.key] === v ? ' selected' : '') + '>' + esc(v) + '</option>';
          }).join('') +
        '</select>' +
        '<svg class="fsel__caret" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true">' +
        '<path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg></span></label>');
    });
    h.push('<div class="filter__foot">' +
      '<span class="filter__count" id="gamesCount"></span>' +
      '<button type="button" class="btn btn--ghost btn--sm" id="gameReset">초기화</button>' +
      '</div>');
    h.push('</div>');

    h.push('</div></div>');
    h.push('</div></div>');

    /* 게임 목록 — 제목 바로 아래에 게임이 뜬다 */
    h.push('<div class="band band--cloud"><div class="wrap">');
    h.push(sectionHead('domino', 'Games', '플레이한 게임', 'games'));
    h.push('<div id="gamesHost"></div>');
    h.push('</div></div>');
    return h.join('');
  }

  function bindHistory() {
    var sels = document.querySelectorAll('[data-filter]');
    for (var i = 0; i < sels.length; i++) {
      (function (sel) {
        sel.addEventListener('change', function () {
          filterState[sel.getAttribute('data-filter')] = sel.value;
          paintGames();
        });
      })(sels[i]);
    }
    var reset = document.getElementById('gameReset');
    if (reset) {
      reset.addEventListener('click', function () {
        FILTER_KEYS.forEach(function (f) { filterState[f.key] = ''; });
        var s2 = document.querySelectorAll('[data-filter]');
        for (var j = 0; j < s2.length; j++) s2[j].value = '';
        paintGames();
      });
    }
    paintGames();
  }

  /* ================================================================
   *  라우터
   * ================================================================ */
  var ROUTES = ['about', 'resume', 'portfolio', 'post', 'history'];
  var rendered = {};

  function parseHash() {
    var raw = (location.hash || '').replace(/^#\/?/, '');
    var parts = raw.split('/');
    var route = parts[0] || 'about';
    if (ROUTES.indexOf(route) === -1) route = 'about';
    return { route: route, param: parts[1] || '' };
  }

  function render(state) {
    var key = state.route + '/' + state.param;
    var host = document.getElementById('route-' + state.route);
    if (!host) return;
    if (rendered[state.route] !== key) {
      if (state.route === 'about') { host.innerHTML = renderAbout(); armMosaic(); }
      else if (state.route === 'resume') { host.innerHTML = renderResume(state.param); bindProjectList(); }
      else if (state.route === 'portfolio') host.innerHTML = withMosaic(renderPortfolio());
      else if (state.route === 'post') host.innerHTML = withMosaic(renderPost(state.param));
      else if (state.route === 'history') { host.innerHTML = withMosaic(renderHistory()); bindHistory(); }
      rendered[state.route] = key;
    }

    var sections = document.querySelectorAll('.route');
    for (var i = 0; i < sections.length; i++) {
      var on = sections[i].getAttribute('data-route') === state.route;
      sections[i].classList.toggle('is-active', on);
      if (on) sections[i].removeAttribute('hidden'); else sections[i].setAttribute('hidden', '');
    }

    var navActive = state.route === 'post' ? 'portfolio' : state.route;
    var links = document.querySelectorAll('.navlink');
    for (var j = 0; j < links.length; j++) {
      links[j].classList.toggle('is-active', links[j].getAttribute('data-route') === navActive);
    }
    document.title = has(CONTENT.meta && CONTENT.meta.siteTitle) ? CONTENT.meta.siteTitle : 'Portfolio';
  }

  /* 연출이 끝나면 애니메이션 클래스를 떼어 두 번 다시 재생되지 않게 한다 */
  function armMosaic() {
    var el = document.querySelector('.mosaic--in');
    if (!el || mosaicPlayed) return;
    mosaicPlayed = true;
    setTimeout(function () { el.classList.remove('mosaic--in'); }, 1900);
  }

  var lastKey = '';
  function onRoute(scroll) {
    var state = parseHash();
    var key = state.route + '/' + state.param;
    render(state);
    if (scroll && key !== lastKey) window.scrollTo(0, 0);
    lastKey = key;
  }

  function boot() {
    var meta = CONTENT.meta || {};
    if (has(meta.brandMark)) document.getElementById('brandMark').textContent = meta.brandMark;
    if (has(meta.brandName)) document.getElementById('brandName').textContent = meta.brandName;
    document.getElementById('footerName').innerHTML = txt(meta.footerName, '이름');
    document.getElementById('footerUpdated').innerHTML =
      has(meta.updated) ? '최종 수정 ' + esc(meta.updated) : ph('최종 수정 일자');

    if (!location.hash) location.replace('#about');
    onRoute(false);
    window.addEventListener('hashchange', function () { onRoute(true); }, false);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
