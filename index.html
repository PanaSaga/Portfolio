  /* ================================================================
   *  4. History
   * ================================================================ */
  function radarSVG(axes) {
    var n = axes.length;
    if (n < 3) return phBlock('축이 3개 이상이어야 그래프가 그려집니다', 'CONTENT.history.axes');
    var W = 460, H = 360, cx = 230, cy = 172, R = 102, MAX = 5;

    function pt(i, r) {
      var a = (-90 + i * 360 / n) * Math.PI / 180;
      return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    }
    function poly(r) {
      var p = [];
      for (var i = 0; i < n; i++) { var q = pt(i, r); p.push(q[0].toFixed(1) + ',' + q[1].toFixed(1)); }
      return p.join(' ');
    }

    var s = ['<svg class="radar" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="선호 장르 그래프">'];
    for (var lv = MAX; lv >= 1; lv--) {
      s.push('<polygon points="' + poly(R * lv / MAX) + '" fill="' + (lv === MAX ? '#f7f5f2' : 'none') +
        '" stroke="#cdd2d9" stroke-width="1"/>');
    }
    for (var i = 0; i < n; i++) {
      var e = pt(i, R);
      s.push('<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '" stroke="#cdd2d9" stroke-width="1"/>');
    }
    var vals = [];
    for (var j = 0; j < n; j++) {
      var q2 = pt(j, R * Math.max(0, Math.min(MAX, Number(axes[j].value) || 0)) / MAX);
      vals.push(q2[0].toFixed(1) + ',' + q2[1].toFixed(1));
    }
    s.push('<polygon points="' + vals.join(' ') + '" fill="rgba(94,76,255,.18)" stroke="#5e4cff" stroke-width="2" stroke-linejoin="round"/>');
    for (var k = 0; k < n; k++) {
      var qp = pt(k, R * Math.max(0, Math.min(MAX, Number(axes[k].value) || 0)) / MAX);
      s.push('<rect x="' + (qp[0] - 3).toFixed(1) + '" y="' + (qp[1] - 3).toFixed(1) + '" width="6" height="6" rx="1" fill="#5e4cff"/>');
    }
    /* 축 이름은 다각형 위에만 */
    for (var m = 0; m < n; m++) {
      var lp = pt(m, R + 20);
      var anchor = Math.abs(lp[0] - cx) < 8 ? 'middle' : (lp[0] > cx ? 'start' : 'end');
      var filled = has(axes[m].label);
      s.push('<text x="' + lp[0].toFixed(1) + '" y="' + (lp[1] + 4).toFixed(1) + '" text-anchor="' + anchor +
        '" font-size="' + (n > 6 ? 12 : 13) + '" font-weight="500" fill="' + (filled ? '#36394a' : '#a4abb8') + '">' +
        esc(filled ? axes[m].label : '축 ' + (m + 1)) + '</text>');
    }
    return s.join('') + '</svg>';
  }

  /* 플랫폼 분포 도넛 그래프 */
  var DONUT_TONES = ['#5e4cff', '#c9c2f5', '#8a76ec', '#e2d9fb', '#4a30dd', '#b3a9ff'];
  function donut(list) {
    if (!hasList(list)) return phBlock('플랫폼 분포', 'CONTENT.history.platforms');

    var total = 0, i;
    for (i = 0; i < list.length; i++) total += Math.max(0, Number(list[i].value) || 0);
    if (!total) total = 1;

    var R = 60, C = 2 * Math.PI * R, offset = 0, segs = [];
    for (i = 0; i < list.length; i++) {
      var v = Math.max(0, Number(list[i].value) || 0);
      var len = C * v / total;
      segs.push('<circle class="donut__seg" data-seg="' + i + '" cx="85" cy="85" r="' + R + '" fill="none" stroke="' +
        DONUT_TONES[i % DONUT_TONES.length] + '" stroke-width="26" ' +
        'stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" ' +
        'stroke-dashoffset="' + (-offset).toFixed(2) + '"><title>' +
        esc(has(list[i].label) ? list[i].label : '항목 ' + (i + 1)) + ' ' + (Number(list[i].value) || 0) + '%</title></circle>');
      offset += len;
    }

    var top = list[0];
    return '<div class="donut">' +
      '<div class="donut__legend">' + list.map(function (it, k) {
        return '<span class="donut__lg"><span class="donut__sw" style="background:' +
          DONUT_TONES[k % DONUT_TONES.length] + '"></span>' + txt(it.label, '항목') + '</span>';
      }).join('') + '</div>' +
      '<div class="donut__body">' +
        '<svg class="donut__svg" viewBox="0 0 170 170" role="img" aria-label="플랫폼 분포 비율">' +
          '<g transform="rotate(-90 85 85)">' + segs.join('') + '</g>' +
        '</svg>' +
        '<div class="donut__call" id="donutCall">' +
          '<div class="donut__pct" data-slot="pct">' + (Number(top.value) || 0) + '%</div>' +
          '<div class="donut__lab" data-slot="lab">' + txt(top.label, '항목') + '</div>' +
          '<div class="donut__note" data-slot="note">' + txt(top.note, '설명') + '</div>' +
        '</div>' +
      '</div>' +
      '<script type="application/json" id="donutData">' + JSON.stringify(list) + '</scr' + 'ipt>' +
      '</div>';
  }

  /* 검색 대상 태그 — 플랫폼 · 장르만 */
  var FILTER_KEYS = [
    { key: 'platform', prop: 'platforms', label: '플랫폼', all: '플랫폼 전체' },
    { key: 'genre',    prop: 'genres',    label: '장르',   all: '장르 전체' }
  ];
  function tagGroups() {
    var games = (CONTENT.history && CONTENT.history.games) || [];
    var g = { platform: [], genre: [] };
    games.forEach(function (x) {
      FILTER_KEYS.forEach(function (f) {
        (x[f.prop] || []).forEach(function (v) {
          if (has(v) && g[f.key].indexOf(v) === -1) g[f.key].push(v);
        });
      });
    });
    g.platform.sort(); g.genre.sort();
    return g;
  }

  var filterState = { platform: '', genre: '' };

  function matches(g) {
    for (var i = 0; i < FILTER_KEYS.length; i++) {
      var f = FILTER_KEYS[i];
      if (filterState[f.key] && (g[f.prop] || []).indexOf(filterState[f.key]) === -1) return false;
    }
    return true;
  }

  function gameCard(g) {
    var plats = (g.platforms || []).filter(has);
    var genres = (g.genres || []).filter(has);
    return '<article class="game">' +
      imgOr(g.image, g.title || '', 'game__img', 'game__img-ph', '이미지') +
      '<div class="game__b"><div class="game__t">' + txt(g.title, '게임명') + '</div>' +
      '<div class="game__meta">' +
        '<div class="game__row">' +
          plats.map(function (p) { return '<span class="game__tag game__tag--p">' + esc(p) + '</span>'; }).join('') +
          (has(g.date) ? '<span class="game__date">' + esc(g.date) + '</span>' : '') +
        '</div>' +
        (genres.length ? '<div class="game__row">' +
          genres.map(function (v) { return '<span class="game__tag">' + esc(v) + '</span>'; }).join('') +
        '</div>' : '') +
        (has(g.play) ? '<div class="game__row"><span class="game__tag game__tag--e">' + esc(g.play) + '</span></div>' : '') +
      '</div></div></article>';
  }

  function paintGames() {
    var host = document.getElementById('gamesHost');
    var countEl = document.getElementById('gamesCount');
    if (!host) return;
    var games = (CONTENT.history && CONTENT.history.games) || [];
    if (!games.length) {
      host.innerHTML = '<div class="games-empty">' + phBlock('플레이한 게임 목록', 'CONTENT.history.games') + '</div>';
      if (countEl) countEl.innerHTML = '<b>0</b>개';
      return;
    }
    var shown = games.filter(matches);
    host.innerHTML = shown.length
      ? '<div class="games">' + shown.map(gameCard).join('') + '</div>'
      : '<div class="games-empty"><div class="ph-block">조건에 맞는 게임이 없습니다.</div></div>';
    if (countEl) countEl.innerHTML = '<b>' + shown.length + '</b>개 / 전체 ' + games.length + '개';
  }

  function renderHistory() {
    var t = CONTENT.history || {};
    var groups = tagGroups();
    var h = ['<div class="band"><div class="wrap">'];
    h.push(sectionHead('chart', 'History', '선호 장르 · 플레이 기록', 'history'));

    h.push('<div class="hist__top">');
    /* 왼쪽 — 육각형 + 총 개수 한 카드 */
    h.push('<div class="histcard">' +
      '<div class="radar-wrap-inner">' + radarSVG(t.axes || []) + '</div>' +
      '<div class="gcounts">' + (t.counts || []).map(function (c) {
        return '<div class="gcount"><div class="gcount__l">' +
          '<span class="gcount__t">' + txt(c.title, '큰 제목') + '</span>' +
          '<span class="gcount__d">' + txt(c.desc, '작은 내용') + '</span></div>' +
          '<span class="gcount__v">' + txt(c.value, '0') + '</span></div>';
      }).join('') + '</div></div>');

    /* 오른쪽 — 도넛 + 필터 */
    h.push('<div class="hist__right">');
    h.push(donut(t.platforms));

    /* 태그 드롭다운 */
    h.push('<div class="filter">');
    FILTER_KEYS.forEach(function (f) {
      var list = groups[f.key] || [];
      h.push('<label class="fsel"><span class="fsel__l">' + esc(f.label) + '</span>' +
        '<span class="fsel__box"><select data-filter="' + f.key + '"' + (list.length ? '' : ' disabled') + '>' +
          '<option value="">' + esc(f.all) + '</option>' +
          list.map(function (v) {
            return '<option value="' + esc(v) + '"' +
              (filterState[f.key] === v ? ' selected' : '') + '>' + esc(v) + '</option>';
          }).join('') +
        '</select>' +
        '<svg class="fsel__caret" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true">' +
        '<path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg></span></label>');
    });
    h.push('<div class="filter__foot">' +
      '<span class="filter__count" id="gamesCount"></span>' +
      '<button type="button" class="btn btn--ghost btn--sm" id="gameReset">초기화</button>' +
      '</div>');
    h.push('</div>');

    h.push('</div></div>');
    h.push('</div></div>');

    /* 게임 목록 — 제목 바로 아래에 게임이 뜬다 */
    h.push('<div class="band band--cloud"><div class="wrap">');
    h.push(sectionHead('domino', 'Games', '플레이한 게임', 'games'));
    h.push('<div id="gamesHost"></div>');
    h.push('</div></div>');
    return h.join('');
  }

  function bindDonut() {
    var data = document.getElementById('donutData');
    var call = document.getElementById('donutCall');
    if (!data || !call) return;
    var list;
    try { list = JSON.parse(data.textContent); } catch (e) { return; }
    var slotPct = call.querySelector('[data-slot=pct]');
    var slotLab = call.querySelector('[data-slot=lab]');
    var slotNote = call.querySelector('[data-slot=note]');
    function show(i) {
      var d = list[i]; if (!d) return;
      slotPct.textContent = (Number(d.value) || 0) + '%';
      slotLab.textContent = has(d.label) ? d.label : '항목 ' + (i + 1);
      slotNote.textContent = has(d.note) ? d.note : '';
    }
    var segs = document.querySelectorAll('.donut__seg');
    for (var i = 0; i < segs.length; i++) {
      (function (idx) {
        segs[idx].addEventListener('mouseenter', function () { show(idx); });
        segs[idx].addEventListener('focus', function () { show(idx); });
      })(Number(segs[i].getAttribute('data-seg')));
    }
    var svg = document.querySelector('.donut__svg');
    if (svg) svg.addEventListener('mouseleave', function () { show(0); });
  }

  function bindHistory() {
    bindDonut();
    var sels = document.querySelectorAll('[data-filter]');
    for (var i = 0; i < sels.length; i++) {
      (function (sel) {
        sel.addEventListener('change', function () {
          filterState[sel.getAttribute('data-filter')] = sel.value;
          paintGames();
        });
      })(sels[i]);
    }
    var reset = document.getElementById('gameReset');
    if (reset) {
      reset.addEventListener('click', function () {
        FILTER_KEYS.forEach(function (f) { filterState[f.key] = ''; });
        var s2 = document.querySelectorAll('[data-filter]');
        for (var j = 0; j < s2.length; j++) s2[j].value = '';
        paintGames();
      });
    }
    paintGames();
  }

  /* ================================================================
   *  라우터
   * ================================================================ */
  var ROUTES = ['about', 'resume', 'portfolio', 'post', 'history'];
  var rendered = {};

  function parseHash() {
    var raw = (location.hash || '').replace(/^#\/?/, '');
    var parts = raw.split('/');
    var route = parts[0] || 'about';
    if (ROUTES.indexOf(route) === -1) route = 'about';
    return { route: route, param: parts[1] || '' };
  }

  function render(state) {
    var key = state.route + '/' + state.param;
    var host = document.getElementById('route-' + state.route);
    if (!host) return;
    if (rendered[state.route] !== key) {
      if (state.route === 'about') { host.innerHTML = renderAbout(); armMosaic(); }
      else if (state.route === 'resume') { host.innerHTML = renderResume(state.param); bindProjectList(); bindIntro(); }
      else if (state.route === 'portfolio') host.innerHTML = withMosaic(renderPortfolio());
      else if (state.route === 'post') { host.innerHTML = withMosaic(renderPost(state.param)); bindPlanner(); }
      else if (state.route === 'history') { host.innerHTML = withMosaic(renderHistory()); bindHistory(); }
      rendered[state.route] = key;
    }

    var sections = document.querySelectorAll('.route');
    for (var i = 0; i < sections.length; i++) {
      var on = sections[i].getAttribute('data-route') === state.route;
      sections[i].classList.toggle('is-active', on);
      if (on) sections[i].removeAttribute('hidden'); else sections[i].setAttribute('hidden', '');
    }

    var navActive = state.route === 'post' ? 'portfolio' : state.route;
    var links = document.querySelectorAll('.navlink');
    for (var j = 0; j < links.length; j++) {
      links[j].classList.toggle('is-active', links[j].getAttribute('data-route') === navActive);
    }
    document.title = has(CONTENT.meta && CONTENT.meta.siteTitle) ? CONTENT.meta.siteTitle : 'Portfolio';

    /* 히어로 Z자 정렬 — 컨테이너가 보인 뒤(위 is-active 토글 이후) 측정해야 한다.
       레이아웃/웹폰트 로드 타이밍 때문에 첫 로드에서 안 걸리던 문제를 방지: rAF·폰트 로드 후 재계산 */
    if (state.route === 'about') {
      staggerLogline();
      window.requestAnimationFrame(staggerLogline);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          if (parseHash().route === 'about') staggerLogline();
        });
      }
    }
  }

  /* 연출이 끝나면 애니메이션 클래스를 떼어 두 번 다시 재생되지 않게 한다 */
  function armMosaic() {
    var el = document.querySelector('.mosaic--in');
    if (!el || mosaicPlayed) return;
    mosaicPlayed = true;
    setTimeout(function () { el.classList.remove('mosaic--in'); }, 1900);
  }

  /* 히어로 둘째 줄을 첫 줄의 둘째 어절 아래에서 시작하도록 들여쓴다(Z자 배열) */
  function staggerLogline() {
    var ll = document.querySelector('.hero__logline');
    if (!ll) return;
    var lines = ll.querySelectorAll('.zl');
    if (lines.length < 2) return;
    var first = lines[0].textContent || '';
    var sp = first.indexOf(' ');
    lines[1].style.paddingLeft = '';
    if (sp <= 0) return;
    var meas = document.createElement('span');
    meas.style.cssText = 'visibility:hidden;position:absolute;white-space:pre;font:inherit;';
    meas.textContent = first.slice(0, sp + 1);      // 첫 어절 + 공백
    lines[0].appendChild(meas);
    var w = meas.getBoundingClientRect().width;
    lines[0].removeChild(meas);
    lines[1].style.paddingLeft = w + 'px';
  }

  var lastKey = '';
  function onRoute(scroll) {
    var state = parseHash();
    var key = state.route + '/' + state.param;
    render(state);
    if (scroll && key !== lastKey) window.scrollTo(0, 0);
    lastKey = key;
  }

  function boot() {
    var meta = CONTENT.meta || {};
    if (has(meta.brandMark)) document.getElementById('brandMark').textContent = meta.brandMark;
    if (has(meta.brandName)) document.getElementById('brandName').textContent = meta.brandName;
    document.getElementById('footerName').innerHTML = txt(meta.footerName, '이름');
    document.getElementById('footerUpdated').innerHTML =
      has(meta.updated) ? '최종 수정 ' + esc(meta.updated) : ph('최종 수정 일자');

    if (!location.hash) location.replace('#about');
    onRoute(false);
    window.addEventListener('hashchange', function () { onRoute(true); }, false);
    window.addEventListener('resize', function () {
      if (parseHash().route === 'about') staggerLogline();
    }, false);
    customCursor();
  }

  /* 커스텀 커서 — 손가락(클릭 가능) 위에서만 주황 발광 화살표, 클릭 시 노란 반짝이.
     그 외에는 시스템 기본 커서. */
  function customCursor() {
    if (!window.matchMedia || !window.matchMedia('(pointer:fine)').matches) return;
    var HOVER = 'a,button,select,summary,label,input,.navlink,.tab,.ppage,.donut__seg,[role=button]';
    var dot = document.createElement('div');
    dot.className = 'cursor';
    dot.innerHTML =
      '<svg viewBox="0 0 28 28" aria-hidden="true">' +
      '<defs><linearGradient id="curGrad" x1="0.1" y1="0" x2="0.7" y2="1">' +
      '<stop offset="0" stop-color="#6d22e6"/><stop offset="0.55" stop-color="#9a1fe4"/>' +
      '<stop offset="1" stop-color="#c71ad4"/></linearGradient></defs>' +
      '<path fill="url(#curGrad)" d="M2.5 2 L2.5 22 L7.7 17.6 L11 24.8 L13.9 23.5 L10.6 16.6 L17.6 16.6 Z"/></svg>';
    document.body.appendChild(dot);
    var x = 0, y = 0, shown = false;
    document.addEventListener('mousemove', function (e) {
      x = e.clientX; y = e.clientY;
      dot.style.left = x + 'px'; dot.style.top = y + 'px';
      if (!shown) { shown = true; dot.style.opacity = '1'; }
    }, { passive: true });
    document.addEventListener('mouseover', function (e) {
      if (e.target.closest && e.target.closest(HOVER)) dot.classList.add('is-hover');
    });
    document.addEventListener('mouseout', function (e) {
      var to = e.relatedTarget;
      if (e.target.closest && e.target.closest(HOVER) &&
          !(to && to.closest && to.closest(HOVER))) dot.classList.remove('is-hover');
    });
    document.addEventListener('mousedown', function (e) {
      dot.classList.add('is-down');
      sparkle(e.clientX, e.clientY);
    });
    document.addEventListener('mouseup', function () { dot.classList.remove('is-down'); });
    function sparkle(px, py) {
      var n = 7;
      for (var i = 0; i < n; i++) {
        var s = document.createElement('div');
        s.className = 'spark';
        var ang = (Math.PI * 2 * i) / n + Math.random() * 0.7;
        var dist = 16 + Math.random() * 22;
        s.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
        s.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(1) + 'px');
        s.style.left = px + 'px';
        s.style.top = py + 'px';
        document.body.appendChild(s);
        (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 520); })(s);
      }
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
